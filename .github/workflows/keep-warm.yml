name: Keep API warm

# Render's free tier spins the API down after ~15 min idle, so the first request
# then waits ~50s for a cold start (and the web app's server-side fetch can time
# out → "could not be loaded"). Pinging /healthz on a schedule keeps it awake.
#
# NOTE: GitHub's scheduled runs are best-effort and can be delayed under load, so
# this reduces cold starts but doesn't eliminate them. For rock-solid uptime use
# an external monitor (cron-job.org / UptimeRobot) hitting the same URL every
# ~10 min — that also gives you downtime alerts.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          curl -sS --max-time 120 --retry 2 --retry-delay 30 \
            https://channelwatch-api.onrender.com/healthz && echo " — pinged"
