name: CI

on:
  push:
    branches: [main]
  pull_request:

# Silence Turborepo's anonymous telemetry banner in CI (harmless, but noisy).
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres for the DB-gated integration tests (services/api). Without a
    # reachable DATABASE_URL those tests skip; with this service they RUN in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: channelwatch
          POSTGRES_PASSWORD: channelwatch
          POSTGRES_DB: channelwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U channelwatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://channelwatch:channelwatch@localhost:5432/channelwatch

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      # Migrations must run BEFORE the test step so the DB-gated API suites
      # (services/api/tests/*.integration.test.ts) find their tables. The
      # postgres service above provides the reachable DATABASE_URL that makes
      # those suites RUN instead of skipping.
      - name: Apply database migrations
        run: pnpm --filter @channelwatch/api run db:migrate

      # `pnpm exec` runs the workspace-local turbo binary (node_modules/.bin);
      # a bare `turbo` is not on PATH in CI and would fail with command-not-found.
      - name: Lint, typecheck, test, build
        run: pnpm exec turbo run lint typecheck test build
