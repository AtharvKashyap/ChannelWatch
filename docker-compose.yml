services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: channelwatch
      POSTGRES_PASSWORD: channelwatch
      POSTGRES_DB: channelwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U channelwatch -d channelwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

