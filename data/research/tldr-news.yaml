review:
  researched_by: claude-research-agent-m1
  notes: >
    Handle discrepancy: the brief specified "@TLDRnewsUK", but that handle
    404s on youtube.com; the live, canonical handle for this channel is
    "@TLDRnews" (channel id UCSMqateX8OA2s1wsOR2EgJA, confirmed via the
    channel's own canonical link and ownerUrls metadata). Sibling channels
    TLDRnewsEU and TLDRnewsGLOBAL exist but were out of scope per the brief
    and were not researched. Founding date is month/year only (April 2017)
    in every source found (Wikipedia; press coverage); effective_from was
    omitted from relationship 1 rather than guessing a day — a human
    reviewer with access to a more precise source could add it.
    Ownership_percentage was omitted from relationship 2 (Jack Kelly's stake
    in THREE26 LTD) because UK Companies House PSC records report a
    statutory ownership band ("75% or more"), not an exact percentage; a
    reviewer with access to the Confirmation Statement / share register
    could tighten this to an exact figure. No other shareholders, directors,
    or PSC entries were found for THREE26 LTD (single officer, single PSC),
    and no evidence of external investment, private equity, or corporate
    acquisition was found for either THREE26 LTD or the channel. Did not
    include a HOSTED_BY relationship for Jack Kelly: he is widely reported
    (IMDb credits, press coverage) as a/the host across the TLDR Network's
    channels, but no source specifically confirms his hosting role tied to
    this exact channel (vs. sibling channels), so it was left out per the
    precision-over-recall rule rather than asserted loosely — worth a
    reviewer's follow-up. Wikipedia was used only as a Tier 2 corroborating
    source for the founding-date claim (relationship 1); the ownership
    relationships (0 and 2) rely solely on Tier 1 primary sources (the
    channel's own About page and UK Companies House filings) even though
    Wikipedia's own text corroborates them, to avoid over-relying on a
    user-editable source for the higher-stakes ownership facts.
  last_reviewed_at: "2026-07-22"
