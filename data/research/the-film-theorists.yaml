review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally omitted — not yet human-reviewed (schema rejects an
  # explicit null; absence signals "unreviewed").
  last_reviewed_at: "2026-07-22"
  notes: >
    DRAFT — requires human review. KEY CORRECTIONS TO THE BRIEF: (1) The
    acquisition was announced 2022-12-20 (late 2022), NOT "early 2024." The 2024
    event is a separate development — MatPat stepping down as on-camera host
    (announced 2024-01-09; final Theory episode 2024-03-09). (2) The brief's
    premise "Lunar X (a GoDigital Media Group company)" could NOT be verified.
    Reputable coverage and company profiles describe Lunar X as an independent,
    Berlin-based media company (Lunar X GmbH, founded 2021 by CEO Lucas Kollmann,
    VC-backed by Cadence Growth Capital, Claret Capital Partners, Creandum, 468
    Capital). GoDigital Media Group is a separate Los Angeles conglomerate
    (founded 2006 by Jason Peterson). No T1/T2 source documents a GoDigital ->
    Lunar X ownership/parent edge; per PRECISION-OVER-RECALL, GoDigital is OMITTED
    from the graph. A reviewer should independently confirm whether any GoDigital
    connection exists before adding it.

    CHAIN & CONFIDENCE. (0) Theorist Media OWNS the channel: HIGH-ish. The Film
    Theorists is consistently listed as one of Theorist Media's channels (T1
    creator video + T2 Tubefilter). Exact operating/holding legal entity for the
    channel not pinned; control modeled as CONTROLLING. (1) Lunar X OWNS Theorist
    Media: HIGH. MatPat's own video (T1) + Tubefilter x2 (T2). Note MatPat sold
    the MAJORITY (not necessarily 100%); ownership_percentage undisclosed, so
    omitted; deal price undisclosed. (2-4) Founding edges: MatPat created Film
    Theory; MatPat & Stephanie Patrick founded/ran Theorist Media (he=CEO,
    she=COO post-sale). (5) MatPat HOSTED_BY ended 2024-03-09. (6) Lee Collins new
    Film Theory host from 2024-03-09 (T2). (7) MatPat continued involvement:
    modeled as CREATIVE_CONTROL_BY (MANAGEMENT), confidence LOW — the "creative
    director" quote is framed across the Theory channels generally, not Film
    Theory specifically; reviewer may drop or refine this edge.

    DATES. All full YYYY-MM-DD. Acquisition 2022-12-20 (announcement/video date).
    MatPat final host episode 2024-03-09 (Tubefilter "March 9"; year 2024 from
    context). No partial dates asserted.

    ENTITY GAPS. Theorist Media legal name/jurisdiction/incorporation not verified
    (Los Angeles based). Lunar X legal entity "Lunar X GmbH" per lunar-x.com
    footer; jurisdiction DE. Founders' exact equity split and Lunar X's stake
    percentage undisclosed.

    NON-OWNERSHIP CONTEXT. MatPat later announced a fuller step-back; his final
    GTLive stream aired 2024-10-26. This does not change the Theorist Media <-
    Lunar X ownership chain but the reviewer should re-verify currency and any
    later change in the Patricks' roles.

    SOURCES. T1: The Game Theorists video "Game Theory: This is Not My Channel"
    (2022-12-20, DIRECT_CREATOR_CONFIRMATION). T2: Tubefilter (2022-12-20 and
    2024-01-09). No Tier 4 used. Excerpts are close paraphrase/quote from fetched
    content and should be re-verified verbatim against originals at review.
