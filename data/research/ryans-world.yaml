  last_reviewed_at: 2026-07-23
  notes: >-
    DRAFT for human review — "creator/family-owned channel with an external
    MEDIA-COMPANY management/representation relationship (NOT ownership)" case.
    Requires human verification before publication.

    CHANNEL ID. UChGJGhZ9SOOHvBB0Y4DOO_w, taken from the "externalId" field in
    the raw HTML of https://www.youtube.com/@RyansWorld (curl, no JS execution).
    Distinct from several unrelated "channelId" values (featured/recommended
    modules) also present in the page source. Reviewer should confirm against
    the live channel.

    OWNERSHIP vs MANAGEMENT — the core finding. Ownership/control of the channel
    sits with Ryan Kaji and his family, operated through their own production
    company, Sunlight Entertainment (Shion Kaji is named CEO in the 2024 joint
    press release). pocket.watch (PocketWatch, Inc.) is a MEDIA COMPANY that
    REPRESENTS/MANAGES the Ryan's World brand — Wikipedia's own definition of
    pocket.watch is "talent management, project financing, and merchandising";
    it "does the marketing and merchandise for Ryan's YouTube channels" and
    "collaborated with Ryan ToysReview to create Ryan's World, a consumer
    products brand." NO fetched source states that pocket.watch owns the channel
    or the brand. Recorded as REPRESENTS + control_level MANAGEMENT accordingly.
    Reviewer: do NOT let the depth of the pocket.watch partnership be read as
    ownership.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) rel 1 (Sunlight OPERATES channel, CONTROLLING, conf 0.7). Sources
    establish Sunlight is the Kaji "family-owned and operated production company"
    that "develops" the content; they do NOT state verbatim that Sunlight is the
    channel's legal owner. OPERATES + CONTROLLING is the honest structural
    reading (family controls the channel via its own production company); a
    reviewer may prefer an OWNS/CONTROLS edge or a creator->channel edge if a
    clearer ownership statement is located. Sunlight's legal name/jurisdiction
    were not verified.
    (2) rel 2 (pocket.watch REPRESENTS channel, MANAGEMENT). effective_from set
    to 2018-02 (Wikipedia dates the Ryan's World consumer-products collaboration
    to February 2018); day precision unknown, recorded as the 1st — reviewer to
    refine or drop. The management relationship is well documented and
    long-standing but its exact contractual terms are not public and are NOT
    asserted here (creator-safety / Spec §22.4: no confidential contracts).
    (3) rel 3 (Viacom INVESTED_IN pocket.watch). Documented by THR (T2,
    2018-07-18): Viacom led a $15M round; other investors Greycroft's Tracker
    fund and UTA Ventures. control_level MINORITY reflects "lead investor in a
    venture round" — no controlling stake is stated. CRITICAL: this backing
    attaches to pocket.watch, the channel's REPRESENTATIVE, and does NOT
    establish any Viacom/Paramount ownership of the channel. pocket.watch also
    raised a 2017 Series A (~$6M; Third Wave Digital, UTA, Leslie Moonves, Jon
    Landau, Robert Downey Jr., per Variety) — not recorded as a relationship
    (Variety was paywalled to the fetcher; add if independently verified).
    (4) CURRENCY. Viacom -> ViacomCBS (2019) -> Paramount Global (2022). Whether
    the 2018 pocket.watch stake persists under Paramount today is NOT verified;
    effective_to left open and the edge kept at the entity as it stood in 2018.
    Reviewer to re-verify current pocket.watch cap-table status.
    (5) FOUNDING (temporal emphasis). Channel founded by Ryan Kaji in March 2015
    as "Ryan ToysReview" (Wikipedia); rebranded to "Ryan's World." Day-precision
    date not established, so rel 0 effective_from is omitted rather than guessed.
    Ryan is a minor and the on-screen surname "Kaji" is a stage name (family
    surname Guan) — recorded in aliases; no minor's private data beyond
    already-public brand facts is included (Spec §22.4).
    (6) SOURCE-TYPE MAPPING. The 2024 joint press release (PR Newswire) is the
    companies' own statement; there is no "press release" source_type in the
    enum, so it is mapped to ARCHIVED_CORPORATE_PAGE (Tier 3, corporate
    self-description) and used only for the firms' self-descriptions/boilerplate,
    not as independent corroboration. An archive_url should be captured at review.
    (7) NO PE INVOLVEMENT. No PRIVATE_EQUITY_FIRM entity and no
    PORTFOLIO_COMPANY_OF edge — the §14.3 PE-label gate does not apply. Expected
    computed classification: CREATOR_OWNED / creator-controlled (channel owned
    and operated by the Kaji family; pocket.watch is a management/representation
    partner, not an owner). Confirm the computed label at import.
