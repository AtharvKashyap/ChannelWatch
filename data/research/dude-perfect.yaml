review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally omitted: not yet human-reviewed.
  notes: >
    JUDGMENT CALLS FOR HUMAN REVIEWER:
    (1) Stake type UNDOCUMENTED: the official joint press release (PR
    Newswire, Tier 1) and every Tier 2 business-press article located
    (Hollywood Reporter, Sportico, C21Media, Tubefilter, plus CNBC/Axios/
    Variety/SportsPro which returned 403/blocked on direct fetch and so were
    not used as cited sources) describe this only as a "strategic
    partnership" / "9-figure growth capital investment." None of them state
    a minority or majority stake, an ownership percentage, or board/control
    terms. The only source found that uses the word "minority" (RockWater,
    a media-industry analysis newsletter) explicitly labels its 40%/
    "minority owner" figure as the author's own modeling ASSUMPTION for an
    ROI calculation, not a disclosed deal term. Per the precision-over-
    recall rule, control_level is therefore recorded as UNKNOWN, not
    MINORITY — do not upgrade this without a primary or reputable-secondary
    source that states the stake type explicitly.
    (2) Relationship type: used INVESTED_IN (not OWNS/CONTROLS/ACQUIRED)
    because no source describes a change of ownership or an acquisition —
    only a capital investment/partnership.
    (3) Possible co-investor: PrivSource (privsource.com), a deal-tracking
    database, names a second investor, Pittco Management LLC (family office
    of AutoZone founder Joseph "Pitt" Hyde III), alongside Highmount. This
    was NOT independently corroborated by any Tier 1/2 source successfully
    fetched during this research, so it is omitted from entities/
    relationships entirely (not even as a leads-only source) pending
    verification — flagging for reviewer follow-up rather than including a
    thinly-sourced entity.
    (4) Highmount's entity_type is set to INVESTMENT_FIRM, matching its own
    self-description in the joint press release ("a private investment firm
    focused on early growth-stage and middle market investments"). Some
    secondary coverage (e.g. Hollywood Reporter's headline) labels Highmount
    a "private equity firm" instead; reviewer should confirm which
    classification the platform wants to use before any PE-backed labeling
    is considered — note per methodology §3.4 that a PE-BACKED label
    additionally requires the investment to be by/through a PE firm AND
    control/backing, neither of which is established here.
    (5) Highmount's `website` field is omitted; no official Highmount
    Capital site was independently verified during this research. Reviewer
    should add if confirmed.
    (6) `founders` is modeled as a single CREATOR entity representing the
    five named co-founders (aliases list each name) rather than five
    separate PERSON entities, to keep this pilot record simple; reviewer may
    prefer to split them.
    (7) Channel id UCRijo3ddMTht_IHyNSNXpNQ was corroborated by cross-
    referencing multiple independent third-party stats sites
    (Wikidata, HypeAuditor, filmot, mixerno.space) after YouTube's own page
    did not return channel metadata to the fetch tool (JS-rendered content).
  last_reviewed_at: 2026-07-22
