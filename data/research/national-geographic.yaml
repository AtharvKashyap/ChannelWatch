  notes: DRAFT. Wikipedia (Tier 2) corroborates that National Geographic Partners is 73% owned by The Walt Disney Company (CONTROLLING) and 27% by the National Geographic Society (MINORITY), and that the company oversees the television channels/media; percentages added from that source. The self-referential nationalgeographic.com company page was retyped from DIRECT_CREATOR_CONFIRMATION/Tier 1 to ARCHIVED_CORPORATE_PAGE/Tier 3. That NatGeo Partners specifically owns the YouTube channel (vs. the broader TV/media assets) is INFERRED from the parent-company relationship plus the Wikidata channel-id linkage; confidence for that edge lowered to 0.7 and flagged for corroboration. reviewed_by is absent.
