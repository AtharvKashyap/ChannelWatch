    CORE MODELING DECISION — MCN/NETWORK REPRESENTATION IS NOT OWNERSHIP. Revelmode
    (a Maker Studios sub-network), and later Polaris / Disney Digital Network (the
    Maker successor gaming network), REPRESENTED the jacksepticeye channel; no
    source documents any sale, equity stake, or transfer of the channel itself. The
    relationships are therefore encoded as REPRESENTS (rels 5, 7; status ENDED) and
    SUBSIDIARY_OF / ACQUIRED (rels 3, 4, 6) — NOT as OWNS or FORMERLY_OWNED_BY.
    Consequently there is NO ownership transition here: McLoughlin's OWNS edge
    (rel 1) is continuous, and no ENDED ownership edge / prior-owner period is
    recorded.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) OWNERSHIP EDGE (rel 1, mcloughlin OWNS channel) is the weakest-supported
    edge and the reviewer's primary focus. It rests on his creating/hosting the
    channel (rels 0, 2) plus the DOCUMENTED ABSENCE of any ownership transfer — not
    a direct Tier-1 ownership disclosure. control_level CONTROLLING; confidence
    deliberately moderate (0.65); no ownership percentage asserted.
    (2) CHANNEL FOUNDING DATE. Wikipedia documents uploads under "jacksepticeye"
    beginning "December" 2012 (month only). No ISO day is documented, so rels 0/1
    OMIT effective_from rather than guess.
    (3) REVELMODE (rels 4, 5). Wikipedia places McLoughlin among the initial
    creators signed under Revelmode in January 2016 (effective_from 2016-01-14,
    matching pewdiepie.yaml's Revelmode launch date). The shutdown is documented to
    2017 without a firm ISO day, so effective_to is OMITTED while status is ENDED
    (same precedent as pewdiepie.yaml).
    (4) POLARIS / DISNEY DIGITAL NETWORK (rels 6, 7) is the SOFTEST part of this
    record. Tubefilter (2017-06-15) calls him "Maker's Jacksepticeye" and describes
    Polaris as Disney's gaming editorial division; Wikipedia states he "was signed
    under the Disney Digital Network." These establish a documented network
    affiliation but not clean ISO start/end dates, so both effective dates on rel 7
    are omitted and confidence is low (0.55). Note "Disney Digital Network" is
    carried as an ALIAS of the reused maker entity (Maker's rebranded successor);
    the Polaris affiliation is modeled via the polaris entity rather than a second
    maker→channel edge to avoid double-counting. A reviewer may prefer to fold rels
    6/7 into a single maker→channel REPRESENTS edge, or to add a distinct Disney
    Digital Network entity.
    (5) DISNEY→MAKER (rel 3): effective_from 2014-03-24 is the ANNOUNCEMENT /
    agreement date from Disney's own press release. Reused VERBATIM from
    pewdiepie.yaml; kept ACTIVE (acquisition never reversed).
    (6) VENTURES OUTSIDE THE OWNERSHIP CHAIN (rels 8, 9, 10). Top of The Mornin'
    Coffee (founded/announced 2020-06-15) and Cloak (gamer apparel, announced
    October 2018, co-founded with Markiplier) are companies McLoughlin founded, NOT
    owners of the channel. They are recorded as FOUNDED_BY for documented context
