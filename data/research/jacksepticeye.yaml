    Coffee and Cloak are COMPANY (ventures). Keep canonical_name/legal_name/
    jurisdiction consistent with pewdiepie.yaml for the shared maker/disney/
    revelmode entities.
    (8) NEUTRAL FRAMING. Per docs/legal-risk.md, this record describes ownership and
