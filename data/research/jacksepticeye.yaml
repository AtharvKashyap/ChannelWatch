# Profile: independent, creator-owned gaming channel with a DOCUMENTED PAST
# MULTI-CHANNEL-NETWORK (MCN) RELATIONSHIP — NOT a past ownership change. Seán
# William McLoughlin created and hosts the "jacksepticeye" channel (uploads under
# that name began December 2012) and no source documents any sale or transfer of
# the channel itself. From January 2016 the channel was REPRESENTED by Revelmode,
# a Maker Studios sub-network led by PewDiePie; Revelmode was shut down by Disney
# in 2017. McLoughlin was subsequently affiliated with Disney's Maker Studios
# gaming network Polaris / Disney Digital Network (the Maker successor brand). All
# of these are NETWORK/REPRESENTATION affiliations that ENDED — an MCN
# represents/distributes a creator's channel; it does NOT own it. These edges are
# therefore REPRESENTS / SUBSIDIARY_OF / ACQUIRED — never OWNS / FORMERLY_OWNED_BY.
# Because ownership never changed, this is a creator-owned channel with historical
# network context, NOT an ownership-transition (OWNERSHIP_CHANGED) case.
