# The maker / disney / revelmode entities are reused VERBATIM from pewdiepie.yaml
# (same Maker Studios MCN, its Disney acquisition, and the Revelmode sub-network),
# so the shared sub-graph stays consistent on import.
#
# McLoughlin's business ventures (Top of The Mornin' Coffee; Cloak apparel,
# co-founded with Markiplier) are recorded ONLY as documented context and are
# OUTSIDE the channel ownership chain — they are companies he founded, not owners
# of the channel, and do NOT feed the ownership classification.

