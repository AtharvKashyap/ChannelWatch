relationships:
  # 0: Channel founded/registered by Felix Kjellberg on 2010-04-29 (Wikipedia).
  # This pre-dates every network relationship below by over two years.
  - subject: channel
    type: FOUNDED_BY
    object: kjellberg
    effective_from: 2010-04-29
    confidence: 0.9
    status: ACTIVE

  # 1: Felix Kjellberg owns the channel. This is the current, ACTIVE ownership
  # edge and the one the classifier reads. No source documents any sale or
  # transfer of the channel itself: the Maker Studios / Disney relationship was
  # multi-channel-NETWORK representation (rel 3), not an acquisition of the
  # channel. control_level CONTROLLING (sole individual creator-owner). confidence
  # is moderate because the "ownership" is established by his founding of the
  # channel and the documented ABSENCE of any ownership transfer, rather than by a
  # direct Tier-1 ownership disclosure. Flagged for reviewer.
  - subject: kjellberg
    type: OWNS
    object: channel
    control_level: CONTROLLING
    effective_from: 2010-04-29
    confidence: 0.65
    status: ACTIVE

  # 2: Kjellberg is the creator/host of the channel (he IS PewDiePie). Distinct
  # from the ownership edge above.
  - subject: channel
    type: HOSTED_BY
    object: kjellberg
    confidence: 0.95
    status: ACTIVE

  # 3: FORMER NETWORK REPRESENTATION — NOT OWNERSHIP. Maker Studios, a
  # multi-channel network (MCN), represented the PewDiePie channel from December
  # 2012 until Maker publicly ended the affiliation on 2017-02-13. Recorded as
  # REPRESENTS with status ENDED and effective_to set (per the template's
  # transition convention). effective_from is OMITTED: the start is documented
  # only to the month ("December" 2012, Wikipedia), with no ISO day — asserting a
  # day would be false precision. control_level is deliberately left UNSET: an MCN
  # represents/distributes a creator's channel and does not, by itself, hold
  # ownership or control of it. This edge is NOT a channel-owning type and does
  # NOT affect the ownership classification.
  - subject: maker
    type: REPRESENTS
    object: channel
    effective_to: 2017-02-13
    confidence: 0.85
    status: ENDED

  # 4: The Walt Disney Company acquired Maker Studios. Announced/agreed
  # 2014-03-24 ($500M plus a performance earn-out of up to $450M; closing expected
  # in Disney's Q3 FY2014). This is a company-to-company acquisition that made
  # Maker a Disney entity — it is CONTEXT for the network relationship (rel 3),
  # NOT an acquisition of the PewDiePie channel. Kept ACTIVE (the acquisition was
  # never reversed); note that Maker itself was later wound down and its remnants
  # folded into Disney Digital Network (~2017–2018) — see review notes.
  - subject: disney
    type: ACQUIRED
    object: maker
    control_level: CONTROLLING
    effective_from: 2014-03-24
    confidence: 0.9
    status: ACTIVE

  # 5: Revelmode was a Maker Studios sub-network / "imprint" (TechCrunch), launched
  # January 2016 and disbanded around February 2017 when Disney/Maker cut ties.
  # SUBSIDIARY_OF Maker. effective_to omitted: reporting places the disbanding in
  # February 2017 without a firm ISO day (see notes). Historical network context.
  - subject: revelmode
    type: SUBSIDIARY_OF
    object: maker
    effective_from: 2016-01-14
    confidence: 0.8
    status: ENDED

  # 6: Kjellberg led Revelmode — "an imprint of Maker Studios with Felix Kjellberg
  # aka PewDiePie in charge" (TechCrunch). Recorded as MANAGES / MANAGEMENT (an
  # operational leadership role over the sub-network), NOT ownership. ENDED with
  # the sub-network's dissolution.
  - subject: kjellberg
    type: MANAGES
    object: revelmode
    control_level: MANAGEMENT
    effective_from: 2016-01-14
    confidence: 0.75
    status: ENDED

