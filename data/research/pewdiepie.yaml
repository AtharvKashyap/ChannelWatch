  # https://www.youtube.com/channel/UC-lHJZR3Gqxm24_Vd_AJ5Yw — confirming this UC
  # id is the page's own channel (distinct from the unrelated @PewDiePieHighlights
  # canonicalBaseUrl also present in the page source). The embedded keywords
  # ("pewdiepie pewds gaming 'felix arvid ulf' felix kjellberg") corroborate the
  # match.
  youtube_channel_id: UC-lHJZR3Gqxm24_Vd_AJ5Yw
  display_name: PewDiePie
  handle: "@pewdiepie"

