review:
  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-23
  # reviewed_by intentionally UNSET: this is an unreviewed DRAFT. The schema
  # treats reviewed_by as an optional non-empty string (null is not valid), so
  # the field is omitted rather than set.
  notes: >-
    DRAFT for human review — "independent creator-owned channel with a documented
    PAST MCN/NETWORK relationship (not a past ownership change)" case.

    CHANNEL ID: UC-lHJZR3Gqxm24_Vd_AJ5Yw, extracted from the externalId field in
    ytInitialData in the raw HTML of https://www.youtube.com/@pewdiepie (curl
    fetch, no JS execution). Corroborated by the page's own
    <link rel="canonical" href="https://www.youtube.com/channel/UC-lHJZR3Gqxm24_Vd_AJ5Yw">
    and the embedded keywords naming "felix arvid ulf / felix kjellberg". Distinct
    from the unrelated @PewDiePieHighlights canonicalBaseUrl also present in the
    page source.

    CORE MODELING DECISION — MCN/NETWORK REPRESENTATION IS NOT OWNERSHIP.
    Maker Studios (and, through its 2014 acquisition, Disney) was a multi-channel
    network that REPRESENTED the PewDiePie channel; no source documents any sale,
    equity stake, or transfer of the channel itself. The relationship is therefore
    encoded as REPRESENTS (rel 3, status ENDED, effective_to 2017-02-13) — NOT as
    OWNS or FORMERLY_OWNED_BY. Consequently there is NO ownership transition here:
    Kjellberg's OWNS edge (rel 1) is continuous from the 2010 founding, and no
    ENDED ownership edge / prior-owner period is recorded. Contrast with e.g.
    smosh.yaml, where the network (Defy/Mythical) actually OWNED the channel and
    FORMERLY_OWNED_BY edges are appropriate — that is NOT the situation here.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) OWNERSHIP EDGE (rel 1, kjellberg OWNS channel) is the weakest-supported
    edge and the reviewer's primary focus. It rests on Kjellberg having founded
    the channel (rel 0) plus the DOCUMENTED ABSENCE of any ownership transfer —
    not on a direct Tier-1 ownership disclosure. control_level CONTROLLING;
    confidence deliberately moderate (0.65); no ownership percentage asserted. A
    reviewer may wish to confirm the current operating entity behind the channel
    (Kjellberg has referenced business entities in Japan/UK over time; none is
    documented here to a Tier 1/2 standard, so none is asserted).
    (2) NETWORK START DATE. Maker representation began "December" 2012 (Wikipedia,
    month only). No ISO day is documented, so rel 3's effective_from is OMITTED
    rather than guessed; only the well-documented END date (2017-02-13, the day
    Maker announced ending the affiliation, per Forbes) is recorded as
    effective_to.
    (3) DISNEY→MAKER (rel 4): effective_from 2014-03-24 is the ANNOUNCEMENT /
    agreement date from Disney's own press release; the deal was expected to close
    in Disney's Q3 FY2014 (operative close date not separately pinned here). Kept
    status ACTIVE because the acquisition was never reversed; however Maker
    Studios as an operation was wound down and its remnants folded into "Disney
    Digital Network" (~2017–2018) — captured only as an alias, not as a further
    dated edge, for lack of a precise Tier 1/2 date. Reviewer may add a
    dissolution edge if desired.
    (4) REVELMODE (rels 5–6) is included as documented network CONTEXT, not as an
    owner of the channel. Its disbanding is reported around February 2017 (when
    Disney/Maker cut ties) without a firm ISO day, so effective_to is omitted on
    both edges while status is ENDED (same precedent as smosh.yaml rel 6). Kjellberg's
    role is MANAGES/MANAGEMENT ("in charge"), not ownership.
    (5) ENTITY TYPES. Maker Studios and Revelmode are typed MEDIA_NETWORK (MCN /
    sub-network). Disney is COMPANY (jurisdiction US-DE, NYSE:DIS). These
    entities may be shared with future records (e.g. other former Maker creators);
    keep canonical_name/legal_name/jurisdiction consistent if so.
    (6) NEUTRAL FRAMING. Per docs/legal-risk.md, this record describes ownership
    and network structure only and makes NO claim of editorial interference or
    wrongdoing. The 2017 controversy is the DOCUMENTED REASON the network
    affiliation ended and is quoted only as such (from the parties' own
    statements); no conclusion about editorial control is drawn.

    ALTERNATIVE ENCODING CONSIDERED: rel 3 could also be modeled as DISTRIBUTED_BY
    (MCNs handle distribution/ad-sales for their creators). REPRESENTS was chosen
    as the most accurate description of an MCN–creator relationship; a reviewer may
    prefer DISTRIBUTED_BY or AD_SALES_BY. Either way it is not an ownership type.

    PROPOSED CLASSIFICATION (computed by importer, not asserted here): expected
    CREATOR_OWNED (GREEN) — the only ACTIVE channel-owning edge is Kjellberg (a
    CREATOR) OWNS channel / CONTROLLING. All network edges are either ENDED
    (rels 3, 5, 6) or are not channel-owning types (rel 4 is a company-to-company
    ACQUIRED edge), so none feeds the ownership label. No OWNERSHIP_CHANGED_RECENTLY
    warning expected (no ownership edge changed; the ENDED network edges are from
    2017, well outside the 12-month window as of the 2026 evaluation date).
    Confidence moderate, gated by the Tier-2-only, inference-based OWNS edge.

    All backing sources are Tier 1 (Disney's own acquisition announcement) and
    Tier 2 (Wikipedia, Forbes, TechCrunch). No Tier 3/4 source is used.
  last_reviewed_at: 2026-07-23
