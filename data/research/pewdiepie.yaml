# CHANNELWATCH research record — PewDiePie (Felix Kjellberg)
#
# DRAFT for human review. Nothing here is published without verification.
#
# Profile: independent, creator-owned channel with a DOCUMENTED PAST NETWORK
# (MCN) RELATIONSHIP — NOT a past ownership change. Felix Kjellberg registered
# the channel himself (29 April 2010) and has never sold it. From December 2012
# the channel was REPRESENTED by the multi-channel network Maker Studios (an MCN,
# acquired by The Walt Disney Company in 2014); that network affiliation ENDED on
# 13 February 2017 when Maker Studios publicly cut ties. Kjellberg also led
# Revelmode, a short-lived Maker sub-network (2016 – early 2017). CRITICAL
# DISTINCTION encoded here: an MCN represents/distributes a creator's channel; it
# does NOT own it. These network edges are therefore REPRESENTS / SUBSIDIARY_OF /
# MANAGES — never OWNS / FORMERLY_OWNED_BY. Because ownership never changed, this
# is a creator-owned channel with historical network context, NOT an
# ownership-transition (OWNERSHIP_CHANGED) case.

