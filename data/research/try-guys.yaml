review:
  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-23
  # reviewed_by intentionally OMITTED — this is a DRAFT, not yet human-reviewed.
  notes: >-
    DRAFT for human review — creator-owned channel with a BuzzFeed -> 2nd Try
    TEMPORAL transition. reviewed_by intentionally unset. last_reviewed_at holds
    the draft authoring date (schema-required), NOT a completed review.

    EXPECTED CLASSIFICATION: CREATOR_OWNED. The channel's sole active owner is
    2nd Try LLC (COMPANY, rel 0); 2nd Try is itself controlled by its creator
    co-owners (rels 1-3, PARTIALLY_OWNS + CONTROLLING), so the classifier's
    creator-controlled-company rule fires (explanation code
    CREATOR_CONTROLLED_COMPANY). No PE / corporate / external-funding owner is in
    the active chain. Confidence ~0.65 (min over the load-bearing chain: the
    inferred Keith/Zach ownership edges are the weakest link).

    CHANNEL ID: UCpi8TJfiA4lKGkaXs__YdBA, taken from the raw @tryguys page HTML
    "externalId" and cross-checked against YouTube's own RSS feed
    (yt:channelId + title + author all "The Try Guys"; earliest-retained
    <published> 2018-05-23).

    TEMPORAL / OWNERSHIP-TRANSITION MODELING (the crux of this record):
    (a) The channel itself was NEVER BuzzFeed-owned. It was created ~May 2018 as
    part of the move to independence, so NO former-BuzzFeed-owner edge is placed
    on the channel. This is deliberate and evidence-driven — sources support a
    BRAND-rights transfer and an EMPLOYMENT relationship, not BuzzFeed ownership
    of this channel.
    (b) The BuzzFeed-era -> 2nd-Try-era transition is modeled on the BRAND
    (rels 16-17: BuzzFeed OWNS Try Guys brand, ENDED 2018-06-16 -> 2nd Try OWNS
    brand, ACTIVE from 2018-06-16, per the transition convention) and on the
    EMPLOYS edges (rels 18-21, ENDED 2018-06-16). These are OUTSIDE the channel's
    ownership chain and therefore do not change the served classification; they
    enrich the history surface only.
    (c) rel 16 (BuzzFeed held brand rights 2014-2018) is an INFERENCE from the
    June-2018 rights-transfer language ("2nd Try LLC will assume rights to The Try
    Guys brand"); no source states BuzzFeed's prior ownership of the brand in as
    many words. Flagged, confidence 0.6. A reviewer may prefer to downgrade this
    to a weaker/looser relationship or drop it if unsupported.

    NED FULMER (2022): removed September 2022 after an internal review ("no longer
    working for The Try Guys"). Per task instruction, his departure is recorded as
    an ownership-relevant change ONLY if an equity change is documented — NO
    source documents any buyout, equity forfeiture, or ownership-stake change, so
    NO ownership edge is asserted or ended for Ned. His departure is captured only
    at the ROLE level (rel 15, HOSTED_BY ENDED 2022-09-27). effective_to date
    2022-09-27 is the widely reported statement date; Wikipedia says "September
    2022" without a day — reviewer may refine.

    JOINT SOLE-OWNER CONVENTION (rels 1-3): applied to the current three principals
    (Keith, Zach, Eugene) as the documented owners of an independent, self-owned
    company with NO outside owner in any source. Eugene's co-ownership is
    EXPLICITLY documented (Wikipedia, "retained co-ownership"); Keith's and Zach's
    ownership is INFERRED from co-founder + executive-producer status of an
    independent company (confidence 0.65, lower than Eugene's 0.75). Individual
    equity splits are undisclosed, so no percentages are asserted. A reviewer
    should seek a primary/registry source (e.g. a CA business filing) to confirm
    the exact 2nd Try cap table and Keith/Zach ownership titles.

    DATES / JUDGMENT CALLS:
    (1) Channel OWNS + founding: effective_from 2018-06-16 (documented independence
    date) for company/brand/ownership edges; 2018-05-22 for channel FOUNDED_BY
    (reported channel account-creation date). First verified upload 2018-05-23
    (YouTube feed). The ~3-week gap between channel creation (May) and the public
    2nd Try launch (June 16) is flagged; reviewer may align these.
    (2) BuzzFeed EMPLOYS effective_from 2014-01-01 (format-origin year; exact hire
    dates not documented) and effective_to 2018-06-16 (public departure). Note
    reporting also cites the members resigning from BuzzFeed around April 2018,
    ahead of the June public launch — a reviewer may prefer April 2018.
    (3) AD_SALES_BY BuzzFeed (rel 22): documented as beginning June 2018; whether
    the commercial rep agreement still holds today is NOT documented (BuzzFeed's
    business has since contracted), so it is left ACTIVE with low confidence 0.55
    and no effective_to, flagged as unverified-current. It is a sales-rep
    relationship, NOT ownership or editorial control (legal-safe: acquisition is
    not guilt, representation is not control).
    (4) 2nd Try jurisdiction recorded US-CA (Los Angeles-based studio); no exact
    LLC-registration state was verified from a primary filing — flagged.

    LEGAL-SAFE / NEUTRALITY: no PE-implying label is asserted anywhere, so the
    §14.3 PE-label evidence rule is not triggered. All backing sources are
    Tier 1-2; no Tier 3/4 source supports any edge. Language describes ownership
    STRUCTURE only; no claim of editorial interference or misconduct is made.
  last_reviewed_at: 2026-07-23
