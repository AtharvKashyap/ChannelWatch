# CHANNELWATCH research record — The Try Guys
#
# DRAFT for human review. Nothing here is published without verification.
# reviewed_by is intentionally UNSET (not yet reviewed).
#
# Profile: a creator-OWNED channel with a strong TEMPORAL/brand-transition story.
# The Try Guys FORMAT originated at BuzzFeed in 2014, produced by four BuzzFeed
# EMPLOYEES (Ned Fulmer, Keith Habersberger, Zach Kornfeld, Eugene Lee Yang). In
# June 2018 the four left BuzzFeed and founded their own independent production
# company, 2nd Try LLC, which "gained all rights to The Try Guys brand" and its
# social/YouTube accounts; BuzzFeed stayed on only as an advertising/branded-
# content sales representative under a commercial agreement.
#
# TEMPORAL MODELING CAUTION (per task): this dedicated YouTube channel
# (UCpi8TJfiA4lKGkaXs__YdBA) was CREATED in May 2018 as part of the move to
# independence and has NEVER been a BuzzFeed-owned property. Sources do NOT
# support "BuzzFeed owned this channel." What transitioned from BuzzFeed to
# 2nd Try was (a) the four creators' EMPLOYMENT and (b) rights to the Try Guys
# BRAND. The BuzzFeed-era vs 2nd-Try-era transition is therefore modeled on the
# BRAND entity and on the EMPLOYS edges — NOT as a former channel owner. The
# channel's only ever owner is 2nd Try LLC (→ CREATOR_OWNED). Because the
# classifier reads only currently-active OWNS-channel edges, the (ended) BuzzFeed
# brand/employment edges enrich the history surface without changing the label.

