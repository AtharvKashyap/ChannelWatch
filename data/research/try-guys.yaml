  # <title>The Try Guys</title> and <author><name>The Try Guys</name>; the feed's
  # earliest-retained entry / <published> is 2018-05-23.
  youtube_channel_id: UCpi8TJfiA4lKGkaXs__YdBA
  display_name: The Try Guys
  handle: "@tryguys"

