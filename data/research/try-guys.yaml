    effective_from: 2018-05-22
    confidence: 0.8
    status: ACTIVE
  - subject: channel
    type: FOUNDED_BY
    object: ned
    effective_from: 2018-05-22
    confidence: 0.8
    status: ACTIVE
  # --- Hosting (on-camera) ---
  # 12-13: Keith and Zach remain on-camera hosts (channel's ongoing uploads).
  - subject: channel
    type: HOSTED_BY
    object: keith
    confidence: 0.9
    status: ACTIVE
  - subject: channel
    type: HOSTED_BY
    object: zach
    confidence: 0.9
    status: ACTIVE
  # 14: Eugene hosted from launch until stepping back from the flagship show in
  # May 2024 (he RETAINED co-ownership, rel 3, which stays ACTIVE). Modeled as a
