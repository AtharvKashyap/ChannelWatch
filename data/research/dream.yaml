# Profile: independent, creator-owned single-creator channel. The "Dream"
# YouTube channel was created and is hosted by the Minecraft creator known as
# Dream (first name Clay, self-disclosed; full legal surname NOT publicly
# disclosed and deliberately NOT recorded here — see privacy note). No company,
# management firm, or external investor was found to own or have acquired the
# channel. Associated structures that DO exist — the "Dream Team" content
