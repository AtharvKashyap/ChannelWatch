  # <link rel="canonical" href="https://www.youtube.com/channel/UCTkXRDQl0luXxVQrRQvWS6w">
  # confirms this UC id is the page's own channel.
  youtube_channel_id: UCTkXRDQl0luXxVQrRQvWS6w
  display_name: Dream
  handle: "@dream"

entities:
  - slug: dream
    canonical_name: Dream
    entity_type: CREATOR
    # legal_name intentionally OMITTED: only the first name "Clay" is publicly
    # self-disclosed; the full legal surname is not public. Recording a partial
    # or inferred legal name would be doxxing-adjacent and is excluded per
    # docs/evidence-policy.md §5. "Clay" is carried as an alias only.
