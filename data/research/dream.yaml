      - DreamWasTaken
      - DreamTraps
      - Clay

relationships:
  # 0: The channel was created by Dream. Wikipedia: "Dream created his YouTube
  # channel on February 8, 2014, under the username DreamTraps and started to
  # upload content regularly in July 2019." effective_from set to the documented
  # channel-creation date. Regular uploads began July 2019 (see notes).
  - subject: channel
    type: FOUNDED_BY
    object: dream
    effective_from: 2014-02-08
    confidence: 0.85
    status: ACTIVE

  # 1: Dream owns/controls the channel. Recorded OWNS + CONTROLLING with
  # ownership_percentage OMITTED. This is the load-bearing edge for the
  # classification and is, in part, an INFERENCE FROM DOCUMENTED ABSENCE: the
  # sources consistently present the channel as Dream's own, and NO source found
  # reports any external owner, investor, or acquirer of the channel. No explicit
  # "Dream owns 100% of the channel" statement or corporate filing was located,
  # so no percentage is asserted. Flagged for reviewer — see notes (2).
  - subject: dream
    type: OWNS
    object: channel
    control_level: CONTROLLING
    confidence: 0.7
    status: ACTIVE

  # 2: Dream is the channel's principal on-camera/behind-the-mask creator and
  # host. Distinct from the ownership edge. Well documented and ongoing.
  - subject: channel
    type: HOSTED_BY
    object: dream
    confidence: 0.9
    status: ACTIVE

