review:
  researched_by: claude-research-agent-m1
  # reviewed_by omitted: not yet reviewed (schema field is optional, not nullable).
  notes: >-
    DRAFT for human review — "independent, creator-owned single-creator channel"
    case, structurally the same shape as mkbhd.yaml / the PewDiePie ownership
    edge. Computed classification is expected to be CREATOR_OWNED: the channel's
    only owner/controller is the CREATOR himself (rel 1), with no company, firm,
    or external investor anywhere in the chain. No PE-label evidence rule is
    engaged (no PRIVATE_EQUITY_FIRM or PORTFOLIO_COMPANY_OF edge). No
    OWNERSHIP_CHANGED_RECENTLY warning expected (the single OWNS edge is
    continuous from the 2014 founding; no ENDED ownership edge exists).

    CHANNEL ID: UCTkXRDQl0luXxVQrRQvWS6w, extracted from the sole "externalId"
    field in the raw HTML of https://www.youtube.com/@dream (curl fetch, no JS),
    corroborated by the page's own <link rel="canonical"
    href="https://www.youtube.com/channel/UCTkXRDQl0luXxVQrRQvWS6w">.

    PRIVACY HANDLING (docs/evidence-policy.md §5): Dream is a partially-anonymous
    creator who did a documented face reveal on 2022-10-02. Only his
    self-disclosed first name "Clay" is recorded, and only as an alias; his full
    legal surname is NOT publicly disclosed, so legal_name is OMITTED rather than
    guessed. No birth date, no residential/location, no family, and no other
    personal-life details are recorded — none is ownership-relevant and all are
    outside the transparency scope. Framing is strictly neutral: the record
    describes channel ownership/hosting only and makes no claim of editorial
    interference or wrongdoing.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) FOUNDING DATE: rel 0 effective_from 2014-02-08 is the documented
    channel-creation date (Wikipedia), when the account existed under the name
    "DreamTraps". Regular uploads did not begin until July 2019; a reviewer may
    prefer to characterize July 2019 as the effective start of the channel's
    activity as known today.
    (2) OWNERSHIP EDGE (rel 1) is the reviewer's primary focus. Recorded OWNS +
    CONTROLLING with NO percentage. This is partly an inference from DOCUMENTED
    ABSENCE — every source presents the channel as Dream's own and none reports
    any external owner/investor/acquirer — rather than from an explicit ownership
    statement or corporate filing. Confidence set to 0.7 to reflect that. No
    percentage was guessed. A US business-registry filing or a direct
    on-the-record ownership statement would be a Tier 1 corroboration lead.

    CORPORATE-ENTITY CHECK (requested): NO entity that owns the channel was
    found. Specifically:
    - "Dream Team" is a CONTENT COLLABORATION GROUP (Dream, GeorgeNotFound,
      Sapnap and associates), not a legal owner of this channel; no ownership or
      management edge is modeled from it.
    - "Dream SMP" is a private Minecraft server / content project (created ~April
      2020), not an ownership entity.
    - MERCH: Dream operates an official merch store; publicly it has been run via
      third-party merch-fulfillment operations (commonly reported as Killer
      Merch). Merch fulfillment is a commercial/licensing service, NOT ownership
      of the YouTube channel, and no reliably-sourced legal entity for Dream's
      own business was located — so no COMPANY entity or company-ownership edge
      is modeled here. "DreamXD" appears only as a secondary channel / merch
      search term, not as a business entity. If a reviewer confirms a formal
      operating company (name, jurisdiction, founding date) via a primary source,
      the model should move to a creator-controlled-company shape (creator
      OWNS/PARTIALLY_OWNS company; company OWNS channel), which would still
      compute CREATOR_OWNED.
    - MUSIC: Dream signed a recording deal with Mercury Records / Republic
      Records (~December 2022). That is a music recording contract, NOT ownership
      or acquisition of the YouTube channel, and creates no inbound channel-owning
      edge; omitted from the graph for lack of channel relevance.
    - DISAMBIGUATION: "DreamCrew" (the multi-disciplinary media/management company
      co-founded by Drake and Adel "Future" Nur, 2017) is UNRELATED to this
      creator despite the similar name; it must not be linked to this channel.
    (3) EXTERNAL INVESTMENT / ACQUISITION: none of the channel was found. The
    MrBeast connection is limited to a one-off co-branded product (the "Dream
    Burger" on MrBeast Burger, released 2021-04-26) — a promotional collaboration,
    not an investment in or acquisition of the channel.
    (4) SOURCES: both are Tier 2 (ESTABLISHED_INDUSTRY_PUBLICATION: Wikipedia and
    TIME) from independent publishers. No Tier 1 primary source (business-registry
    filing or a direct on-the-record ownership statement) was captured — a lead
    for a reviewer wanting Tier 1 corroboration of sole ownership. No Tier 3/4
    source is used.
  last_reviewed_at: 2026-07-23
