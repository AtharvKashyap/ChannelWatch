  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-23
  # reviewed_by intentionally omitted: this is a DRAFT, not yet human-reviewed.
  notes: >-
    DRAFT for human review — "creator-owned company" case. Expected computed
    classification: CREATOR_OWNED (via CREATOR_CONTROLLED_COMPANY). The channel
    is owned by Critical Role Productions LLC (rel 0), which is in turn jointly
    controlled by its eight founding cast members (rels 1-8, PARTIALLY_OWNS /
    CONTROLLING). No outside/private-equity ownership of the channel or of the
    company was found; sources state the company took no outside-investor
    funding. No PE-implying label is asserted, so the §14.3 PE-label evidence
    rule is not triggered.

    CHANNEL ID: UCpXBGqwsBkpvcYjsJBQ7LEQ. Verified from the RAW channel-page
    HTML ("externalId":"UCpXBGqwsBkpvcYjsJBQ7LEQ" and the <link rel="canonical">
    to /channel/UCpXBGqwsBkpvcYjsJBQ7LEQ), and independently against YouTube's
    own RSS feed (matching <yt:channelId>, <title> and <author><name> = Critical
    Role).

    KEY MODELING DECISION — GEEK & SUNDRY WAS NOT AN OWNER. The show premiered
    2015-03-12 on Geek & Sundry (a web network Legendary Entertainment acquired
    Aug 2014 and ran via Legendary Digital Networks). G&S PRODUCED / DISTRIBUTED
    / HOSTED the show on its platforms but did NOT own the Critical Role IP or
    the cast's company; the show remained creator-owned throughout. Therefore
    G&S is modeled as a NON-ownership, historical DISTRIBUTED_BY edge
    (rel 17, control_level LICENSE, status ENDED), NOT as a FORMERLY_OWNED_BY
    prior owner. This is deliberate and legally significant — asserting G&S once
    "owned" Critical Role would be inaccurate.

    THIS CHANNEL vs THE G&S CHANNEL. This dedicated Critical Role channel
    launched ~June 2018 as part of the move to independence; the show had
    previously streamed on Geek & Sundry's OWN channels (geekandsundry). Because
    this channel has always belonged to Critical Role Productions, there is NO
    owner-to-owner transition (no FORMERLY_OWNED_BY) for this channel — hence
    rel 0 is a single ACTIVE ownership edge.

    INDEPENDENCE TIMELINE (documented): June 2018 own Twitch/YouTube channels
    launched; July 2018 moved to own studio; February 2019 split from G&S / LDN
    completed. Alpha (LDN's streaming service) shut down March 2019.

    JUDGMENT CALLS / ITEMS FOR A REVIEWER:
    (1) MISSING EXACT DAYS. Several dates are documented only to the month/year,
    and FullDate requires a full ISO date, so effective_from/effective_to were
    OMITTED rather than fabricated: channel launch June 2018 (rel 0), company
    incorporation 2015 (rels 9-16), G&S split February 2019 (rel 17
    effective_to), Legendary's Aug 2014 acquisition of G&S (rel 18). Only the
    well-documented 2015-03-12 premiere is asserted as a full date (rel 17
    effective_from). A reviewer with primary filings may fill these in.
    (2) JURISDICTION of Critical Role Productions LLC not asserted — the state of
    incorporation was not found in a Tier 1/2 source consulted.
    (3) OWNERSHIP SPLIT among the eight founders is undisclosed; joint-sole-owner
    convention applied (PARTIALLY_OWNS / CONTROLLING, no percentages). Confirm
    that sources still support all eight as current equity owners (roles cited:
    Willingham CEO, Mercer CCO, Ray Creative Director).
    (4) LEGENDARY / G&S entity (rel 18) is included only as context for what G&S
    was; it is outside this channel's ownership chain and does not affect the
    classification. G&S became largely dormant after 2019 but rel 18 is left
    ACTIVE (no documented divestiture of the G&S property by Legendary found).
    (5) LEAD NOT CITED: a Jan-2021 Variety feature ("Inside Critical Role...")
    likely corroborates the "owned by the cast / no outside investors"
    characterization but could not be fetched (host redirects to a paywall/
    tollbit gateway). Flagged as a follow-up lead, not used as evidence.
    All backing sources are Tier 1-2; no Tier 4 used.
  last_reviewed_at: 2026-07-23
