# DRAFT for human review. Nothing here is published without verification.
# reviewed_by is intentionally UNSET (not yet reviewed).
#
# Profile: a creator-OWNED channel. Critical Role is a Dungeons & Dragons
# livestream performed by a cast of professional voice actors. The show
# PREMIERED on 2015-03-12 on Geek & Sundry — a web network that Legendary
# Entertainment had acquired in Aug 2014 and ran through Legendary Digital
# Networks (LDN). CRUCIAL DISTINCTION FOR THIS RECORD: Geek & Sundry
# PRODUCED / DISTRIBUTED / HOSTED the show on ITS OWN platforms (Twitch, the
# geekandsundry YouTube channel, and LDN's "Alpha" service); it did NOT own
# the Critical Role IP or the cast's company. The show remained creator-owned
# throughout the G&S era. The cast incorporated Critical Role Productions LLC
# (2015) and took the show fully independent: they launched their OWN Twitch
# and YouTube channels in June 2018, moved to their own studio in July 2018,
# and the split from Geek & Sundry / LDN was completed in February 2019.
#
# THIS CHANNEL (UCpXBGqwsBkpvcYjsJBQ7LEQ) is Critical Role's OWN dedicated
# channel, launched ~June 2018 as part of that move to independence — it is
# NOT the geekandsundry channel the show originally streamed on. So there is
# NO prior-owner (FORMERLY_OWNED_BY) transition to model for this channel: the
# channel has been owned by Critical Role Productions LLC since it was created.
# The Geek & Sundry relationship is modeled as a NON-ownership, historical
# DISTRIBUTED_BY edge (see rel 17) so the 2015–2019 platform relationship and
# its 2019 end are surfaced without ever implying G&S owned the show.

