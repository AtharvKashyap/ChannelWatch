review:
  researched_by: claude-research-agent
  last_reviewed_at: 2026-07-23 # research/authoring date; NOT a human review date.
  notes: >-
    DRAFT for human review — "creator-founded, creator-owned eponymous channel;
    creator's separate company OPERATES the channel" case. Requires human
    verification before publication.

    CHANNEL ID. UCY1kMZp36IQSyNx_9h4mpCg, taken from the "externalId" field in the
    raw HTML of https://www.youtube.com/@MarkRober (curl, no JS execution),
    captured adjacent to "canonicalBaseUrl":"/@MarkRober", and corroborated by the
    youtube.com/channel/UCY1kMZp36IQSyNx_9h4mpCg canonical URL. Reviewer should
    confirm against the live channel.

    MAJOR CORRECTION TO THE RESEARCH BRIEF — NO DOCUMENTED OUTSIDE INVESTMENT.
    The brief anticipated a "documented 2023 outside investment round" in
    CrunchLabs and asked to verify investors/amounts/dates and the minority-vs-
    majority split for the §14.3 PE gate. The evidence contradicts that premise.
    Forbes (2025) states verbatim that CrunchLabs has a "bootstrapped, profitable
    model", that "the company has avoided outside capital in favor of
    sustainability", and quotes leadership: "We've resisted the VC-backed 'growth
    at all costs' approach". No Tier 1 or Tier 2 source documents any equity round,
    investor, amount, valuation, or minority/majority stake. Wikipedia's CrunchLabs
    article contains NO funding section. The only investor names that surfaced came
    from low-quality data aggregators (ZoomInfo/Crunchbase-derived snippets:
    "$3.5M ... Factor Capital, Multicoin Capital, Fabric VC, Elixir Capital") —
    these are crypto/venture funds and appeared in the SAME queries that returned
    "CrunchDAO" and "crunch-a-data-ai-agency", i.e. a near-certain name-collision
    contamination with an UNRELATED company. Per evidence-first policy, no
    investment relationship is modeled and no investor entity is declared.

    §14.3 PE GATE — NOT APPLICABLE. Because there is no PRIVATE_EQUITY_FIRM /
    VENTURE_CAPITAL_FIRM entity and no PE-implying edge (no INVESTED_IN, no
    PORTFOLIO_COMPANY_OF, no PE endpoint), the §14.3 PE-evidence sourcing rule is
    not triggered at all. There is nothing to gate. (Contrast epic-gardening.yaml,
    where the gate applied to a MINORITY INVESTED_IN edge from a PE firm.)

    EXPECTED COMPUTED CLASSIFICATION — CREATOR_OWNED. The direct channel owner is
    Mark Rober (entity_type CREATOR) via a CONTROLLING OWNS edge (rel 1), so the
    classifier should compute CREATOR_OWNED. CrunchLabs OPERATES the channel
    (rel 2) but OPERATES is not an ownership edge and does not enter the ownership
    chain, so it neither yields CORPORATE_OWNED nor OWNERSHIP_UNCLEAR here (the
    creator OWNS edge is the resolving owner). There is no investor/PE entity in
    the graph, so PE_BACKED is impossible. Confirm the computed label at import.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) rel 1 (Mark Rober OWNS channel, CONTROLLING, conf 0.7). No fetched source
    states channel ownership as a percentage/verbatim title statement; it is
    inferred from Rober being the sole documented creator/principal and the
    channel being his personal, eponymous account that predates the company. This
    mirrors smarter-every-day.yaml rel 1 (sole-creator control without a public
    shareholding). Primary edge for the reviewer to scrutinize. If a reviewer finds
    that CrunchLabs LLC (not Rober personally) holds the channel, this would shift
    to a company OWNS edge and the label toward CORPORATE_OWNED (still NOT
    PE_BACKED) — do not make that change without a firm source.
    (2) rel 2 (CrunchLabs OPERATES channel, conf 0.6). The sources establish
    CrunchLabs as the media/content operating vehicle around the channel (its
    "entertainment" pillar spans YouTube, Netflix drops, and a Samsung FAST
    channel), but explicitly describe the CrunchLabs BRAND as separate from Rober
    personally ("that has nothing to do with him"). OPERATES was chosen precisely
    because no source documents CrunchLabs OWNING the channel. A reviewer could
    reasonably drop this edge as unnecessary; it is retained to capture the
    channel's operating context the brief asked about. It does not affect the
    computed classification.
    (3) CrunchLabs jurisdiction was NOT verified (Rober is Bay-Area-based, but no
    fetched source states the LLC's registered state), so it is omitted rather than
    guessed. A corporate-registry record would resolve this and could also
    document Rober's/Jim Lee's ownership stakes.
    (4) Jim Lee's title is given as "President & COO" per Forbes (2025); Wikipedia's
    CrunchLabs text has at one point called him "president and CEO". The title
    discrepancy does not affect any relationship here (he is recorded only as a
    co-founder PERSON); reviewer may reconcile.
    (5) SOURCES / ARCHIVES. All four sources are Tier 2 (Wikipedia x2, Forbes,
    Net Influencer). Excerpts are verbatim fragments captured via fetch. No Tier 1
    primary source (e.g. an LLC registry filing) was located. archive_urls should
    be captured at review, and a corporate-registry pull is the recommended next
    diligence step to firm up the ownership edges (rel 1) and jurisdiction.
