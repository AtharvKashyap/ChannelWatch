  - subject: crunchlabs
    type: OPERATES
    object: channel
    effective_from: 2022-03-30
    confidence: 0.6
    status: ACTIVE

  # 3: CrunchLabs was founded by Mark Rober, launched 2022. Wikipedia's CrunchLabs
