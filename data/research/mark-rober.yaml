# CHANNELWATCH research record — Mark Rober
#
# DRAFT FOR HUMAN REVIEW. Nothing here is published without human verification
# (Spec §12.7). Classification is COMPUTED by the importer, never asserted here.
#
# Profile: a creator-founded, creator-owned eponymous channel. Mark Rober (former
# NASA/Apple engineer) created the "Mark Rober" YouTube channel in 2011 and, more
# than a decade later (2022), founded CrunchLabs LLC — a media-and-education
# company (STEM subscription boxes + multi-platform content) that now operates the
# channel as the "entertainment" pillar of its business. The central factual
# distinctions this record encodes:
#
#   channel (Mark Rober)
#     ├─ FOUNDED_BY ───────── Mark Rober (first video October 2011; the channel
#     │                       pre-dates CrunchLabs by ~11 years)
#     ├─ OWNS ←────────────── Mark Rober (creator/sole public principal; the
#     │                       personal, eponymous channel — CONTROLLING, inferred
#     │                       sole-creator control, no disclosed shareholding)
#     └─ OPERATES ←────────── CrunchLabs LLC (the company runs the channel as its
#                             "entertainment" pillar; OPERATES is NOT an ownership
#                             edge and does not change the classification)
#
#   CrunchLabs LLC
#     ├─ FOUNDED_BY ───────── Mark Rober (launched 2022)
#     └─ FOUNDED_BY ───────── Jim Lee (co-founder; President & COO)
#
# CRITICAL CORRECTION TO THE RESEARCH BRIEF: the brief anticipated a "documented
# 2023 outside investment round" in CrunchLabs and asked to verify investors,
# amounts, and minority/majority stakes for the §14.3 PE gate. The evidence points
# the OTHER way. Every reputable source found describes CrunchLabs as BOOTSTRAPPED
# and PROFITABLE, having deliberately AVOIDED outside capital. No Tier 1/Tier 2
# source documents any equity investment, investor, amount, or valuation. The
# investor names surfaced by data aggregators (e.g. "$3.5M ... Factor Capital,
# Multicoin Capital, Fabric VC, Elixir Capital") are almost certainly a
# name-collision contamination with an unrelated crypto/AI entity ("CrunchDAO" /
# "crunch-a-data-ai-agency" appeared in the same aggregator queries) and are NOT
# recorded here. Evidence-first: a funding round we cannot document is not modeled.
# Consequently there is NO PRIVATE_EQUITY_FIRM / VENTURE_CAPITAL_FIRM entity, NO
# INVESTED_IN / PORTFOLIO_COMPANY_OF edge, and the §14.3 PE-evidence gate DOES NOT
# APPLY (nothing PE-implying to gate). See review.notes.

