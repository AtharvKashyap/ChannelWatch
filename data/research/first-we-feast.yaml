    effective_from omitted — the channel's exact creation date was not pinned to
    a T1/T2 source in this pass (brand widely dated to 2012). CONFIDENCE MODERATE.
    (3,4) Verizon + Hearst each PARTIALLY_OWNS Complex Networks (50/50 JV, joint
    control), ENDED 2021-12-03. The JV (Verizon Hearst Media Partners) agreed to
    acquire Complex on 2016-04-18 (T1 PR Newswire); BuzzFeed's 2021 PR confirms it
    bought Complex Networks "from Hearst and Verizon." effective_from omitted (2016
    close date not pinned). Recorded as CONTROLLING 50% per the joint-sole-owner
