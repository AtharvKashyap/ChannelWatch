    OWNERSHIP SUCCESSION (each hop verified; operative dates used for edges,
    announcement dates recorded on sources' published_at):
    (0) Complex Networks OWNS channel — until 2021-12-03, ENDED. First We Feast
    began ~2012 as a food-culture offshoot of Complex Media (later renamed
