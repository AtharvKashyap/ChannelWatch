    BuzzFeed Media Enterprises, Inc. (the named seller in the 8-K). CONFIDENCE HIGH.
    (2) FEAST OPCO LLC OWNS channel — CURRENT, from 2024-12-11. Per the SEC 8-K
    (T1), BuzzFeed Media Enterprises, Inc. entered an Asset Purchase Agreement
    with FEAST OPCO LLC on 2024-12-11 and the transaction CLOSED THE SAME DAY for
    an $82.5M cash purchase price. Operative date = 2024-12-11 (closing), NOT the
    2024-12-12 announcement date. CONFIDENCE HIGH (T1 regulatory filing + T1
    official announcement + T2 Forbes).

    BUYER GROUP / SOROS (be exact). BuzzFeed's official announcement HEADLINE
    frames the sale as to "an Affiliate of Soros Fund Management." Reporting
    describes an investor consortium led by that affiliate and including host
    Sean Evans, First We Feast founder/CEO Chris Schonberger, Crooked Media, and
    Mythical Entertainment (Rhett & Link's company); "additional investors" were
    to be named later. Modeled here: soros_fund INVESTED_IN feast_opco (edge 5)
    and sean_evans INVESTED_IN feast_opco (edge 6). Crooked Media, Mythical
    Entertainment and Chris Schonberger are documented co-investors but are NOT
    modeled as separate entities in this draft to keep the record focused — a
    reviewer may add them (Schonberger in particular: founder + CEO + investor;
