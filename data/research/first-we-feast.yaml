    (1) BuzzFeed, Inc. OWNS channel — 2021-12-03 to 2024-12-11, ENDED. BuzzFeed
    announced the Complex Networks acquisition 2021-06-24 (~$300M: $200M cash +
    $100M BuzzFeed equity) and closed it 2021-12-03 concurrent with its SPAC
    go-public (890 5th Avenue Partners). Operative date = 2021-12-03 (T1 closing
