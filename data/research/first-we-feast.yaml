    carries NO ownership implication per Spec §4/§40.2); (b) INVESTOR in the buyer
    group and newly named CHIEF CREATIVE OFFICER (edge 6, INVESTED_IN, control
    UNKNOWN — his equity is not disclosed as a percentage or a controlling stake).
    These are deliberately separate edges so hosting is never conflated with
