  last_reviewed_at: 2026-07-23
  notes: >-
    DRAFT for human review — "independent, creator-owned channel" case. No
    external acquisition or equity investment was found; the record asserts no
    PE/corporate ownership.

    CHANNEL ID: UCFhXFikryT4aFcLkLw2LBLA, extracted from the externalId field in
    the raw HTML of https://www.youtube.com/@NileRed (curl fetch, no JS
    execution). Exactly one externalId is present; the dominant canonicalBaseUrl
    is "/@NileRed" (59 occurrences) and the vanityChannelUrl is
    "http://www.youtube.com/@NileRed", confirming the id belongs to this handle.
    The creator's other channels (@NileBlue 26 occurrences, @NileRedExtra 24)
    also appear in the source but are clearly distinct handles. This matches the
    long-publicly-known NileRed channel id.

    EXTERNAL-INVESTMENT CHECK (per task): specifically checked whether Electrify
    Video Partners (majority investor in Veritasium; also backs Astrum, Mentour
    Pilot, Simple History, Fireship) has any stake in NileRed. It does NOT appear
    in Electrify's disclosed portfolio, and no other outside investor,
    private-equity backing, or acquisition was found in any source. The record
    records this as an ABSENCE of documented investment, not as an affirmative
    "verified independent" assertion.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) OWNER EDGE (rel 1, braun OWNS channel) rests on inference from
    (a) Nigel Braun being the sole documented public creator/principal and
    (b) the associated Quebec company naming him as contact. No source discloses
    a share register, so control_level is set to CONTROLLING (documented
    sole-creator control) but no ownership_percentage is asserted, and confidence
    is held at 0.7. Wikipedia does not carry a formal "Owner" infobox
    disclosure; a reviewer should confirm the shareholder(s) of the company and
    whether Braun holds the channel directly or via the company.
    (2) OPERATING COMPANY NOT PRIMARY-VERIFIED. The company "9380-5174 Québec
    inc." (dba NileRed) is a numbered Quebec company; the ONLY source naming it
    is a US customs import-records aggregator (ImportGenius), classified
    SHARED_LEGAL_DOCUMENTATION (Tier 3). The primary Registraire des entreprises
    du Québec (REQ) entry — which would give the NEQ number, incorporation date,
    officers/shareholders, and status, and would be a Tier 1
    CORPORATE_REGISTRY_RECORD — could NOT be retrieved (REQ site returned HTTP
    403 to automated fetch; OpenCorporates was behind a CAPTCHA). A reviewer with
    REQ access should confirm the NEQ, incorporation date, and principals, then
    upgrade this source. The OPERATES edge is held at low confidence (0.5,
    control_level MANAGEMENT) accordingly. The customs record links the company
    to NileRed's COMMERCIAL/merchandise operations (imports of lab/chemistry
    goods); whether it is the operating entity of the CHANNEL specifically vs the
    store/merch line is not fully established — reviewer to refine.
    (3) MERCH / PARTNER RELATIONSHIPS ARE NOT OWNERSHIP. Merchandise is sold via
    DFTBA (store.dftba.com) and NileRed has announced chemistry kits in
    partnership with InqFactory. These are fulfilment/retail and product
    partnerships, NOT equity or ownership, and are deliberately NOT recorded as
    ownership or investment edges. A reviewer may optionally model them as
    DISTRIBUTED_BY / LICENSES_FROM if desired, but they must not be conflated
    with ownership.
    (4) COMPANY FOUNDED_BY NOT RECORDED. No source states that Nigel Braun
    incorporated 9380-5174 Québec inc. (the customs record lists him only as
    "contact"), so no nilered_inc FOUNDED_BY braun edge is asserted; this should
    be confirmed against the REQ filing before adding.
    (5) DATES. FOUNDED_BY (rel 0) effective_from 2014-03-10 is the YouTube
    channel creation date per Wikipedia (first video 2014-03-24). No
    effective_from is set on the OPERATES edge because no incorporation date for
    the company was retrievable.
    (6) CREATOR-SAFETY. The customs/importer record exposes a street address in
    Pointe-Claire, Quebec. Per the creator-safety exclusions
    (evidence-policy §5), that street address is deliberately NOT recorded in
    this file; only the CA-QC jurisdiction is kept.
    (7) SOURCE-TYPE MAPPING. Wikipedia → ESTABLISHED_INDUSTRY_PUBLICATION
    (Tier 2). ImportGenius customs import records → SHARED_LEGAL_DOCUMENTATION
    (Tier 3): it is documentary evidence linking the legal entity to the
    "NileRed" trade name, but is neither a primary corporate registry record nor
    a creator self-disclosure. No Tier 1 creator/company self-disclosure of
    ownership structure was located.

    PROPOSED CLASSIFICATION (computed by importer, not asserted here): expected
    CREATOR_OWNED (GREEN) — founder-owned and hosted, with the commercial
    business run through a creator-associated Quebec company and no external
    equity owner found. Confidence moderate: the owner edge rests on inference
    plus a Tier 2 publication, and the operating company rests on a single Tier 3
    source pending primary-registry verification.
