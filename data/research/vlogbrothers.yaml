review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally omitted: not yet reviewed (schema treats reviewed_by
  # as optional-string; null is not a valid value, so the field is left unset).
  notes: >
    Pilot record for the "independent creator" baseline. Findings are more
    nuanced than a pure independent/self-owned case, so flagging several
    judgment calls for human review: (1) The channel's business affairs have,
    since at least 2014, been handled by EcoGeek LLC / Complexly (a Green
    brothers company), per Hank Green's own 2014 statement — this is a real,
    sourced relationship, not "fully independent," though Complexly does not
    produce vlogbrothers' content (the Greens do). Recorded as OWNS with
    control_level UNKNOWN and moderate confidence (0.6) because no source
    states a percentage or describes creative control over vlogbrothers
    itself. (2) In February 2026 Complexly converted to a 501(c)(3) nonprofit
    and the Greens donated their personal equity in it; I could not find a
    source that explicitly states whether/how this affects the
    business-affairs arrangement for vlogbrothers specifically (Tubefilter's
    coverage distinguishes vlogbrothers, the Greens' personal channel, from
    Complexly-produced shows like Crash Course and SciShow, but does not
    revisit the vlogbrothers arrangement). A human reviewer should judge
    whether the OWNS edge needs an effective_to / status change, or a second
    "formerly" edge, given this restructuring. (3) I could not access a 2016
    Hank Green video ("Changing Our Business a Bit") or a paywalled Dec 2025
    Financial Times piece that reportedly cover the same territory in more
    detail — both are leads for a follow-up researcher, not used as sources
    here. (4) I classified Complexly's current entity_type as NONPROFIT
    reflecting its Feb 2026 status; prior to that it was a for-profit LLC
    (EcoGeek LLC, then Complexly LLC) — a reviewer may prefer COMPANY with a
    note instead, depending on how the schema intends entity_type to be used
    over time. No relationship or claim in this record implies PE backing or
    corporate acquisition; none was found.
  last_reviewed_at: 2026-07-22
