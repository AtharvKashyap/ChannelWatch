review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally omitted — not yet human-reviewed (schema rejects
  # an explicit null; absence signals "unreviewed").
  last_reviewed_at: "2026-07-22"
  notes: >
    DRAFT — requires two-person human review (Spec §20.3: PE involvement +
    named individuals).

    CHAIN & CONFIDENCE. (0) Moonbug OWNS Little Baby Bum: HIGH. Moonbug's first
    franchise acquisition; Kidscreen (T2) states the "recent IP acquisition of
    ...Little Baby Bum," and Blackstone's own PR lists Little Baby Bum among
    Moonbug's shows (T1). (1) Candle Media OWNS Moonbug: HIGH/CONFIRMED. Nov 4
    2021 official announcement (T1) + THR (T2); deal reportedly ~$2.75-3B and
    has closed. (2) Candle Media PORTFOLIO_COMPANY_OF Blackstone: MODERATE.
    Two Blackstone T1 PRs describe Candle as "backed by investment capital from
    Blackstone"; THR calls it "Blackstone-backed."

    BLACKSTONE ENTITY-TYPE NUANCE (reviewer decision). Blackstone Inc. is a
    diversified alternative asset manager, NOT solely a private equity firm.
    It is classified here as PRIVATE_EQUITY_FIRM because (a) the founding Candle
    investment was led by Blackstone's Global Head of Private Equity (Joe
    Baratta, per the Westbrook PR) and (b) Blackstone is Candle's principal
    equity backer. The actual investing VEHICLE is almost certainly a specific
    Blackstone-managed fund that the sources do NOT name; if a fund is later
    identified, consider modeling it as a FUND entity that Blackstone MANAGES,
    with the FUND (not the parent) holding the Candle stake. Alternative honest
    classification: INVESTMENT_FIRM — but that would not trigger the PE-label
    gate and would suppress the PE_BACKED signal this chain is meant to surface.

    RELATIONSHIP-TYPE / STAKE CAVEAT. Sources' verbatim characterization is
    "backed by investment capital from Blackstone" / "Blackstone-backed." No
    source I found states Blackstone's ownership percentage or a controlling
    stake, so control_level and ownership_percentage are UNKNOWN. PORTFOLIO_
    COMPANY_OF is used as the structural term for a company a PE firm has taken
    an equity position in (founders "retain equity stakes" alongside Blackstone).
    Reviewer to confirm PORTFOLIO_COMPANY_OF vs. downgrading to FUNDS if the
    equity/portfolio characterization is judged unsupported.

    DATE PRECISION. Moonbug's acquisition of Little Baby Bum is widely dated to
    September 2018 (Wikipedia; Kidscreen Dec 2018 calls it "recent"); Crunchbase
    lists 2018-10-11. Exact close date not pinned by a fetched T1/T2 source —
    effective_from recorded as 2018-09 (approximate). Candle's formation and the
    Blackstone backing are 2021; effective_from recorded as 2021 (year only).

    ENTITY GAPS. Candle Media legal name and jurisdiction of incorporation not
    verified (website candlemedia.com). Moonbug is a UK entity (Moonbug
    Entertainment Limited); confirm registry number at review.

    CONTEXT (not ownership-changing). By 2024 Candle reorganized and unified its
    animation business under the Moonbug brand and pursued debt restructuring;
    this does not alter the ownership chain above (Candle still owns Moonbug,
    Blackstone still backs Candle) but the reviewer should re-verify currency.

    SOURCES. T1: Blackstone press releases (Moonbug acquisition 2021-11-04;
    Westbrook/Candle 2022-01-04) — both blocked to WebFetch by Cloudflare, so
    archive_url (Wayback) is provided and excerpts were taken from the archived
    copies. T2: Kidscreen (2018), The Hollywood Reporter (2022). Channel ID
    UCKAqou7V9FAWXpZd9xtOg3Q extracted from the "externalId"/canonical
    channel URL in the youtube.com/@LittleBabyBum page source.
