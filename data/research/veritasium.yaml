review:
  researched_by: claude-research-agent-m1
  # reviewed_by omitted: not yet reviewed (schema field is optional, not nullable).
  notes: >-
    DRAFT for human review — "creator-founded with external investment" case.

    CHANNEL ID: UCHnyfMqiRRG1u-2MsSQLbXA, extracted from the externalId field
    in ytInitialData embedded in the raw HTML of https://www.youtube.com/@veritasium
    (curl fetch, no JS execution). This value matches the long-publicly-known
    Veritasium channel ID and differs from several unrelated "channelId"
    values also present in the page (those belong to featured/recommended
    channels in page modules, not the page's own channel).

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) Electrify entity_type is recorded as INVESTMENT_FIRM. Sources
    characterize Electrify inconsistently: Tubefilter calls it a "creator
    funding firm," Wikipedia calls it a "private equity media company." No
    PE-backed label is asserted here (that requires the separate §14.3
    PE-label rule, out of scope for this record) — a reviewer should confirm
    which characterization/entity_type the DB prefers (INVESTMENT_FIRM vs
    PRIVATE_EQUITY_FIRM) if a firmer classification is later needed.
    (2) Electrify->channel (rel 1): recorded PARTIALLY_OWNS + CONTROLLING
    based on Electrify's own announcement headline ("completes majority
    investment") and Wikipedia's independent "majority-owned" statement.
    Exact percentage is NOT disclosed by any source found — ownership_percentage
    is deliberately omitted rather than guessed.
    (3) Muller->channel (rel 2): recorded PARTIALLY_OWNS + MINORITY. Muller's
    own quoted statement ("I would remain an owner") documents that he
    retained SOME ownership post-deal, but not a percentage or an explicit
    "minority" label. MINORITY is an inference from the fact that Electrify's
    stake is documented as majority/controlling (rel 1), so the remainder
    must be a minority stake. This is the weakest-documented edge in this
    record and should be the reviewer's primary focus; confidence set
    deliberately lower (0.6) to reflect that this control_level is inferred
    rather than directly stated.
    (4) The 2023-04-21 effective_from date is Electrify's own announcement
    date (and matches Wikipedia and Muller's later account that the deal
    dates to 2023); Muller did not publicly disclose the deal to his audience
    until a video around December 2025, reported by Tubefilter on
    2026-01-06 — that disclosure date is NOT recorded as a relationship date
    since it postdates the actual deal and would misrepresent effective_from.
    (5) No Tier 1 "official regulatory filing" or "investor portfolio listing"
    for this specific deal was located (Electrify does not appear to publish a
    public portfolio page listing exact stakes); the one Tier 1 source used is
    Electrify's own acquisition-announcement page, which does not itself state
    a percentage. No relationship here should be treated as CONFIRMED without
    further primary-source diligence (e.g., UK Companies House filings for
    Electrify Video Partners Ltd. or a Veritasium-related subsidiary, if any
    exist) — flagged for a reviewer with access to UK corporate registry
    search tools.
    (6) FOUNDED_BY (rel 0) confidence is 0.85, sourced only indirectly (general
    knowledge that Veritasium predates 2023 investment by over a decade,
    corroborated implicitly by the Electrify announcement's "over the last
    twelve years" framing from Muller); no dedicated founding-date source
    with an exact ISO date was located, so no effective_from date is set for
    this relationship.
  last_reviewed_at: 2026-07-22
