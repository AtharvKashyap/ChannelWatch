# CHANNELWATCH research record — Veritasium (Derek Muller)
#
# DRAFT for human review. Nothing here is published without verification.
#
# Profile: creator-founded channel with a documented EXTERNAL INVESTMENT.
# Electrify Video Partners ("Electrify") announced a majority investment in
# Veritasium on 2023-04-21. Electrify's own announcement and multiple
# secondary sources describe this as a "majority investment" / the channel
# becoming "majority-owned" by Electrify, while Derek Muller — in his own
# words, quoted by Tubefilter in Jan 2026 when he first publicly disclosed
# the deal — says he "would remain an owner" and retained creative control
# and on-camera hosting. Exact percentages are NOT publicly disclosed by
# either party, so ownership_percentage is omitted throughout; only the
# qualitative "majority" / "remain an owner" characterizations are recorded.

channel:
  # Extracted from the canonical channelId/externalId embedded in the raw HTML
  # of https://www.youtube.com/@veritasium (curl fetch); the page's ytInitialData
  # lists this as the channel's own externalId (browseId), distinct from the
  # "channelId" values of unrelated featured/recommended channels also present
  # in the page source.
  youtube_channel_id: UCHnyfMqiRRG1u-2MsSQLbXA
  display_name: Veritasium
  handle: "@veritasium"

entities:
  - slug: muller
    canonical_name: Derek Muller
    entity_type: CREATOR
    aliases:
      - Veritasium

  - slug: electrify
    canonical_name: Electrify Video Partners
    entity_type: INVESTMENT_FIRM
    jurisdiction: GB
    website: https://www.electrify.video
    aliases:
      - Electrify

relationships:
  # 0: Channel was founded by Derek Muller (pre-dates the 2023 Electrify deal;
  # Veritasium launched in 2011, long before any outside investment).
  - subject: channel
    type: FOUNDED_BY
    object: muller
    confidence: 0.85
    status: ACTIVE

  # 1: Electrify's own 2023-04-21 announcement is headlined "Electrify
  # completes majority investment in Veritasium" and Wikipedia independently
  # states the channel is "majority-owned" by Electrify. Recorded as
  # PARTIALLY_OWNS (not OWNS — no source claims 100%) with control_level
  # CONTROLLING, since "majority" denotes >50% / controlling stake by
  # definition. Exact percentage is not disclosed by either party.
  - subject: electrify
    type: PARTIALLY_OWNS
    object: channel
    control_level: CONTROLLING
    effective_from: 2023-04-21
    confidence: 0.8
    status: ACTIVE

  # 2: Derek Muller's own account (quoted by Tubefilter, Jan 2026, when he
  # first disclosed the deal publicly) is that "Electrify would buy some of
  # the business, but I would remain an owner." No source states his exact
  # retained percentage. control_level is inferred as MINORITY only because
  # Electrify's stake is documented as a majority/controlling one (rel 1) —
  # the remainder held by Muller is therefore necessarily a minority stake.
  # Flagged for reviewer: this is an inference from the two other documented
  # facts, not a directly stated percentage or control label.
  - subject: muller
    type: PARTIALLY_OWNS
    object: channel
    control_level: MINORITY
    effective_from: 2023-04-21
    confidence: 0.6
    status: ACTIVE

  # 3: Muller continues as on-camera host/creator post-investment; confirmed
  # by Electrify's own announcement, Tubefilter's 2023 and 2026 coverage, and
  # Muller's own statements. Distinct from ownership/control edges above.
  - subject: channel
    type: HOSTED_BY
    object: muller
    confidence: 0.9
    status: ACTIVE

