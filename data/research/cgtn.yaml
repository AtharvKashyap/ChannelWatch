review:
  researched_by: codex-research-agent
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-30
  last_reviewed_at: 2026-07-30
  notes: >-
    2026-07-30 triage fix (OWNS->MEDIA_NETWORK / precise ownership). Replaced the
    prior flat "CCTV OWNS CGTN" + "CGTN SUBSIDIARY_OF CMG" pair (which implied two
    conflicting parents) with a single honest state-media chain:
    channel <- CGTN (international division / SUBSIDIARY_OF CCTV) <- CCTV
    (SUBSIDIARY_OF China Media Group after the March 2018 reorganization) <- China
    Media Group <- the Chinese state. CGTN is a division of CCTV, not a separately
    owned company, so SUBSIDIARY_OF (not OWNS) is the accurate typing. Added an
    explicit state-ownership edge: China Media Group is a state-owned ministry-level
    public institution, so the ultimate owner is modeled as the Government of the
    People's Republic of China (Wikipedia infobox: "Owner: China Media Group
    (Government of the People's Republic of China)"). The schema has no
    GOVERNMENT/STATE entity_type, so prc_state is typed UNKNOWN_ENTITY with a clear
    canonical name and aliases (State Council / Publicity Department of the CCP);
    reviewer may relabel if a better type is added. These edges describe funding
    and organizational ownership only and assert nothing about particular editorial
    decisions. reviewed_by is absent.
