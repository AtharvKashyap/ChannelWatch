review:
  researched_by: claude-research-agent-m1
  notes: >-
    DRAFT for human review — "creator-owned" case. Expected computed
    classification: CREATOR_OWNED (joint creator control). The Sidemen channel
    (UCDogdKl7t7NHzQ95aEwkdMw) is jointly owned and operated by its seven members
    (rels 0-6, PARTIALLY_OWNS / CONTROLLING, split undisclosed per the joint
    sole-owner convention). No outside/parent owner of the CHANNEL was found. No
    PE-implying label is asserted, so the §14.3 PE-label evidence rule is not
    triggered.

    CHANNEL ID: UCDogdKl7t7NHzQ95aEwkdMw. Verified from the RAW channel-page HTML
    ("externalId":"UCDogdKl7t7NHzQ95aEwkdMw" and <link rel="canonical"> to
    /channel/UCDogdKl7t7NHzQ95aEwkdMw, og:title "Sidemen"), and independently
    against YouTube's own RSS feed (title/author = Sidemen).

    REGISTRY (Tier 1, UK Companies House — SIDEMEN HOLDINGS LIMITED, 12129201):
    incorporated 30 July 2019; all SEVEN members are active directors appointed
    30 July 2019 (officers captured as rels 15-21). PSC history captured: KSI
    (Olatunji) was the 75%-or-more PSC from incorporation until he CEASED on 4
    December 2019 (rel 7, ENDED), after which the company filed a "no registrable
    person" statement (no holder of 25%+).

    JUDGMENT CALLS / INFERENCES FLAGGED FOR A REVIEWER:
    (1) CURRENT HOLDING-COMPANY OWNERSHIP (rels 8-14) is an INFERENCE, not a
    direct filing: it is derived from the seven being equal directors plus the
    "no registrable person" PSC statement (no >=25% holder), consistent with the
    seven jointly owning SIDEMEN HOLDINGS with no majority stake. The share
    register is not public; confidence set to 0.6. A reviewer with the
    confirmation statement / share register should confirm or correct.
    (2) CHANNEL vs HOLDING COMPANY. No source documents SIDEMEN HOLDINGS LIMITED
    (or any single company) as the legal owner of THIS YouTube channel, and the
    channel predates the 2019 company. The channel is therefore modeled as
    directly creator-owned by the seven (rels 0-6); the holding company is
    included as corporate context (officers + PSC), not asserted as the channel's
    owner. Sidemen also operate sibling companies (Sidemen Clothing Ltd, Sidemen
    Entertainment Ltd, Sidemen Ventures Ltd) that were out of scope here.
    (3) ARCADE / LUMINA (rels 22-23) are NON-ownership context for the channel.
    Arcade is the group's external MANAGEMENT company (founded 2021 by Jordan
    Schwarzenberger, Sam Uwins and Aaron O'Neill — not encoded as entities).
    In September 2025 Lumina Media (Thomas Benski) took a MINORITY stake in
    Arcade. This is investment in the MANAGER, not the channel; it does not change
    the CREATOR_OWNED classification. Modeled with two independent Tier 2 trade
    sources (Deadline, Tubefilter).
    (4) MISSING EXACT DAYS. effective_from omitted where only a year/month is
    documented rather than fabricated: channel/group formation (2013 group,
    ~2016 channel launch — rels 0-6); Arcade's management mandate start (rel 22);
    Lumina deal operative date (rel 23; 2025-09-22 announcement recorded on the
    source's published_at instead).
    (5) NAME NOTE. Companies House officer register spells KSI "Olajide Olayinka
    William Olatunji"; the PSC entry spells it "Olajide Olayinka Williams
    Olatunji" — same individual. W2S's legal name recorded as "Harry Lewis" (the
    Companies House officer entry). All seven real names were cross-checked
    against the officer register.
    All backing sources are Tier 1-2; no Tier 4 used. reviewed_by intentionally
    omitted: this is a DRAFT, not yet human-reviewed.
  last_reviewed_at: 2026-07-23
