# CHANNELWATCH research record — Sidemen
#
# DRAFT for human review. Nothing here is published without verification.
#
# Profile: a creator-OWNED channel. "Sidemen" is the flagship YouTube channel of
# the UK creator collective the Sidemen — seven creators who collectively create,
# run and own the channel (KSI, Miniminter, Zerkaa, TBJZL, Behzinga, Vikkstar123
# and W2S). There is NO outside/parent owner of the channel. The seven are also
# jointly the directors of the group's UK holding company, SIDEMEN HOLDINGS
# LIMITED (Companies House 12129201). A separate MANAGEMENT company, Arcade,
# handles the group's representation and took a minority outside investment in
# 2025 — that stake is in the manager, NOT in the channel, and does not change the
# channel's creator-owned status (modeled as non-ownership context, rels 22-23).
#
# JOINT SOLE-OWNER CONVENTION (project policy, 2026-07-23): the seven are the
# documented joint owner-operators of the channel but their individual split is
# undisclosed, so each is encoded PARTIALLY_OWNS + control_level CONTROLLING with
# no percentage (rels 0-6). This is what makes the channel CREATOR_OWNED.

