  # 1: Michael Stevens owns the channel. This is the current, ACTIVE ownership
  # edge and the one the classifier reads. No source documents any sale or
  # transfer of the channel: the Curiosity Box (rel 3) is a separate venture, and
  # the Mind Field / YouTube Red arrangement (rel 4) was content licensing, not an
  # acquisition. control_level CONTROLLING (sole individual creator-owner).
  # confidence moderate — "ownership" rests on his founding/hosting the channel
  # (rels 0, 2) plus the DOCUMENTED ABSENCE of any transfer (Dexerto 2023 reports
  # Stevens discussing a sale only HYPOTHETICALLY and confirms none has occurred),
  # rather than a direct Tier-1 ownership disclosure. No percentage asserted.
  # Flagged for reviewer.
  - subject: stevens
    type: OWNS
    object: channel
    control_level: CONTROLLING
    effective_from: 2010-04-16
    confidence: 0.7
    status: ACTIVE

  # 2: Stevens is the creator/host of the channel (he IS Vsauce). Distinct from
  # the ownership edge above.
  - subject: channel
    type: HOSTED_BY
    object: stevens
    confidence: 0.95
    status: ACTIVE

  # 3: VENTURE — OUTSIDE THE CHANNEL OWNERSHIP CHAIN. Stevens co-founded The
  # Curiosity Box, a quarterly science subscription-box service (announced
