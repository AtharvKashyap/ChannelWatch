# CHANNELWATCH research record — Vsauce (Michael Stevens)
#
# DRAFT for human review. Nothing here is published without verification.
#
# Profile: independent, creator-owned educational channel. Michael Stevens
# founded "Vsauce" in 2010 and, per all available Tier 1/2 sourcing, still owns
# the channel today — no sale or ownership transfer is documented (a sale has
# only ever been discussed by Stevens HYPOTHETICALLY, in a 2023 interview). The
# channel's non-ownership relationships are:
#   (a) The Curiosity Box — a quarterly science subscription-box VENTURE the
#       Vsauce hosts co-founded (2016). It is a company Stevens co-founded, NOT
#       an owner of the channel — OUTSIDE the ownership chain (same treatment as
#       jacksepticeye.yaml's Top of The Mornin' Coffee / Cloak).
#   (b) Mind Field — a YouTube Red / YouTube Premium ORIGINALS series (2017–2019)
#       commissioned for exclusive distribution and aired ON the Vsauce channel.
#       This is a PRODUCTION / LICENSING / DISTRIBUTION deal for specific content,
#       NOT a channel acquisition — modeled as a dated ENDED, non-ownership
#       DISTRIBUTED_BY (LICENSE) edge, heavily flagged.
# Because ownership never changed, this is a creator-owned channel with historical
# production/venture context, NOT an ownership-transition (OWNERSHIP_CHANGED) case.
#
# VERIFICATION NOTE ON THE TASK BRIEF: the brief hinted at possible Warner Bros. /
# Nerdist / Curiosity-streaming arrangements. These COULD NOT be verified for
# Vsauce and are deliberately NOT encoded (see review notes) — "Curiosity" is the
# Curiosity Box merchandise venture, not a streaming/ownership deal, and no Tier
# 1/2 source ties Warner Bros. or Nerdist to Vsauce's ownership or to an MCN that
# represented it. Precision over coverage (docs/evidence-policy.md §4).

