  # Co-founders Kevin Lieber and Jake Roper (hosts of the sibling channels Vsauce2
  # / Vsauce3) are noted in review, not added as edges, to keep this record scoped
  # to the main Vsauce channel.
  - subject: curiosity_box
    type: FOUNDED_BY
    object: stevens
    confidence: 0.85
    status: ACTIVE

  # 4: FORMER PRODUCTION / LICENSING RELATIONSHIP — NOT OWNERSHIP. Mind Field, a
  # YouTube Red (later YouTube Premium) ORIGINALS series created and hosted by
  # Stevens, aired exclusively on the Vsauce channel from 2017-01-18 to 2019-10-24
  # (3 seasons; co-produced by Vsauce and The Intellectual Property Corporation).
  # YouTube Red commissioned it for exclusive distribution — a per-series content
  # deal, NOT an acquisition of the channel. Modeled as channel DISTRIBUTED_BY
  # youtube_red with control_level LICENSE and status ENDED, effective dates set to
  # the series' documented premiere and final-episode dates. control_level LICENSE
  # (a content-licensing/distribution arrangement, not an ownership or controlling
  # interest). This edge is NOT a channel-owning type and does NOT affect the
  # ownership classification. See review notes — scope is the Mind Field originals
  # only, not the channel generally.
  - subject: channel
    type: DISTRIBUTED_BY
    object: youtube_red
    control_level: LICENSE
    effective_from: 2017-01-18
    effective_to: 2019-10-24
    confidence: 0.7
    status: ENDED

