review:
  researched_by: claude-research-agent-m1
  notes: >-
    DRAFT for human review — "independent creator-owned channel with documented
    PAST PRODUCTION/VENTURE context (not a past ownership change)" case. Follows
    the same non-ownership-context modeling as pewdiepie.yaml and jacksepticeye.yaml.

    CHANNEL ID: UC6nSFpj9HTCZ5t-N3Rm3-HA, extracted from the externalId field in
    the raw HTML of https://www.youtube.com/@Vsauce (curl fetch, no JS execution).
    Corroborated by the page's own
    <link rel="canonical" href="https://www.youtube.com/channel/UC6nSFpj9HTCZ5t-N3Rm3-HA">
    and the embedded educational keywords ("Science questions education learning
    schools DiscoveryChannel").

    CORE MODELING DECISION — CREATOR-OWNED, NO OWNERSHIP TRANSITION. Michael
    Stevens founded Vsauce (rel 0, 2010-04-16) and, per all Tier 1/2 sourcing,
    still owns it (rel 1, ACTIVE, CONTROLLING). No source documents any sale,
    equity stake, or transfer of the channel; a sale has only ever been discussed
    HYPOTHETICALLY (Dexerto, 2023). There is therefore NO ENDED ownership edge and
    NO prior-owner period.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) OWNERSHIP EDGE (rel 1, stevens OWNS channel) is the weakest-supported edge
    and the reviewer's primary focus. It rests on his founding/hosting the channel
    (rels 0, 2) plus the DOCUMENTED ABSENCE of any transfer, not a direct Tier-1
    ownership disclosure. control_level CONTROLLING; confidence deliberately
    moderate (0.7); no ownership percentage asserted. A reviewer may wish to
    confirm the operating entity behind the channel (none is documented to a Tier
    1/2 standard, so none is asserted).
    (2) MIND FIELD / YOUTUBE RED (rel 4) — PRECISION FLAG. This is a per-series
    content production/licensing/exclusive-distribution deal (2017-01-18 to
    2019-10-24) for the Mind Field originals that aired on the channel; it is NOT
    a channel acquisition and did NOT transfer ownership. It is modeled as
    channel DISTRIBUTED_BY youtube_red / control_level LICENSE / status ENDED with
    both effective dates set to the series' documented premiere and final-episode
    dates. CAVEAT: "channel DISTRIBUTED_BY YouTube Red" is scoped in intent to the
    Mind Field originals only — every YouTube channel is trivially distributed by
    YouTube, so this edge is meaningful ONLY as the paid-originals licensing era.
    A reviewer may prefer to (a) drop this edge and keep it as context only, or
    (b) re-scope it to a series-level node, if the data model supports one. Mind
    Field was co-produced by Vsauce and The Intellectual Property Corporation
    (IPC); IPC is noted here rather than added as an entity to keep the graph
    scoped to the channel.
    (3) CURIOSITY BOX (rel 3) — VENTURE OUTSIDE THE OWNERSHIP CHAIN. A quarterly
    science subscription-box company co-founded by the three Vsauce hosts (Stevens,
    Kevin Lieber, Jake Roper), announced September 2016. Recorded as FOUNDED_BY for
    documented context only; it does NOT own the channel and does NOT feed the
    classification (same treatment as jacksepticeye.yaml's coffee/apparel
    ventures). effective_from omitted (month only). Co-founders Lieber/Roper are
    not added as entities (they host the separate Vsauce2/Vsauce3 channels); a
    reviewer may add them if a Curiosity Box sub-graph is desired.
    (4) TASK-BRIEF CLAIMS THAT DID NOT VERIFY — deliberately NOT encoded. The brief
    hinted at Warner Bros., Nerdist, and a "Curiosity"/streaming deal.
      - "Curiosity" resolves to The Curiosity Box merchandise venture (rel 3), NOT
        a streaming or ownership deal. No Vsauce/Discovery/Curiosity Stream
        streaming acquisition is documented in any Tier 1/2 source located.
      - NERDIST: no Tier 1/2 source ties Nerdist Industries to Vsauce's ownership
        or to an MCN that represented the channel. (Nerdist was acquired by
        Legendary Entertainment in 2012 — unrelated to Vsauce.) Appears to be a
        conflation; not encoded.
      - WARNER BROS.: no Tier 1/2 source ties Warner Bros. to Vsauce. (Warner Bros.
        took a stake in the MCN Machinima in 2014 — a different network, unrelated
        to Vsauce.) Appears to be a conflation; not encoded.
      Per docs/evidence-policy.md, unverified relationships remain research leads
      and are not published; precision over coverage.
    (5) NEXT NEW NETWORKS / GOOGLE EMPLOYMENT — CONTEXT, NOT CHANNEL EDGES.
    Stevens was employed by Barely Political and Next New Networks (NNN) around the
    2008–2010 period, and worked as a Google/YouTube content strategist from 2012
    (the year after Google acquired NNN). These are EMPLOYMENT relationships of the
    INDIVIDUAL Stevens, not ownership or representation of the Vsauce CHANNEL, and
    no Tier 1/2 source states NNN owned or represented the channel. They are
    recorded here as context only and intentionally NOT modeled as channel edges.
    A reviewer with a Tier 1/2 source establishing that Vsauce was formally part of
    the NNN network could add a dated ENDED REPRESENTS edge; none was located.
    (6) NEUTRAL FRAMING. Per docs/legal-risk.md, this record describes ownership,
    production, and venture structure only and makes NO claim of editorial
    interference or wrongdoing. The YouTube Red/Mind Field arrangement is described
    as documented content licensing; no conclusion about editorial control is drawn.

    PROPOSED CLASSIFICATION (computed by importer, not asserted here): expected
    CREATOR_OWNED (GREEN) — the only ACTIVE channel-owning edge is Stevens (a
    CREATOR) OWNS channel / CONTROLLING. The Curiosity Box edge (rel 3) is a
    company FOUNDED_BY a creator (outside the chain), and the Mind Field edge (rel
    4) is an ENDED, non-owning DISTRIBUTED_BY/LICENSE edge — neither feeds the
    ownership label. No OWNERSHIP_CHANGED_RECENTLY warning expected (no ownership
    edge changed; the ENDED production edge is from 2017–2019, well outside the
    12-month window as of the 2026 evaluation date). Confidence moderate, gated by
    the Tier-2-only, inference-based OWNS edge.

    All backing sources are Tier 2 (Wikipedia, Tubefilter, Dexerto). No Tier 1
    source directly discloses channel ownership; no Tier 3/4 source is used.
  last_reviewed_at: 2026-07-29
