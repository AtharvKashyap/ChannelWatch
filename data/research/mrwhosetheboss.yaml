review:
  researched_by: claude-research-agent-m1
  notes: >-
    DRAFT for human review — "independent, creator-owned single-creator channel"
    case, with a Tier-1-documented UK operating company on the side. Computed
    classification is expected to be CREATOR_OWNED: the channel's direct
    owner/controller is the CREATOR himself (rel 1), a CREATOR entity, with no
    company, firm, or external investor in the channel's ownership chain. No
    PE-label evidence rule is engaged (no PRIVATE_EQUITY_FIRM or
    PORTFOLIO_COMPANY_OF edge).

    CHANNEL ID: UCMiJRAwDNSNzuYeN2uWa0pA, extracted from the sole "externalId"
    field in the raw HTML of https://www.youtube.com/@Mrwhosetheboss (curl fetch,
    no JS). Matches the channel's own /channel/UC... canonical URL.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) FOUNDING DATE: rel 0 effective_from is OMITTED. Wikipedia documents only
    the year ("Years active 2011-present"). Lower-quality SEO biography sites
    give a joined-YouTube date of 20 April 2011 and a first upload of 22 April
    2011, but these are Tier 3/4 and were not relied on; a reviewer with a
    primary source (e.g. the channel's own join date on the About panel) could
    add a precise date.
    (2) COMPANY-TO-CHANNEL LINK / OWNERSHIP EDGE (rel 1) is the reviewer's
    primary focus. I modeled the channel as CREATOR-DIRECT-owned (Arun OWNS
    channel, CONTROLLING, no percentage), NOT as company-owned, because NO
    primary source explicitly states that BOSS GLOBAL MEDIA LIMITED owns or
    operates this YouTube channel. The channel's own About page and description
    are written in the first person ("I'm Arun Maini") with no company
    attribution or business email naming the company. The company's SIC codes
    (advertising agencies / media representation) and its "BOSS" branding
    strongly suggest it is his media/YouTube business vehicle, but that is an
    INFERENCE, not a documented company->channel ownership statement, so I did
    not assert a company OWNS channel edge (which would need its own supporting
    source per the evidence policy). Note the classification is robust to this
    choice: were a reviewer to confirm via a primary source that BOSS GLOBAL
    MEDIA owns/operates the channel, the model would become the
    creator-controlled-company shape (company OWNS channel; Arun OWNS company
    CONTROLLING, already rel 3) and would still compute CREATOR_OWNED (via the
    CREATOR_CONTROLLED_COMPANY rule). The channel-ownership edge itself (rel 1)
    is partly an inference from DOCUMENTED ABSENCE (no external owner/investor/
    acquirer found anywhere); confidence set to 0.7 to reflect this. No
    percentage guessed.
    (3) OWNERSHIP_PERCENTAGE OMITTED on rel 3 (Arun's stake in BOSS GLOBAL MEDIA
    LIMITED) because UK Companies House PSC records report a statutory band
    ("75% or more"), not an exact figure; a reviewer with the Confirmation
    Statement / share register could tighten this.
    (4) COMPANY OFFICER/PSC HISTORY (context, not modeled as channel edges):
    Companies House shows Malti Maini was a co-PSC of BOSS GLOBAL MEDIA (25-50%
    band) and a director from incorporation, ceased as PSC on 20 April 2018 and
    resigned as director on 4 July 2024 — i.e. an early co-shareholder, now Arun
    is the sole 75%+ PSC. Dhrisha Mehta was appointed a director on 19 March 2024
    but is NOT a PSC (an officer, not an owner). Neither is an external investor;
    no PE/VC/fund involvement was found.
    (5) SECOND COMPANY (out of scope): Arun Maini is also director and PSC of
    BOSS GLOBAL PROPERTIES LIMITED (Companies House 11239611, incorporated 7
    March 2018, SIC 68100 buying and selling of own real estate). This is a real
    estate vehicle unrelated to the channel and is NOT modeled here.
    (6) NIGHT MEDIA (talent representation, not ownership): Maini signed with
    talent management company Night Media in May 2021 (Tubefilter). This is
    representation/management of the creator, not ownership or acquisition of the
    channel, and creates no inbound ownership edge; it was not modeled. Neutral
    note: no conclusion is drawn about editorial control. A reviewer could model
    it as a REPRESENTS edge if desired, but it does not affect classification.
    (7) NO EXTERNAL INVESTMENT / ACQUISITION of the channel or of BOSS GLOBAL
    MEDIA LIMITED was found.
    (8) SOURCES: the two ownership-relevant company edges (rel 3, rel 4) rest on
    Tier 1 UK Companies House primary records. The channel founding/hosting/
    creator-ownership edges rest on the channel's own About page (Tier 1
    DIRECT_CREATOR_CONFIRMATION) and Wikipedia (Tier 2). No Tier 1 primary source
    positively stating sole personal ownership of the channel was captured — a
    lead for a reviewer wanting stronger corroboration of the rel-1 inference.
  last_reviewed_at: 2026-07-23
