# Profile: a creator-OWNED channel. Corridor Crew is the SECOND channel of
# Corridor Digital, an independent Los Angeles visual-effects / production studio
# founded by Sam Gorski and Niko Pueringer (their flagship channel is "Corridor
# Digital"; Corridor Crew, formerly the "Sam and Niko" channel, carries the
# behind-the-scenes / VFX-reaction formats such as "VFX Artists React"). Every
# fetched source describes Corridor as independent and self-funded (YouTube ad
# revenue, brand integrations, Patreon, and its own subscription). NO outside /
# private-equity ownership, network ownership, or equity investment in the
# channel or in Corridor Digital was found in any source. A prominent
# creator-economy angle was checked specifically — a Spotter catalog-licensing
# deal — and NONE was found (see review.notes); note that even a Spotter deal
# would be revenue LICENSING, not ownership or equity (Spotter states it takes no
# equity), so it would not change the ownership picture regardless.

