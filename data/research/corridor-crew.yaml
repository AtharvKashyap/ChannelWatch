  notes: >-
    DRAFT for human review — "creator-owned company" case (second channel of an
    independent, founder-owned production studio). Requires human verification
    before publication.

    CHANNEL ID. UCSpFnDQr88xCZ80N-X7t0nQ, taken from the "externalId" field in the
    raw HTML of https://www.youtube.com/@CorridorCrew (curl, no JS execution),
    captured adjacent to "canonicalBaseUrl":"/@CorridorCrew", and independently
    cross-checked against YouTube's OWN RSS feed
    (youtube.com/feeds/videos.xml?channel_id=UCSpFnDQr88xCZ80N-X7t0nQ), whose
    <title>, <author><name>, and <yt:channelId> all confirm "Corridor Crew" /
    this UC id. Reviewer should confirm against the live channel.

    OWNERSHIP — the core finding. Corridor Crew is the SECOND channel of Corridor
    Digital (their flagship channel is "Corridor Digital"). Corridor Digital is an
    independent Los Angeles VFX/production studio founded by Sam Gorski and Niko
    Pueringer and is consistently described as independent and self-funded (YouTube
    ad revenue, brand integrations, Patreon, and its own subscription). NO source
    found states or implies any outside/private-equity owner, network owner,
    parent company, or equity investor of the channel or of Corridor Digital.
    Accordingly the two founders are encoded as PARTIALLY_OWNS + CONTROLLING into
    the company (joint-documented-owner convention, 2026-07-23 policy), and
    Corridor Digital OWNS + CONTROLLING the channel.

    SPOTTER CHECK (per task). I specifically searched for a Corridor / Corridor
    Digital <-> Spotter deal (catalog licensing or investment). NONE was found in
    any fetched source or search result — no such deal is documented. This is
    recorded as a checked-and-not-found item, not an edge. Separately, even if a
    Spotter deal existed, Spotter's model is REVENUE-CATALOG LICENSING and Spotter
    publicly states it takes NO equity and creators "remain 100% independent";
    licensing is NOT ownership and would not, on its own, create an ownership or
    control edge (cf. legal-risk policy: "investment is not proof of editorial
    control"; and the jubilee.yaml treatment of investment vs ownership).

    EXPECTED COMPUTED CLASSIFICATION. Direct channel owner is a COMPANY (Corridor
    Digital) that is creator-controlled via two CONTROLLING PARTIALLY_OWNS edges
    from its founders, with NO PRIVATE_EQUITY_FIRM / PORTFOLIO_COMPANY_OF edge in
    the chain and no outside equity. The classifier should therefore compute
    CREATOR_OWNED (explanation CREATOR_CONTROLLED_COMPANY), analogous to
    good-mythical-morning. Confirm the computed label at import.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) THIRD PARTNER. Entrepreneur.com describes Jake Watson (operations
    director) as a third "partner" with "higher-level involvement," alongside
    Gorski and Pueringer. This means the two founders may not be the strictly SOLE
    owners. "Partner" here may be a loose/role term rather than a documented equity
    stake, and every source that names the FOUNDERS names only Gorski & Pueringer,
    so the joint-owner convention is applied to the two founders and Watson is NOT
    modeled as an owner (precision over recall). A reviewer who locates
    documentation of Watson's equity should add him as a PERSON entity with the
    appropriate edge; this does not change the CREATOR_OWNED outcome but affects
    the ownership roster.
    (2) rel 0 (Corridor Digital OWNS channel, CONTROLLING, conf 0.85). No fetched
    source states channel ownership verbatim; it is the structural identity
    between the studio and its own second channel. A reviewer may prefer OPERATES
    if a stricter reading is wanted — note OPERATES does NOT resolve as an
    ownership edge in the classifier and would yield OWNERSHIP_UNCLEAR instead.
    (3) FOUNDING DATES. Company incorporation recorded as 2009-10-09 per Wikipedia
    (operations from 2010; the pair moved to LA in 2008; the YouTube presence began
    ~2011). Reviewer may wish to confirm the exact incorporation date against a
    corporate registry (California Secretary of State) — recorded here at the
    date the source states but treated as draft-level.
    (4) CHANNEL FOUNDING / RENAME. The channel began as the "Sam and Niko" channel
    and was rebranded to "Corridor Crew" (a May 31, 2018 video, "Secret stories of
    the Corridor Crew (why we changed the channel name)," reportedly explains the
    rename). The "formerly Sam and Niko" claim appears in community wikis (Fandom
    Wikitubia) rather than a Tier 1/2 source I could fetch (Wikipedia's article did
    not state the former name; the Fandom page returned HTTP 402), so it is recorded
    here as a LEAD in this note, not as an asserted alias/edge. No verified channel
    account creation date was obtained, so effective_from is omitted on rels 1-2.
    (5) HOSTS. Corridor Crew is on-camera-hosted by a broader "crew" (e.g. Wren
    Weichman, Jake Watson, and others) in addition to Gorski and Pueringer. No
    HOSTED_BY edges were modeled (they add no ownership-classification signal and
    the full cast was not enumerated from a primary source); a reviewer may add
    them if per-host granularity is wanted.
    (6) NO PE INVOLVEMENT. No PRIVATE_EQUITY_FIRM entity and no PORTFOLIO_COMPANY_OF
    edge — the §14.3 PE-label evidence gate does not apply and no PE-implying
    language is used anywhere in this record.
    (7) SOURCES. One Tier 1 (YouTube's own feed, for channel-id/identity) and two
    Tier 2 ESTABLISHED_INDUSTRY_PUBLICATION sources (Wikipedia; an Entrepreneur
    feature). No Tier 1 primary corporate-registry or filing source for the
    ownership itself was located; nothing here should be treated as CONFIRMED
    without further primary-source diligence. archive_urls (beyond the feed) should
    be captured at review.
