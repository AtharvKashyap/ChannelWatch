  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-30
  last_reviewed_at: 2026-07-29 # research/authoring date; NOT a human review date.
  notes: >-
    DRAFT for human review — "independent creator-owned channel that took ONE
    external MINORITY investment" case. Requires human verification before
    publication. reviewed_by intentionally OMITTED (unverified draft; the schema
    field is optional, not nullable — do NOT set it without human review).

    CHANNEL ID. UCJHA_jMfCvEnv-3kRjTCQXw, taken from the sole "externalId" field
    in the raw HTML of https://www.youtube.com/@bingingwithbabish (curl, no JS),
    confirmed by the page's own og:url
    (https://www.youtube.com/channel/UCJHA_jMfCvEnv-3kRjTCQXw) and the
    channelMetadataRenderer whose vanityChannelUrl is @bingingwithbabish. NOTE:
    the handles @babishculinaryuniverse / @BabishCulinaryUniverse both return 404;
    the live handle is @bingingwithbabish.

    CHANNEL NAME. The research brief and the umbrella brand call this "Babish
    Culinary Universe," but the LIVE channel's current title (raw HTML
    pageHeaderRenderer + channelMetadataRenderer, and Wikipedia's lead: "Binging
    with Babish, formerly Babish Culinary Universe") is "Binging with Babish."
    The channel was branded "Babish Culinary Universe" (~2021) and has since
    reverted to "Binging with Babish." display_name recorded as the current live
    title; "Babish Culinary Universe" and "Binging with Babish" are both carried
    as aliases on the creator entity. Reviewer should confirm the current
    display name against the live channel and decide the preferred display_name.

    NO "BABISH MEDIA" LEGAL ENTITY FOUND. The brief referred to "Babish Media."
    No fetched source documents a legal operating entity by that (or any) name for
    Rea's business — sources treat "Babish Culinary Universe" as a brand/content
    business synonymous with Rea's operation. Following the mkbhd.yaml precedent
    (creator brand with no reliably-sourced legal entity), NO company node is
    modeled; Rea is recorded as the direct owner of the channel and the investment
    edge points at the channel as the business's flagship asset. If a reviewer
    confirms a formal operating company (name/jurisdiction/founding date) via a
    primary source, switch to a creator-controlled-company shape (rea CONTROLS or
    CONTROLLING-OWNS the company; company OWNS the channel; Made In Network
    INVESTED_IN the company) — see the classification note below for how that
    changes the badge.

    EXPECTED COMPUTED CLASSIFICATION = EXTERNALLY_FUNDED. Direct channel owner is
    a CREATOR (Andrew Rea, OWNS + CONTROLLING, rel 0). There is an active MINORITY
    INVESTED_IN edge into the channel (rel 2, Made In Network). Per
    @channelwatch/graph classification Rule 4, a CREATOR/PERSON direct owner plus
    an active control_level=MINORITY INVESTED_IN/FUNDS edge into the channel (or
    that owner) computes EXTERNALLY_FUNDED (explanation code DIRECT_OWNER_CONFIRMED;
    ultimate parent = Rea). No OWNERSHIP_CHANGED_RECENTLY warning (the 2024-09-10
    investment is >12 months before the 2026-07-29 asOf and, being a funding edge,
    is not part of the ownership chain the warning scans). Confirm the computed
    label at import.

    PE GATE — NOT TRIGGERED. There is NO PRIVATE_EQUITY_FIRM node and NO
    PORTFOLIO_COMPANY_OF edge, so no PE-implying relationship exists and the §14.3
    sourcing gate does not apply. Made In Network is a media/creator company
    (COMPANY), not PE. FOR CONTEXT ONLY (deliberately NOT modeled): Made In
    Network itself took a reported $50M investment/partnership from MEP Capital and
    Cordillera Investment Partners in 2022. Those firms are TWO levels removed from
    this channel and reachable only through a MINORITY investor's edge, so they do
    not enter this channel's ownership chain and create no PE label here. A reviewer
    should NOT add MEP/Cordillera edges to this record absent direct relevance.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) INVESTOR IDENTITY CONFLICT — the primary verification item. Tubefilter
    (2024-09-10) and Forbes (2024-12-04) both name the ~$3M investor as "Made In
    Network," a Nashville media company and Babish collaborator since 2018. A more
    recent Adweek piece (2026-07-06, carrying a correction note) instead names "the
    cookware brand Made In" (i.e. Made In Cookware, a separate DTC brand Babish has
    a cookware collaboration with). The entity is modeled as "Made In Network"
    because two independent Tier 2 sources — including the report specifically
    about this investment — agree on it against Adweek's one. Reviewer should
    reconcile against a primary source. NOTE: the label does NOT change either way
    — both readings are a MINORITY, non-PE strategic investment into a
    creator-owned channel → EXTERNALLY_FUNDED.
    (2) rel 2 control_level = MINORITY is an INFERENCE (no percentage disclosed).
    It is inferred from Rea's explicit on-record statements that the investor
    would not "steer the ship"/"creatively railroad" him and that he "retains
    creative control," plus the single-raise, founder-led context. This qualifier
    is load-bearing for the badge: if a reviewer downgrades it to control_level
    UNKNOWN, Rule 4 no longer fires and the label becomes CREATOR_OWNED instead of
    EXTERNALLY_FUNDED. Do NOT upgrade to a controlling/majority stake without a
    firm source (that would be neither documented nor consistent with the retained-
    control statements).
    (3) rel 0 (Rea OWNS channel, CONTROLLING, conf 0.8). Stronger than a bare
    inference-from-absence: sources present MKBHD-style sole creator ownership AND
    Rea affirmatively states he retains ownership/creative control post-investment.
    No corporate filing or explicit percentage was located, so no ownership_
    percentage is asserted. A reviewer wanting Tier 1 corroboration of sole
    ownership should seek a US business filing / registered entity for his
    operation.
    (4) rel 2 target = channel is an IDENTITY INFERENCE. The documented investment
    target is the "Babish Culinary Universe" business/brand; the channel is modeled
    as its flagship asset (same reasoning as epic-gardening rel 0). If the reviewer
    prefers to model the business as a distinct company node with Rea controlling
    it, the investment would attach to that company and the computed label would be
    CREATOR_OWNED (CREATOR_CONTROLLED_COMPANY) — with the external minority
    investment surfaced only in the evidence panel, not the badge. entity_type for
    Made In Network (COMPANY vs the more specific MEDIA_NETWORK) is a related minor
    judgment call; it does not affect the label (minority investor, not in the
    ownership chain).
    (5) OTHER RELATIONSHIPS RULED OUT (per the brief's leads):
    - VOX MEDIA: provides "back-end support" for Babish's podcast (In the Booth /
      "In the Booth with Babish") while "Rea retains creative control" (Adweek).
      This is podcast production support, NOT ownership/control of the YouTube
      channel, so NO Vox edge is modeled. Flagged in case a reviewer finds a
      broader Vox arrangement.
    - FIRST WE FEAST / SPOTTER: no ownership or investment relationship to this
      channel was found. First We Feast (Hot Ones) is a Complex/BuzzFeed-lineage
      brand (BuzzFeed sold the Hot Ones studio for $82.5M) — only editorial
      collaboration, no Babish ownership tie. "Spotter" appears only as a
      tool/sponsor, not an ownership deal. No edges modeled.
    (6) SOURCES / ARCHIVES. All four sources are Tier 2 (Tubefilter, Forbes,
      Wikipedia, Adweek). No Tier 1 primary source (business registry filing or a
      direct on-the-record ownership document) was captured. Excerpts are verbatim
      from the fetched pages; archive_urls should be captured at review. The $3M
      figure and the retained-control framing are consistent across Forbes and
      Adweek; only the investor NAME conflicts (see (1)).
