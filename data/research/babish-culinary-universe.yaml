  # contains exactly ONE "externalId":"UC..." value (this one), inside the
  # channelMetadataRenderer whose vanityChannelUrl is @bingingwithbabish. Other
  # UC ids visible on the page belong to featured/related channels only.
  youtube_channel_id: UCJHA_jMfCvEnv-3kRjTCQXw
  # NAMING: the live channel's current title (raw HTML pageHeaderRenderer /
  # channelMetadataRenderer, and Wikipedia's lead) is "Binging with Babish";
  # "Babish Culinary Universe" is the FORMER channel name and the umbrella brand
  # the research brief used. display_name recorded as the current title; the
  # brand name is carried as an alias-style note. See review.notes (CHANNEL NAME).
  display_name: Binging with Babish
  handle: "@bingingwithbabish"

entities:
  - slug: rea
    # Founder, sole documented owner/controller, and the channel's on-camera
    # creator (does production, editing and narration). Recorded CREATOR (not
    # PERSON): he is himself the face/host, like Kevin Espiritu, not a
    # behind-the-scenes owner.
    canonical_name: Andrew Rea
    entity_type: CREATOR
    aliases:
      - Babish
      - Andrew Douglas Rea
      - Binging with Babish
      - Babish Culinary Universe

  - slug: made_in_network
    # The investor per the two most specific sources on the investment event
    # (Tubefilter, whose report is literally about the "Made In Network"
    # investment, and Forbes). Described as "a Nashville-based media company that
    # works with around 30 creators across YouTube, TikTok, and Instagram"
    # (Tubefilter). Founded 2013, Nashville TN. Typed COMPANY (neutral, literal
    # to "media company"); MEDIA_NETWORK is a defensible more-specific
    # alternative given the ~30-creator network — flagged for the reviewer. It is
    # NOT a private-equity firm. NOTE the investor-identity conflict with Adweek
    # (which names "the cookware brand Made In") — see review.notes.
    canonical_name: Made In Network
    entity_type: COMPANY
    jurisdiction: US-TN
    aliases:
      - Made In Network, LLC

relationships:
  # 0: Andrew Rea owns/controls the channel. Recorded OWNS + CONTROLLING, no
  # percentage. Rea created the channel and remains its owner-operator; after the
  # 2024 outside investment he stated on the record that the investor "isn't
  # going to creatively railroad us or try to steer the ship according to their
  # vision" and (Adweek) that "Rea retains creative control" — i.e. a documented
  # retention of ownership/control, not merely inferred from absence. No corporate
  # filing or explicit "owns 100%" statement was located, so no percentage is
  # asserted. This is the load-bearing edge for the classification. conf 0.8.
  - subject: rea
    type: OWNS
    object: channel
    control_level: CONTROLLING
    confidence: 0.8
    status: ACTIVE

  # 1: The channel was created by Andrew Rea as "Binging with Babish" on
  # 2006-08-21 (Wikipedia, citing the channel's own history; regular episodes
  # began February 2016). Personal founding edge — pre-dates any business
  # structure by years.
  - subject: channel
    type: FOUNDED_BY
    object: rea
    effective_from: 2006-08-21
    confidence: 0.9
    status: ACTIVE

  # 2: Made In Network made a ~$3M MINORITY strategic investment into the Babish
  # business/brand, announced 2024-09-10 (Tubefilter; $3M figure per Forbes and
  # Adweek). Recorded INVESTED_IN + MINORITY: multiple sources agree it is an
  # "investment" to fund growth/content, Rea explicitly retained ownership and
  # creative control, and NO source states a majority/controlling/percentage
  # stake or an acquisition. The edge points at the CHANNEL as the flagship asset
  # of Rea's business (identity inference — the documented target is the "Babish
  # Culinary Universe" business, of which the channel is the flagship; cf.
  # epic-gardening rel 0). MINORITY is an inference from the explicit retained-
  # control statements plus the single-investment, founder-led context — flagged.
  # effective_from is the announcement date used as an operative-date proxy.
  # Made In Network is NOT a PE firm, so this is NOT a PE-implying edge.
  - subject: made_in_network
    type: INVESTED_IN
    object: channel
    control_level: MINORITY
    effective_from: 2024-09-10
    confidence: 0.8
    status: ACTIVE

  # 3: Andrew Rea is the channel's principal on-camera host/creator (does
  # production, editing and narration). Distinct from the ownership/founding
  # edges. Well documented and ongoing.
  - subject: channel
    type: HOSTED_BY
    object: rea
    confidence: 0.95
    status: ACTIVE

