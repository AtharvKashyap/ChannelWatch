# CHANNELWATCH research record — Babish Culinary Universe / Binging with Babish
# (Andrew Rea)
#
# DRAFT FOR HUMAN REVIEW. Nothing here is published without human verification
# (Spec §12.7). Classification is COMPUTED by the importer, never asserted here.
#
# Profile: an independent, CREATOR-OWNED flagship cooking channel founded and
# hosted by Andrew Rea ("Babish") in 2006, that took ONE documented external
# MINORITY investment (~$3M, announced September 2024) while Rea explicitly
# RETAINED ownership and creative control. The central factual distinctions this
# record encodes:
#
#   channel (Binging with Babish / "Babish Culinary Universe")
#     ├─ FOUNDED_BY ──────── Andrew Rea (created the channel 2006-08-21)
#     ├─ HOSTED_BY ───────── Andrew Rea (on-camera creator/narrator/editor)
#     ├─ OWNS ←──────────── Andrew Rea (CONTROLLING; retains ownership + creative
#     │                      control per his own on-record statements after the
#     │                      2024 investment)
#     └─ INVESTED_IN ←────── Made In Network (a ~$3M MINORITY strategic investment
#                            into the Babish business/brand; NOT a controlling or
#                            majority stake, NOT an acquisition, NOT a PE firm).
#
# Made In Network is a Nashville media/creator company — NOT a private-equity
# firm — and its edge is a MINORITY INVESTED_IN, so it does NOT enter the
# ownership chain the classifier traverses. The §14.3 PE-evidence gate is
# therefore NOT triggered (no PRIVATE_EQUITY_FIRM node, no PORTFOLIO_COMPANY_OF
# edge). Because the direct owner is a CREATOR and there is an active MINORITY
# funding edge, the expected computed label is EXTERNALLY_FUNDED (see
# review.notes). Legal-risk policy: investment is not proof of editorial control.

