relationships:
  # 0: Epic Gardening (the company/brand) owns/operates its eponymous YouTube
  # channel. No fetched source states this in the "Company X owns Channel Y" form
  # verbatim; it is the structural identity — sources treat "Epic Gardening" the
  # company and its YouTube channel as one business, describing Epic as "the
  # leading creator-led, content-to-commerce brand in gardening" whose channel is
  # its flagship content asset. control_level CONTROLLING (a company controls its
  # own flagship channel). Recorded OWNS with moderate confidence; flagged for the
  # reviewer as an inference of identity rather than a quoted ownership statement.
  - subject: epic_gardening
    type: OWNS
    object: channel
    control_level: CONTROLLING
    confidence: 0.8
    status: ACTIVE

  # 1: Epic Gardening was founded by Kevin Espiritu in 2013 (first video uploaded
  # February 2013; "Founded in 2013" per the TCG announcement). Day precision not
  # firmly established -> effective_from omitted rather than guessed. Pre-dates the
  # 2022 outside investment by ~9 years.
  - subject: epic_gardening
    type: FOUNDED_BY
    object: kevin
    confidence: 0.9
    status: ACTIVE

  # 2: The Chernin Group (TCG) made a $17.5M investment in Epic Gardening,
  # announced 2022-01-25 (round reportedly closed ~December 2021 per secondary
  # reporting). Recorded INVESTED_IN + control_level MINORITY: the Tier 1
  # announcement states an "investment ... to finance its continued growth and
  # expansion" and names a TCG partner, but NO source states a majority,
  # controlling, or percentage stake; the company was bootstrapped for ~10 years
  # by its founder/CEO before this single raise. This edge terminates at the
  # COMPANY (Epic Gardening), NOT the channel, and — being a minority stake — does
  # NOT establish ownership/control of the channel by TCG (cf. jubilee.yaml).
  # control_level MINORITY is an inference from the absence of any control language
  # plus the founder-led, single-round context — flagged for the reviewer.
  # PORTFOLIO_COMPANY_OF is DELIBERATELY NOT used: TCG's release refers to its
  # "portfolio" as loose marketing, which does not document PE control/ownership.
  - subject: tcg
    type: INVESTED_IN
    object: epic_gardening
    control_level: MINORITY
    effective_from: 2022-01-25
    confidence: 0.85
    status: ACTIVE

  # 3: Kevin Espiritu is the channel's on-camera creator/host (distinct from the
  # ownership/founding edges). Supported by the TCG announcement's description of
  # him showcasing his "growing journey ... directly to my audience" and viewers
  # "learning how to garden with Kevin and team as your companions."
  - subject: channel
    type: HOSTED_BY
    object: kevin
    confidence: 0.9
    status: ACTIVE

  # 4: OUTBOUND acquisition — Epic Gardening ACQUIRED Botanical Interests,
  # announced 2023-01-11. Epic is the ACQUIRER here (Botanical is the target); the
  # Botanical brand, its Colorado HQ, and employees were retained. This enriches
  # the graph but does NOT affect the Epic Gardening channel's own ownership
  # classification (it is a downstream asset of Epic, not an owner of it).
  - subject: epic_gardening
    type: ACQUIRED
    object: botanical_interests
    effective_from: 2023-01-11
    confidence: 0.9
    status: ACTIVE

