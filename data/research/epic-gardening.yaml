review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally OMITTED: this is an unverified DRAFT (the schema
  # field is optional, not nullable). Do NOT set it without human review.
  last_reviewed_at: 2026-07-23 # research/authoring date; NOT a human review date.
  notes: >-
    DRAFT for human review — "creator-founded, founder-led content-to-commerce
    company with ONE documented external growth investment" case. Requires human
    verification before publication.

    CHANNEL ID. UCSbyncU597LMwb3HhnAI_4w, taken from the "externalId" field in the
    raw HTML of https://www.youtube.com/@epicgardening (curl, no JS execution),
    captured adjacent to "canonicalBaseUrl":"/@epicgardening". Reviewer should
    confirm against the live channel.

    CORRECTION TO THE RESEARCH BRIEF — ONE ROUND, NOT TWO. The brief anticipated
    "reported rounds involving TCG ~2020 and later growth investment ~2022." The
    evidence does NOT support two rounds. Every fetched source describes a SINGLE
    external raise: $17.5M from The Chernin Group (TCG), announced 2022-01-25
    (Business Wire), with the company bootstrapped for ~10 years beforehand.
    Secondary reporting indicates the round closed ~December 2021 and was
    announced January 2022; some coverage calls it a "Series A." No 2020 TCG round
    was found in any fetched source, so none is recorded (evidence-first: a
    round we cannot document is not modeled).

    OWNERSHIP vs INVESTMENT — the core finding. The channel is the flagship asset
    of Epic Gardening, a founder-led content-to-commerce company founded by Kevin
    Espiritu (founder & CEO, and the channel's on-camera creator). The company has
    taken ONE documented outside investment — the $17.5M TCG raise — and NO
    fetched source states that TCG (or anyone) holds a controlling or majority
    stake, nor that Epic Gardening was acquired. Accordingly TCG is recorded as
    INVESTED_IN + MINORITY into the COMPANY, which is NOT ownership of the channel
    (cf. jubilee.yaml). Legal-risk policy: "investment is not proof of editorial
    control"; describe structure, never imply the founder lost control.

    EXPECTED COMPUTED CLASSIFICATION. Direct channel owner is a COMPANY (Epic
    Gardening). TCG's edge is a MINORITY INVESTED_IN into the company — the
    ultimate-parent traversal follows only SUBSIDIARY_OF, PORTFOLIO_COMPANY_OF and
    CONTROLLING OWNS/PARTIALLY_OWNS edges, so a minority INVESTED_IN does NOT put
    TCG in the ownership chain. There is therefore no PRIVATE_EQUITY_FIRM in the
    chain and no PORTFOLIO_COMPANY_OF edge, so the channel is NOT PE_BACKED despite
    TCG being typed PRIVATE_EQUITY_FIRM. With no DOCUMENTED controlling-equity edge
    from Kevin Espiritu into the company, the classifier should compute
    CORPORATE_OWNED (direct owner: Epic Gardening; explanation
    DIRECT_OWNER_CONFIRMED). Confirm the computed label at import.

    PE GATE — SATISFIED (but not triggering a PE label). Because TCG is typed
    PRIVATE_EQUITY_FIRM, the INVESTED_IN edge (rel 2) is "PE-implying" and must
    satisfy the §14.3 sourcing rule over its supporting sources: ONE Tier 1
    source, OR two independent Tier 2 sources. It is satisfied by the Tier 1
    official announcement (businesswire_tcg), AND additionally by two independent
    Tier 2 sources with distinct publishers (gpn_2022 / Greenhouse Product News
    and wikipedia_epic_gardening / Wikipedia). Note this gate governs SOURCING for
    a PE-implying edge; it does NOT by itself produce a PE_BACKED classification
    (see EXPECTED COMPUTED CLASSIFICATION — TCG is only a minority investor).

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) TCG entity_type = PRIVATE_EQUITY_FIRM. Sources characterize TCG
    inconsistently: it self-describes and is described (e.g. f4.fund, its own
    materials) as a "growth equity firm"; Wikipedia's "TCG (company)" lead calls
    it an "investment advisory firm focused on private equity investments";
    Variety's headline calls it an "investment firm"; Private Equity Wire covers
    it as PE. The Spec §15.1 node vocabulary has no GROWTH_EQUITY type, so
    PRIVATE_EQUITY_FIRM was chosen as the closest documented fit (growth equity
    being a form of private equity). A reviewer preferring a stricter,
    lower-implication reading may switch this to INVESTMENT_FIRM (mirroring the
    Electrify judgment call in veritasium.yaml); doing so removes the §14.3 gate on
    rel 2 but does NOT change the computed label (still CORPORATE_OWNED, since TCG
    is a minority investor either way).
    (2) rel 2 control_level = MINORITY is an INFERENCE, not a stated fact. NO
    fetched source discloses TCG's percentage or uses "majority"/"minority"/
    "controlling". MINORITY is inferred from (a) the absence of any control
    language in the Tier 1 announcement and (b) the founder-led, single-raise,
    ~decade-bootstrapped context. This is the primary edge for the reviewer to
    scrutinize; confidence is set at 0.85 (the $17.5M investment fact is Tier-1
    solid, but the control_level qualifier is the softer part). If a reviewer
    LOCATES a documented stake/percentage that is majority/controlling, rel 2 would
    need to become PARTIALLY_OWNS + CONTROLLING and the computed label would flip
    to PE_BACKED — do NOT make that change without a firm source.
    (3) rel 2 effective_from = 2022-01-25 is the ANNOUNCEMENT date, used as a proxy
    for the operative date (per veritasium.yaml / jubilee.yaml precedent). Secondary
    reporting indicates the round actually closed ~December 2021 (no exact day
    located). Reviewer may prefer a precise operative close date if one is found;
    the announcement date is also recorded on businesswire_tcg.published_at.
    (4) CREATOR-CONTROL / potential CREATOR_OWNED flip (same shape as jubilee.yaml
    JUDGMENT CALL 2). Kevin Espiritu is founder AND CEO of a company he bootstrapped
    for ~10 years and that took only a minority growth investment — in practice a
    strong indication of founder control — BUT no fetched source documents his
    equity percentage or a controlling stake, and a bare FOUNDED_BY does NOT satisfy
    the creator-controlled-company rule (precision over recall). If a reviewer
    LOCATES documentation of Espiritu's controlling equity, adding a CONTROLS or a
    CONTROLLING PARTIALLY_OWNS edge from kevin -> epic_gardening would flip the
    computed label to CREATOR_OWNED (CREATOR_CONTROLLED_COMPANY). This is
    deliberately NOT asserted here for lack of documentation — it is the single most
    consequential open item, as it changes the badge.
    (5) rel 0 (Epic Gardening OWNS channel, CONTROLLING, conf 0.8). No fetched
    source states channel ownership verbatim; it is the structural identity between
    the company/brand and its eponymous channel (sources use "Epic Gardening" for
    both interchangeably; the channel is the company's flagship content asset). A
    reviewer wanting a stricter reading may prefer OPERATES — note OPERATES does NOT
    resolve as an ownership edge in the classifier and would yield OWNERSHIP_UNCLEAR
    instead. Epic Gardening's exact legal name was not verified (jurisdiction
    recorded US-CA at San Diego HQ precision; "Epic Gardening, Inc." listed as an
    alias, not confirmed).
    (6) rel 4 (Epic Gardening ACQUIRED Botanical Interests, 2023-01-11) is OUTBOUND
    and CONTEXTUAL — Epic is the ACQUIRER, Botanical the target. It does NOT affect
    the Epic Gardening channel's own ownership classification. effective_from is the
    announcement date (Business Wire, 2023-01-11); terms were not disclosed.
    businesswire_botanical (Tier 1) could not be body-fetched (Business Wire and
    web.archive.org were not retrievable by the fetcher here); its excerpt is the
    verbatim release HEADLINE only, and rel 4 is independently supported by two
    fetched Tier 2 sources (seedworld_2023, wikipedia_epic_gardening). Reviewer
    should capture a full archive snapshot of the Business Wire release.
    (7) SOURCES / ARCHIVES. businesswire_tcg was verified via a Wayback Machine
    capture (archive_url recorded) since the live Business Wire page timed out for
    the fetcher; its excerpt is verbatim from that capture. Remaining sources are
    Tier 2 (Greenhouse Product News, Wikipedia, Seed World). Nothing here should be
    treated as CONFIRMED without further primary-source diligence (e.g. a corporate
    registry record for Epic Gardening establishing Espiritu's stake, which would
    resolve JUDGMENT CALL 4). archive_urls for the Tier 2 sources should be captured
    at review.
