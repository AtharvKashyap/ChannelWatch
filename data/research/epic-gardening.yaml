# CHANNELWATCH research record — Epic Gardening (Kevin Espiritu)
#
# DRAFT FOR HUMAN REVIEW. Nothing here is published without human verification
# (Spec §12.7). Classification is COMPUTED by the importer, never asserted here.
#
# Profile: a creator-founded, founder-led CONTENT-TO-COMMERCE COMPANY that
# owns/operates its eponymous YouTube channel and took ONE documented external
# growth investment — $17.5M from The Chernin Group (TCG), announced 2022-01-25.
# The central factual distinctions this record encodes:
#
#   channel (Epic Gardening)
#     └─ OWNS ─────────────── Epic Gardening (the company/brand; the channel is
#          │                  its flagship content asset)
#          ├─ FOUNDED_BY ───── Kevin Espiritu (founded 2013; founder & CEO;
#          │                   on-camera creator — see HOSTED_BY)
#          ├─ INVESTED_IN ←─── The Chernin Group (TCG): a $17.5M growth
#          │                   investment. Recorded control_level MINORITY — NO
#          │                   source states a majority/controlling stake. This
#          │                   is NOT ownership or control of the channel.
#          └─ ACQUIRED ──────> Botanical Interests (2023, OUTBOUND — Epic is the
#                              ACQUIRER; contextual, does not affect the channel's
#                              own ownership classification)
#
# TCG is typed PRIVATE_EQUITY_FIRM (see notes for the sourcing behind this and the
# INVESTMENT_FIRM alternative flagged for the reviewer). Because that makes the
# TCG endpoint "PE-implying", the §14.3 PE-evidence gate applies to the INVESTED_IN
# edge and IS satisfied (a Tier 1 official announcement, plus two independent
# Tier 2 sources). CRITICALLY, this does NOT make the channel PE_BACKED: TCG holds
# only a documented MINORITY investment (INVESTED_IN, not OWNS/PARTIALLY_OWNS-
# CONTROLLING and not PORTFOLIO_COMPANY_OF), so it never enters the ownership
# chain the classifier traverses. See review.notes for the expected label.

