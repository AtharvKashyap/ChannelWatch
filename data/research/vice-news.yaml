  notes: "DRAFT. 2026-07-30 fix (triage: SINGLE-SRC, one source backed 3+ edges). Added two independent sources so no edge rests on a single source: (a) the official court-approval announcement (PR Newswire, 2023-06-23, Tier 1 OFFICIAL_ACQUISITION_ANNOUNCEMENT) naming the same Investor Group (Fortress, Soros Fund Management, Monroe Capital) and the ~$350M credit bid, now backing the three purchaser edges alongside the completion announcement; and (b) Wikipedia (Tier 2) establishing that VICE News is Vice Media's channel (its website and YouTube channel), backing the channel-ownership edge. Fortress control_level was DOWNGRADED from CONTROLLING to UNKNOWN: neither fetched official source states a controlling or majority stake for any single purchaser (the court filing names a Fortress managing director as spokesperson but assigns no hierarchy), so a controlling claim was not supportable. The three purchasers are modeled as PARTIALLY_OWNS without percentages because the announcements give none. effective_from 2023-07-31 is the sale-completion date. Because the ownership includes investment firms, human review should confirm whether any entity qualifies as PRIVATE_EQUITY_FIRM before publication. reviewed_by is absent."
