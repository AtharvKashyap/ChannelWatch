  # creator-controlled company (→ CREATOR_OWNED classification).
  - subject: rhett
    type: PARTIALLY_OWNS
    object: mythical
    control_level: CONTROLLING
    confidence: 0.85
    status: ACTIVE
  # 8: Link is a co-owner of Mythical (same joint-sole-owner convention as rel 7).
  - subject: link
    type: PARTIALLY_OWNS
    object: mythical
    control_level: CONTROLLING
    confidence: 0.85
    status: ACTIVE
  # 9: Mythical acquired Smosh in Feb 2019. Recorded as OWNS, then ENDED, because
  # in June 2023 Mythical sold majority ownership of Smosh back to its founders
  # (see rel 10). This edge concerns Smosh, not the GMM channel.
