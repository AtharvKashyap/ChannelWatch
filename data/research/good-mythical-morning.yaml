# CHANNELWATCH research record — Good Mythical Morning (Rhett & Link)
#
# DRAFT for human review. Nothing here is published without verification.
#
# Profile: a creator-OWNED channel. Good Mythical Morning (GMM) is produced by
# Mythical Entertainment, LLC — a privately held, self-financed studio founded
# and owned by the show's two hosts, Rhett McLaughlin and Link Neal. There is
# NO outside/PE ownership of the channel or of Mythical found in any source.
# Mythical has itself been an ACQUIRER of other properties (Smosh, 2019) and
# later a divester (sold majority of Smosh back to its founders in 2023,
# retaining a minority stake) — those corporate moves are recorded below for
# temporal completeness but describe Mythical's activity, not any change in the
# ownership of the GMM channel itself.

