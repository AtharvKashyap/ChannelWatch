    type: OWNS
    object: smosh
    control_level: CONTROLLING
    effective_from: 2019-02-22
    effective_to: 2023-06-20
    confidence: 0.85
    status: ENDED
  # 10: After June 2023, Mythical retains only a MINORITY stake in Smosh (Rhett &
