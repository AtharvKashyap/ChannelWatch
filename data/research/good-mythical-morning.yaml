    object: link
    effective_from: 2009-01-01
    confidence: 0.85
    status: ACTIVE
  # 7: Rhett is a co-owner of Mythical. Sources describe Mythical as owned by
  # Rhett & Link and as "independent and self-financed"; no individual split is
  # disclosed, so no percentage is asserted. Per project policy (2026-07-23,
