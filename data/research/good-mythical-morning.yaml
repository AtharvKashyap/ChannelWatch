  notes: >-
    DRAFT for human review — "creator-owned company" case. No outside/private-
    equity ownership of the GMM channel or of Mythical Entertainment was found
    in any source; the channel is owned/produced by Mythical, which is in turn
    owned by its two hosts.

    CHANNEL ID: UC4PooiX37Pld1T8J5SYT-SQ. Verified against YouTube's OWN RSS
    feed (youtube.com/feeds/videos.xml?channel_id=UC4PooiX37Pld1T8J5SYT-SQ),
    whose <title> and <author><name> both read "Good Mythical Morning"; this is
    also the target of the canonical /channel/ URL. (The @GoodMythicalMorning
    handle page's rendered HTML did not expose ytInitialData through the fetch
    tool, so the feed was used as the authoritative cross-check instead.)

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) FOUNDING DATE OF THE CHANNEL (rels 1-2): recorded as 2012-01-09, the
    documented launch of the Good Mythical Morning show. NOTE a discrepancy a
    reviewer should resolve: third-party analytics report the underlying YouTube
    channel *account* as created 2008-09-17 (predating GMM; the account appears
    to have hosted Rhett & Link's earlier output before GMM began). effective_from
    is set to the show launch (2012-01-09), which is the better-documented and
    more meaningful date, but the 2008 account-creation date is flagged here.
    (2) COMPANY FOUNDING (rels 5-6): 2009 as "Rhett & Link, Inc.", renamed to
    "Mythical Entertainment, LLC" in 2017 (recorded as an alias on the entity).
    effective_from set to 2009-01-01 (year only documented; exact day not found).
    A reviewer may wish to model the 2017 rename as a distinct entity/edge if the
    schema prefers that over an alias.
    (3) OWNERSHIP SPLIT (rels 7-8): sources say Mythical is owned by Rhett & Link
    and is "independent and self-financed," but NO source discloses the split
    between the two, so control_level is UNKNOWN and no ownership_percentage is
    asserted for either founder. rel 0 (Mythical OWNS channel) is marked
    CONTROLLING to reflect that Mythical is the sole operating/production owner
    of the channel; percentage likewise omitted.
    (4) SMOSH EDGES (rels 9-10) are included per the task's request to capture
    acquisitions/divestitures with dates, but they describe MYTHICAL's corporate
    activity, not the GMM channel's ownership. rel 9 (2019-02-22 acquisition,
    control CONTROLLING) is set to status ENDED with effective_to 2023-06-20;
    rel 10 records the post-June-2023 MINORITY stake Mythical retained after
    selling majority ownership back to Smosh founders Ian Hecox and Anthony
    Padilla. Smosh's own founders are NOT modeled as entities here (out of scope
    for a GMM record). Note: no PE-implying label is asserted anywhere in this
    record, so the §14.3 PE-label evidence rule is not triggered.
    (5) A Jan 2026 Variety feature ("Inside the Company Behind 'Good Mythical
    Morning'") likely corroborates the independent/self-financed characterization
    and may add detail on any Mythical Ventures creator-investment activity; it
    could not be fetched (host redirects to a paywall/tollbit gateway) and is
    therefore a LEAD for a follow-up researcher, not cited here. Reporting also
    references a "Mythical Ventures" fund through which Rhett & Link invest in /
    mentor other creators — that is Mythical acting as an investor in OTHERS, not
    outside money coming into Mythical, and is left out of this record pending
    primary-source detail.
  last_reviewed_at: 2026-07-23
