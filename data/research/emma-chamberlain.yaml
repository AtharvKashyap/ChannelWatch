    2016-06-14 is the best-documented launch date and is used here.
    (3) CHAMBERLAIN COFFEE IS NOT THE CHANNEL — the central distinction this
    record encodes. Chamberlain Coffee is a SEPARATE business Emma Chamberlain
    founded (December 2019) and, per the PR Newswire release, is now co-led by her
    (she is founder; reported elsewhere as promoted to Co-CEO in 2024 — not
