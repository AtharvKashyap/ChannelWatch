    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) OWNERSHIP EDGE (rel 1) is the reviewer's primary focus. It is recorded
    OWNS + CONTROLLING with NO percentage. This is partly an INFERENCE FROM
