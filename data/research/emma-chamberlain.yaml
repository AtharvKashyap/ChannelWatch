    "led by key existing investors including venture builder Blazar Capital,
    founder and investor Emma Chamberlain, and United Talent Agency [...] joined by
    growth equity firm Volition Capital [...] Electric Feel Ventures [...] L.A.
    Libations and Noah Bremen." Those investors invest in the COFFEE COMPANY, NOT
    the YouTube channel. They are therefore DELIBERATELY NOT modeled as
    relationships and Volition Capital is DELIBERATELY NOT declared as an entity:
    doing so would (a) risk implying, incorrectly, that the channel is
    investor/PE-backed, and (b) drag a PE-implying edge (Volition Capital is
