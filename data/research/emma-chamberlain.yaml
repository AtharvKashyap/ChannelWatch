    table modeled, it belongs in a SEPARATE record about Chamberlain Coffee (or a
    company node explicitly not linked into the channel's ownership chain), typed
    precisely — Volition Capital as a growth-equity/PRIVATE_EQUITY_FIRM per its own
    self-description, the others as INVESTMENT_FIRM/VENTURE nodes — and would still
    have no bearing on this channel's CREATOR_OWNED classification.
    (4) TALENT-AGENCY REPRESENTATION IS NOT OWNERSHIP. Wikipedia: "In July,
    Chamberlain was signed by United Talent Agency" (year not pinned in the fetched
    source; commonly reported as 2018 — reviewer to confirm). UTA represents her
    professionally and also appears as an INVESTOR in Chamberlain Coffee, but
