review:
  researched_by: akashyap@cybastiontech.com
  notes: >-
    DRAFT for human review — "independent, creator-owned single-creator channel"
    case, structurally the same shape as dream.yaml. Computed classification is
    expected to be CREATOR_OWNED: the channel's only owner/controller is the
    CREATOR himself (rel 1, OWNS + CONTROLLING) plus FOUNDED_BY (rel 0), with no
    company, network, firm, or external investor anywhere in the chain. No
    PE-label evidence rule is engaged (no PRIVATE_EQUITY_FIRM or
    PORTFOLIO_COMPANY_OF edge). No OWNERSHIP_CHANGED warning expected (the single
    OWNS edge is continuous from the 2017 founding; no ENDED ownership edge
    exists).

    CHANNEL ID: UCR1D15p_vdP3HkrH8wgjQRw, extracted from the sole "externalId"
    field in the raw HTML of https://www.youtube.com/@InternetHistorian (curl
    fetch, no JS), corroborated by the page's own <link rel="canonical"
    href="https://www.youtube.com/channel/UCR1D15p_vdP3HkrH8wgjQRw">.

    PRIVACY HANDLING (docs/evidence-policy.md §5, §4) — PARAMOUNT here: the
    creator is PSEUDONYMOUS and has NOT publicly self-disclosed a legal identity.
    A purported real name is repeated on fan wikis (Fandom, TV Tropes,
    Grokipedia) and SEO blogs, but that is Tier 4 (leads-only), unsourced to any
    self-disclosure, and doxxing-adjacent — it is DELIBERATELY EXCLUDED and
    legal_name is omitted rather than guessed. Also excluded: birth date (the
    creator has said the widely-circulated April 20, 1989 date is a fake he
    supplied to a celebrity-facts site), residence/location (commonly reported as
    New Zealand, and separately Australia, on fan wikis only — unverified, not
    ownership-relevant, so OMITTED per the "verify or omit" instruction), and
    family details (a spouse is referenced in the interview but is not
    ownership-relevant and is out of scope). Framing is strictly neutral: this
    record describes channel ownership/hosting only.

    OUT OF SCOPE / NEUTRALITY: a Dec 2023 plagiarism dispute (raised in
    Hbomberguy's video re the "Man in Cave" video) received coverage. It concerns
    content sourcing, NOT channel ownership, and per docs/legal-risk.md is not
    modeled and implies no wrongdoing here; noted only so a reviewer knows it was
    considered and excluded as ownership-irrelevant.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) FOUNDING DATE: rel 0 effective_from 2017-01-01 is the documented channel
    "Joined" date from the About page raw HTML. The first public upload was
    2017-01-09 (Know Your Meme). A reviewer may prefer 2017-01-09 as the
    effective activity start.
    (2) OWNERSHIP EDGE (rel 1) is the reviewer's primary focus. Recorded OWNS +
    CONTROLLING with NO percentage and modest confidence (0.6). This is partly an
    inference from DOCUMENTED ABSENCE — every source presents the channel as the
    creator's own independent operation and none reports any external
    owner/investor/acquirer/network/manager — rather than from an explicit
    ownership statement or corporate filing. No percentage was guessed. If a
    reviewer rejects the documented-absence inference and drops rel 1, the
    remaining FOUNDED_BY + HOSTED_BY edges may compute OWNERSHIP_UNCLEAR instead
    of CREATOR_OWNED; that would be an honest outcome given the pseudonymity. A
    direct on-the-record ownership statement, or a business-registry filing for a
    formal operating company, would be a Tier 1 corroboration lead.
    (3) CORPORATE / NETWORK CHECK (requested): NO entity that owns the channel was
    found. Specifically:
    - No management company, MCN, or media network was found to own or manage the
      channel. The creator monetizes via Patreon (patreon.com/internethistorian)
      and in-video sponsorships; a Patreon/sponsorship relationship is a funding
      arrangement, NOT channel ownership, and is not modeled.
    - NEBULA: Internet Historian has been popularly associated with Nebula (a
      creator-collective streaming platform operated by Standard, in which
      creators collectively hold equity). This could NOT be reliably confirmed for
      this creator from the sources gathered, and in any case platform
      membership/distribution is NOT ownership of the YouTube channel — so it is
      not modeled. If a reviewer confirms a current Nebula relationship via a
      primary source, model it as DISTRIBUTED_BY (platform), which does not change
      the CREATOR_OWNED outcome for the YouTube channel.
    - A secondary channel, "Internet Historian: Incognito Mode," exists; it is a
      separate channel and is out of scope for this record.
    (4) EXTERNAL INVESTMENT / ACQUISITION: none of the channel was found.
    (5) SOURCES: both are Tier 2 (ESTABLISHED_INDUSTRY_PUBLICATION), but from the
    SAME publisher (Know Your Meme). No PE-label rule (which would require
    independent publishers) is engaged, so this is acceptable for a
    non-PE record; however a reviewer wanting stronger corroboration should seek a
    second INDEPENDENT reputable publisher or a Tier 1 primary source (a direct
    creator ownership statement or a business-registry filing). No Tier 3/4 source
    is used to support any published edge.
  last_reviewed_at: 2026-07-23
