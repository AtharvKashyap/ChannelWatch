review:
  researched_by: claude-research-agent-m1
  # reviewed_by omitted: not yet reviewed (schema field is optional, not nullable).
  notes: >-
    DRAFT for human review — pilot "externally funded but creator-controlled"
    case. Channel ID UCX6OQ3DkcsbYNE6H8uQQuVA was extracted from the canonical
    youtube.com/channel/ link in the @MrBeast page source (verified against
    channelId/canonical URL in source HTML).

    JUDGMENT CALLS:
    (1) Donaldson->Beast Industries (rel 0): recorded PARTIALLY_OWNS +
    CONTROLLING. Sources state he owns "a little over half"; that is majority
    (=> CONTROLLING) but NOT a precise figure, so ownership_percentage is
    omitted rather than guessed. The "little over half" figure traces to a 2024
    deposition reported by Business Insider (accessed here via Entrepreneur,
    Tier 2). A reviewer should ideally confirm against the primary Business
    Insider / deposition reporting.
    (2) Alpha Wave->Beast Industries (rel 1): INVESTED_IN, not any OWNS/CONTROLS
    type, to keep investment distinct from control. control_level MINORITY is
    inferred from the documented facts that the founder retains a majority and
    that ~$300M of a ~$5B valuation is a small stake; the exact investor
    percentage is NOT publicly disclosed. Flagged for reviewer.
    (3) Beast Industries->channel (rel 2): recorded OPERATES with control_level
    UNKNOWN. Reporting consistently places the YouTube channel inside Beast
    Industries' "media business," but no source documents the precise legal
    ownership or control terms of the channel entity, so control is UNKNOWN and
    confidence is deliberately low. This is the weakest-documented edge and the
    main item needing human attention.
    (4) Housenbold->Beast Industries (rel 4): MANAGES / MANAGEMENT only —
    president & CEO. No ownership or editorial-control assertion is made.

    NOT recorded (insufficient public documentation): exact cap-table
    percentages; whether the channel is held by a specific Beast Industries
    subsidiary vs. Donaldson personally; other 2024 Series C participants
    (undisclosed). Later reported financings (e.g. Bitmine, Step acquisition)
    were seen in search results but are out of scope for this ownership record
    and were not included.

    All supporting sources are Tier 2 reputable business press; no Tier 1
    primary filing was located, so no relationship is above HIGH confidence and
    none should be published as CONFIRMED without further primary sourcing.
  last_reviewed_at: 2026-07-22
