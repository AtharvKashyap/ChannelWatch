# CHANNELWATCH research record — MrBeast (Jimmy Donaldson)
#
# Pilot record for the "externally funded but creator-controlled" case.
# DRAFT for human review. Nothing here is published without verification.
#
# Structure distinguished, per brief:
#   (a) the channel  — the @MrBeast YouTube channel (UCX6OQ3DkcsbYNE6H8uQQuVA)
#   (b) Beast Industries — the operating/holding company for MrBeast's ventures
#   (c) outside investors — e.g. Alpha Wave Global (2024 Series C lead)
# Investment, ownership, and control are recorded as DIFFERENT relationship
# types. Where public sources do not document control terms, control_level is
# UNKNOWN rather than inferred.

channel:
  youtube_channel_id: UCX6OQ3DkcsbYNE6H8uQQuVA
  display_name: MrBeast
  handle: "@MrBeast"

entities:
  - slug: donaldson
    canonical_name: Jimmy Donaldson
    entity_type: CREATOR
    legal_name: James Stephen Donaldson
    aliases:
      - MrBeast

  - slug: beast_industries
    canonical_name: Beast Industries
    entity_type: COMPANY
    aliases:
      - Beast Industries LLC

  - slug: alpha_wave
    canonical_name: Alpha Wave Global
    entity_type: INVESTMENT_FIRM
    aliases:
      - Alpha Wave

  - slug: housenbold
    canonical_name: Jeff Housenbold
    entity_type: PERSON
    legal_name: Jeffrey Housenbold

relationships:
  # 0: Jimmy Donaldson holds a majority ("a little over half") of Beast
  # Industries. Majority => CONTROLLING, but exact percentage is NOT publicly
  # disclosed, so ownership_percentage is omitted. This is the core
  # "creator-controlled" fact of the profile.
  - subject: donaldson
    type: PARTIALLY_OWNS
    object: beast_industries
    control_level: CONTROLLING
    confidence: 0.72
    status: ACTIVE

  # 1: Alpha Wave Global led the 2024 Series C ($300M) that valued Beast
  # Industries at ~$5B. This is an INVESTMENT, not ownership control. Minority
  # is documented indirectly: the founder retains majority (rel 0), so external
  # investors are collectively a minority; a ~$300M stake in a ~$5B company is
  # single-digit percent.
  - subject: alpha_wave
    type: INVESTED_IN
    object: beast_industries
    control_level: MINORITY
    effective_from: 2024-01-01
    confidence: 0.7
    status: ACTIVE

  # 2: Beast Industries is the company behind MrBeast's media business, which
  # public reporting says "includes his YouTube channel." The exact legal
  # ownership/control terms of the channel entity itself are NOT separately
  # documented, so control_level is UNKNOWN. Recorded as OPERATES rather than
  # OWNS for that reason.
  - subject: beast_industries
    type: OPERATES
    object: channel
    control_level: UNKNOWN
    confidence: 0.55
    status: ACTIVE

  # 3: Jimmy Donaldson remains the creator/host of the channel.
  - subject: channel
    type: HOSTED_BY
    object: donaldson
    confidence: 0.9
    status: ACTIVE

  # 4: Jeff Housenbold serves as president & CEO of Beast Industries — external
  # management. Management control only; does not imply ownership.
  - subject: housenbold
    type: MANAGES
    object: beast_industries
    control_level: MANAGEMENT
    effective_from: 2024-01-01
    confidence: 0.8
    status: ACTIVE

