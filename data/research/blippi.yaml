review:
  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-23
  # reviewed_by intentionally OMITTED — this is an UNVERIFIED DRAFT. Its absence
  # (the schema treats reviewed_by as optional, not nullable) signals "not yet
  # human-reviewed." Do NOT set it until a human completes review.
  last_reviewed_at: 2026-07-23
  notes: >
    DRAFT — UNVERIFIED, requires two-person human review (Spec §20.3: PE
    involvement + named individuals). Do not publish without verification.

    CHANNEL ID. UC5PYHgAzJ1wLEidB58SK6Xw, extracted from the "externalId" field
    in ytInitialData in the raw HTML of https://www.youtube.com/@Blippi (curl
    fetch, no JS). Cross-checked two ways: the canonical /channel/UC... URL in
    the same page source (canonicalBaseUrl "/channel/UC5PYHgAzJ1wLEidB58SK6Xw"),
    and YouTube's own RSS feed
    (feeds/videos.xml?channel_id=UC5PYHgAzJ1wLEidB58SK6Xw), whose <yt:channelId>
    and <title> ("Blippi - Educational Videos for Kids") both match.

    CHAIN & CONFIDENCE.
    (0) Moonbug OWNS Blippi: HIGH. Announced 2020-07-30 in Moonbug's own PR
    Newswire release (T1) whose TITLE explicitly names Blippi ("...Acquires
    YouTube Sensations CoComelon and Blippi..."), corroborated by Kidscreen (T2,
    same date, excerpt names Blippi), by Blackstone's 2021 acquisition PR (T1,
    lists Blippi among Moonbug's shows), and by Wikipedia (T2). This is the SAME
    announcement date as cocomelon.yaml (2020-07-30) and effective_from is
    recorded at day precision to match cocomelon. INFERENCE FLAG:
    ownership_percentage set to 100 as an inference — sources describe an outright
    acquisition of the brand/channel, not a partial stake; the PRs state no
    percentage. Reviewer to confirm; if in doubt, drop ownership_percentage and
    keep only control_level CONTROLLING. (Same treatment as cocomelon rel 0.)
    (1) Candle Media OWNS Moonbug: HIGH/CONFIRMED. 2021-11-04 official Blackstone
    announcement (T1) + THR (T2); deal reported ~$3B and has closed. SAME hop and
    SAME sources as cocomelon.yaml / little-baby-bum.yaml. Wikipedia independently
    states Blippi "became a subsidiary of Candle Media on November 1, 2021" (note
    the slightly different day — Nov 1 close vs. the Nov 4 announcement recorded
    on the source's published_at; effective_from uses 2021-11-04 to stay
    consistent with the sibling records — reviewer to reconcile Nov 1 vs Nov 4).
    (2) Candle Media PORTFOLIO_COMPANY_OF Blackstone: MODERATE. Two Blackstone T1
    PRs describe Candle as "backed by investment capital from Blackstone"; THR
    calls it "Blackstone-backed." No source states a percentage or controlling
    stake, so control_level and ownership_percentage are UNKNOWN. SAME hop and
    caveats as the sibling records.

    FOUNDING & HOST (distinct from ownership — the record's second axis).
    (3) FOUNDED_BY Stevin John: Wikipedia (T2) — "The show was created and the
    character originally played by Stevin John. He posted the first episode of
    the show on YouTube in January 2014, which featured tractors." effective_from
    OMITTED because only month precision ("January 2014") is documented (full ISO
    date required by schema; commonly cited as 2014-01-27 but not confirmed by a
    fetched T1/T2 source — reviewer to pin the exact day). This is a FOUNDING
    fact and is NOT an ownership edge.
    (4) HOSTED_BY Stevin John: he is the original on-camera host and remains
    publicly associated with the channel as creator/host. IMPORTANT NUANCE: since
    May 8, 2021 the Blippi character has ALSO been portrayed on the channel by
    Clayton Grimm (who had played Blippi in live shows); a third performer (Ben
    Mayer) is also listed by Wikipedia. This multi-actor arrangement is recorded
    only as context in this note; Clayton Grimm and Ben Mayer are NOT modeled as
    entities (they are performers, not owners), and the arrangement does not
    change ownership. Reviewer may choose to add HOSTED_BY edges for the other
    performers if desired. control/ownership are NOT asserted for any host.

    OWNERSHIP-vs-ROLE SEPARATION (Spec §4, §40.2; legal-risk §2). Stevin John
    FOUNDED and hosts Blippi but is NOT recorded as an owner — Moonbug acquired
    the property in 2020. Financial ownership (Moonbug->Candle->Blackstone) and
    on-camera/creative role (Stevin John) are described as distinct axes; neither
    is presented as evidence of the other. No claim of editorial interference or
    misconduct is made.

    EXPECTED COMPUTED CLASSIFICATION: PE_BACKED (same as cocomelon.yaml /
    little-baby-bum.yaml). The current direct owner is Moonbug (COMPANY), whose
    parent Candle is a PORTFOLIO_COMPANY_OF Blackstone (PRIVATE_EQUITY_FIRM), so
    the ownership chain terminates at a PE firm. The FOUNDED_BY / HOSTED_BY edges
    are NOT ownership edges and do not confer creator ownership (Stevin John holds
    no OWNS/PARTIALLY_OWNS/CONTROLS edge), so they do not shift the computed owner
    away from the Moonbug->Candle->Blackstone chain. Confirm the computed label at
    import.

    SHARED-ENTITY REUSE. The moonbug, candle and blackstone entities (slug,
    canonical_name, legal_name, jurisdiction, website, aliases) are copied
    VERBATIM from data/research/cocomelon.yaml / little-baby-bum.yaml so all three
    records resolve to the same graph nodes. The moonbug_cocomelon_pr,
    kidscreen_cocomelon, blackstone_moonbug_pr, blackstone_westbrook_pr and
    thr_candle_moonbug sources are also reused verbatim (same URLs, tiers, archive
    URLs, excerpts). The 2020-07-30 Moonbug PR is the SAME document that announced
    CoComelon — its title names Blippi explicitly.

    BLACKSTONE ENTITY-TYPE NUANCE (reviewer decision, carried from the sibling
    records). Blackstone Inc. is a diversified alternative asset manager, NOT
    solely a PE firm. Classified PRIVATE_EQUITY_FIRM because (a) the founding
    Candle investment was led by Blackstone's Global Head of Private Equity (Joe
    Baratta, per the Westbrook PR) and (b) Blackstone is Candle's principal equity
    backer. The actual investing VEHICLE (a specific Blackstone-managed fund) is
    not named in the sources; if identified, model it as a FUND that Blackstone
    MANAGES holding the Candle stake. Keep consistent with the sibling records.

    PE-LABEL RULE (§14.3). The PE-implying edge (rel 2, endpoint is a
    PRIVATE_EQUITY_FIRM) is backed by a Tier 1 source (blackstone_moonbug_pr),
    satisfying the "one Tier 1, or two independent Tier 2" requirement.

    DATE PRECISION. Moonbug->Blippi: 2020-07-30 (announcement date, day
    precision, matching cocomelon). Candle->Moonbug: 2021-11-04 (announcement
    date; Wikipedia notes a Nov 1 subsidiary date — reconcile at review). Candle
    backed by Blackstone: 2021, year only — effective_from omitted. Founding:
    January 2014, month only — effective_from omitted.

    ENTITY GAPS (carried from sibling records). Candle Media legal name and
    jurisdiction of incorporation not verified. Moonbug UK registry number not
    verified. Stevin John's legal name and any personal holding company (if the
    creator retained equity) not established by a fetched source — no personal
    data beyond already-public brand facts is included (Spec §22.4). Confirm at
    review.

    LEGAL/NEUTRALITY. Language describes ownership STRUCTURE and creative ROLE
    only; no claim of editorial interference, loss of control, or misconduct.
    Exact stakes disclosed only where public (100% inferred for rel 0 and flagged;
    Blackstone stake UNKNOWN). "The creator remains publicly associated with the
    channel" (legal-risk §1 preferred wording).

    SOURCES. T1: Moonbug/PR Newswire (2020-07-30, names Blippi in title);
    Blackstone PRs (2021-11-04, 2022-01-04) — the Blackstone pages are blocked to
    WebFetch by Cloudflare, so archive_url (Wayback) is provided and excerpts are
    from the archived copies. T2: Kidscreen (2020-07-30, names Blippi), The
    Hollywood Reporter (2022), Wikipedia (Blippi article, founding + host +
    acquisition). Variety's 2020-07-30 report corroborates the acquisition but is
    paywalled to the fetcher, so it was not recorded as a source.
