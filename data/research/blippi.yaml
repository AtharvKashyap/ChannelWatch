  # YouTube's own RSS feed (feeds/videos.xml?channel_id=UC5PYHgAzJ1wLEidB58SK6Xw)
  # returns <yt:channelId>UC5PYHgAzJ1wLEidB58SK6Xw</yt:channelId> with a matching
  # <title>.
  youtube_channel_id: UC5PYHgAzJ1wLEidB58SK6Xw
  display_name: Blippi - Educational Videos for Kids
  handle: "@Blippi"

entities:
  # --- SHARED ENTITIES: fields kept identical to cocomelon.yaml / little-baby-bum.yaml ---
  - slug: moonbug
    canonical_name: Moonbug Entertainment
    entity_type: COMPANY
    legal_name: Moonbug Entertainment Limited
    jurisdiction: GB
    website: https://www.moonbug.com
    aliases:
      - Moonbug
      - Moonbug Entertainment Ltd.
  - slug: candle
    canonical_name: Candle Media
    entity_type: COMPANY
    website: https://www.candlemedia.com
    aliases:
      - Candle
  - slug: blackstone
    # See review.notes: Blackstone Inc. is a diversified alternative asset
    # manager. Classified PRIVATE_EQUITY_FIRM because the founding investment in
    # Candle was led by Blackstone's Global Head of Private Equity and Blackstone
    # is Candle's principal equity backer; the specific investing fund vehicle is
    # not named in the sources. (Identical to cocomelon.yaml / little-baby-bum.yaml.)
    canonical_name: Blackstone Inc.
    entity_type: PRIVATE_EQUITY_FIRM
    legal_name: Blackstone Inc.
    jurisdiction: US-DE
    website: https://www.blackstone.com
    aliases:
      - Blackstone
      - The Blackstone Group

  # --- FOUNDING CREATOR / HOST (distinct from ownership) ---
  - slug: stevin_john
    canonical_name: Stevin John
    entity_type: CREATOR
    aliases:
      - Blippi
      - Steezy Grossman

relationships:
  # 0: Moonbug owns the Blippi channel. Acquisition announced 2020-07-30 in the
  # SAME Moonbug PR Newswire release that announced CoComelon (title explicitly
  # names Blippi), corroborated by Kidscreen (T2) and by Blackstone's 2021 PR
  # (T1) which lists Blippi among Moonbug's shows. Not a PE-implying edge (both
  # endpoints COMPANY / channel). Same hop/date convention as cocomelon.yaml.
  - subject: moonbug
    type: OWNS
    object: channel
    control_level: CONTROLLING
    ownership_percentage: 100
    effective_from: 2020-07-30
    confidence: 0.92
    status: ACTIVE
  # 1: Candle Media acquired Moonbug (announced 2021-11-04, ~$3B); Candle is
  # Moonbug's controlling corporate parent. Not a PE-implying edge (both COMPANY).
  # Same edge as cocomelon.yaml / little-baby-bum.yaml (shared parent hop).
  - subject: candle
    type: OWNS
    object: moonbug
    control_level: CONTROLLING
    effective_from: 2021-11-04
    confidence: 0.9
    status: ACTIVE
  # 2: Candle Media is a portfolio company of Blackstone (PE-implying: object is a
  # PRIVATE_EQUITY_FIRM). Sources' own words: "backed by investment capital from
  # Blackstone." Stake/control NOT stated by sources -> control_level UNKNOWN.
  # Same edge as cocomelon.yaml / little-baby-bum.yaml.
  - subject: candle
    type: PORTFOLIO_COMPANY_OF
    object: blackstone
    control_level: UNKNOWN
    # effective_from omitted: sources date the Blackstone backing to 2021 without a day (see notes)
    confidence: 0.75
    status: ACTIVE
  # 3: Channel founded by Stevin John — he created the show and posted its first
  # episode (about tractors) on YouTube in January 2014. This PRE-DATES the 2020
  # Moonbug acquisition and is recorded as a FOUNDING fact, NOT an ownership claim
  # (Stevin John is not modeled as an owner). effective_from omitted: Wikipedia
  # dates the first episode to "January 2014" without a day (see notes).
  - subject: channel
    type: FOUNDED_BY
    object: stevin_john
    confidence: 0.9
    status: ACTIVE
  # 4: Stevin John is the original on-camera host of Blippi and remains publicly
  # associated with the channel as its creator/host. Recorded HOSTED_BY (an
  # on-camera/creative role), kept DISTINCT from ownership. NOTE (see notes):
  # since May 2021 the Blippi character has ALSO been portrayed on the channel by
  # Clayton Grimm; the multi-actor arrangement does not change ownership and John
  # remains the creator. This edge asserts no control over the channel.
  - subject: channel
    type: HOSTED_BY
    object: stevin_john
    confidence: 0.85
    status: ACTIVE

