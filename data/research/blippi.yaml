# CHANNELWATCH research record — Blippi (Blippi - Educational Videos for Kids)
#
# DRAFT FOR HUMAN REVIEW — nothing here is published without human verification
# (Spec §12.7). Multi-level PE-backed ownership chain with documented acquisition
# dates, PLUS the founding creator/host recorded DISTINCTLY from ownership:
#
#   channel (Blippi)
#     ├─ FOUNDED_BY ─────────── Stevin John                    (created show, Jan 2014)
#     ├─ HOSTED_BY ──────────── Stevin John                    (original on-camera host; ongoing)
#     └─ OWNS ───────────────── Moonbug Entertainment Ltd.     (acquired 2020-07-30)
#          └─ OWNS (control) ── Candle Media                   (acquired Moonbug 2021-11-04)
#               └─ PORTFOLIO_COMPANY_OF ── Blackstone          (principal backer, 2021)
#
# The Moonbug acquisition was announced in the SAME 2020-07-30 press release as
# CoComelon (title: "Moonbug Entertainment Acquires YouTube Sensations CoComelon
# and Blippi ..."). The moonbug / candle / blackstone entities (slugs,
# canonical_name, legal fields) and the shared Moonbug/Candle/Blackstone sources
# are kept IDENTICAL to data/research/cocomelon.yaml and little-baby-bum.yaml so
# all three records resolve to the same shared entities in the graph.
# Classification is COMPUTED by the importer, never asserted here.
#
# CRITICAL DISTINCTION (Spec §4, §40.2): Stevin John FOUNDED the show and is the
# original on-camera host, but he is NOT recorded as an OWNER — Moonbug acquired
# the property in 2020. Financial ownership and on-camera/creative role are
# described separately and neither is presented as evidence of the other.

