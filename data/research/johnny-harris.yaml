    EXPECTED CLASSIFICATION: CREATOR_OWNED. The channel's sole active owner is the
    individual creator Johnny Harris himself (rel 0, OWNS + CONTROLLING). There is
    NO operating company, NO external funding, and NO PE/corporate owner anywhere
    in the active chain, so the classifier's creator-owned rule fires directly.
    Confidence ~0.8 (the direct-ownership edge). Structurally identical to the
    safiya-nygaard record (creator owns the channel directly, with a former-
    employer edge that is ENDED history and does not affect the served label).

    CHANNEL ID: UCmGSJVG3mCRXVOP4yZrU1Dw, taken from the raw @johnnyharris page
    HTML "externalId" and cross-checked against YouTube's own RSS feed (yt:channelId
    + title + name all resolve to "Johnny Harris"). The feed's channel-level
    <published> is 2011-06-08 (account creation) — years before his post-Vox
    independent creator era; rels 0-1 anchor to that documented creation date, and
    a reviewer may prefer to anchor his creator-ownership era to his ~2020 post-Vox
    pivot instead. Either way there is no Vox-owner period to record.

    VOX = FORMER EMPLOYER, NOT OWNER (rel 3, EMPLOYS ENDED). Harris produced/hosted
    the "Borders" series for Vox (Wikipedia: "From 2017 to 2019 ... cancelled in
    2020"). His personal YouTube channel was never a Vox property — it is his own
    account (created 2011). The ONLY thing that ended at Vox was his EMPLOYMENT, so
    NO former-Vox-owner edge is placed on the channel (mirrors the safiya/BuzzFeed
    treatment). The Vox entity (slug vox_media_original) is reused VERBATIM from
    vox.yaml (canonical_name "Vox Media, Inc. (2011-2026 entity)") for shared-entity
    whole-graph recompute; his employer during his tenure was that original entity.

    DATE PRECISION / JUDGMENT CALLS (Vox employment):
    (1) START omitted — an interview-based source says "six years at Vox" (implying
    a ~2014 start) but the exact start is not firmly pinned to a strong source, so
    effective_from is OMITTED rather than asserted (same caution as vox.yaml).
    (2) END effective_to 2020-01-01 is a YEAR-LEVEL placeholder: Wikipedia dates
    Borders' cancellation to 2020 and the interview implies departure ~2020, but no
