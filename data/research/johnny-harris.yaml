    operating this YouTube channel, so only FOUNDED_BY edges attach it — it does
    NOT enter the channel's ownership chain and does NOT affect the CREATOR_OWNED
    label. Modeled deliberately this way to avoid conflating a separate business
    venture with channel ownership. effective_from 2019-01-01 is a year-level
    placeholder ("founded in 2019"; exact incorporation date not documented here).
    Public aggregators reference a Bright Trip, LLC (D.C., Nov 2019) and Bright
    Trip, Inc. (Delaware, Jan 2021); these entity-form details were NOT confirmed
    to a T1/T2 primary source in this pass and are left for a reviewer to verify.

    IZ HARRIS: modeled only as a Bright Trip co-founder (rel 5). She is Johnny's
    wife and a filmmaker with her own separate YouTube channel; NO ownership or
    host edge is asserted for her on THIS eponymous Johnny Harris channel, as none
    is documented (mirrors the Tyler/Safiya treatment).

    SOURCES: youtube_channel_feed (retyped DIRECT_CREATOR_CONFIRMATION -> Tier 3
