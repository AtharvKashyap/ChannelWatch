    suggested he left "~2021"; sources found here point to ~2020. FLAGGED as an
    open item — a reviewer should pin the exact departure date and adjust if a
    2021 date is confirmed. Confidence held low (0.6) to reflect this conflict.

    BRIGHT TRIP = SEPARATE COMPANY, NOT THE CHANNEL'S OWNER (rels 4-5). Johnny
    co-founded the travel-video course company Bright Trip in 2019 (EU Business
    School blog: "founded in 2019 ... officially launching Bright Trip in January
    2020") with his wife Iz Harris (brighttrip.com: "as co-founders of Bright
