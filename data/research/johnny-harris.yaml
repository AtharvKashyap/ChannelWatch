    canonical_name: Bright Trip, Inc.
    entity_type: COMPANY
    website: https://www.brighttrip.com
    aliases:
      - Bright Trip
  # Vox entity reused VERBATIM from vox.yaml (same slug and fields) so the records
  # share the entity in the whole-graph recompute. Harris's employer during his
  # ~2017-2020 tenure was the original 2011-founded Vox Media, Inc.
  - slug: vox_media_original
    canonical_name: Vox Media, Inc. (2011-2026 entity)
    entity_type: COMPANY
    legal_name: Vox Media, Inc.
    aliases:
      - Vox Media

relationships:
  # ============================ CURRENT (ACTIVE) ============================
  # 0: Johnny Harris owns the channel DIRECTLY (individual creator; no operating
  # company owns this channel — Bright Trip is a separate company, see notes).
  # control_level CONTROLLING; no percentage applies to a sole individual owner.
  # effective_from 2011-06-08 = documented account-creation date per YouTube's own
  # feed. His independent CREATOR career on it took off after he left Vox (~2020);
  # reviewer may prefer that later pivot date (flagged). This active OWNS-channel
  # edge is what yields CREATOR_OWNED.
  - subject: johnny_harris
    type: OWNS
    object: channel
    control_level: CONTROLLING
    effective_from: 2011-06-08
    confidence: 0.8
    status: ACTIVE
  # 1: the channel is Johnny's own creation. effective_from 2011-06-08 (feed
  # account-creation date).
  - subject: channel
    type: FOUNDED_BY
    object: johnny_harris
    effective_from: 2011-06-08
    confidence: 0.8
    status: ACTIVE
  # 2: Johnny is the channel's principal on-camera host (ongoing uploads).
  - subject: channel
    type: HOSTED_BY
    object: johnny_harris
    confidence: 0.95
    status: ACTIVE
  # ===================== Vox EMPLOYMENT (temporal, FORMER) =====================
  # 3: Johnny was a Vox video producer who produced/hosted the "Borders" series.
  # This is the ONLY thing that transitioned from Vox — NOT any channel/brand
  # ownership. Wikipedia firmly dates Borders to 2017-2019 (cancelled 2020); an
  # interview-based source says "six years at Vox" (implying a ~2014 start). Start
  # year not firmly pinned, so effective_from is OMITTED (flagged). effective_to
  # 2020-01-01 is a YEAR-LEVEL placeholder ("left ~2020", exact date/month not
  # documented; the commissioning brief suggested ~2021 — flagged for review).
  - subject: vox_media_original
    type: EMPLOYS
    object: johnny_harris
    effective_to: 2020-01-01
    confidence: 0.6
    status: ENDED
  # ===================== BRIGHT TRIP (separate company) =====================
  # 4: Johnny co-founded Bright Trip (a travel-video course company) in 2019.
  # This is a SEPARATE company and is NOT the channel's owner/operator — only a
  # FOUNDED_BY edge is placed, so it does not enter the channel's ownership chain.
  # effective_from 2019-01-01 (year-level; "founded in 2019", exact date not
  # documented — flagged; officially launched Jan 2020).
  - subject: bright_trip
    type: FOUNDED_BY
    object: johnny_harris
    effective_from: 2019-01-01
    confidence: 0.85
    status: ACTIVE
  # 5: Iz Harris (Johnny's wife) is a co-founder of Bright Trip. Same year-level
  # date caveat as rel 4.
  - subject: bright_trip
    type: FOUNDED_BY
    object: iz_harris
    effective_from: 2019-01-01
    confidence: 0.7
    status: ACTIVE

