  notes: >-
    DRAFT for human review — an individual-CREATOR-OWNED channel with a FORMER-
    EMPLOYER (Vox) backstory (no brand/ownership transition). reviewed_by is
    intentionally absent (not yet human-reviewed); last_reviewed_at holds the
