# only; reviewed_by is intentionally NOT present (not yet human-reviewed).
#
# Profile: an individual-CREATOR-OWNED channel with a FORMER-EMPLOYER (Vox)
# backstory — NOT a brand/ownership transition. Johnny Harris was a Vox video
# producer (produced/hosted the "Borders" series) who left around 2020 to work
# independently on his OWN eponymous YouTube channel. Vox is modeled as a FORMER
# EMPLOYER (EMPLOYS ... ENDED), NOT as an owner of the channel — the channel has
# always been his personal property. He separately CO-FOUNDED a travel-video
# company, Bright Trip (2019), with his wife Iz Harris; Bright Trip is a distinct
# company and does NOT own or operate this YouTube channel, so it carries only
# FOUNDED_BY edges and does not touch the channel's ownership chain.
#
#   channel (Johnny Harris)
#     └─ OWNS (ACTIVE) ─────────── Johnny Harris [individual creator]
#     └─ FOUNDED_BY / HOSTED_BY ── Johnny Harris
#   Johnny Harris ── EMPLOYS (ENDED ~2020, FORMER) ── Vox Media, Inc.
#   Bright Trip, Inc. ── FOUNDED_BY ── Johnny Harris + Iz Harris  [separate co.]
#
# Classification is COMPUTED by the importer from ACTIVE edges only. The only
# active owner of the channel is the individual creator, so this resolves to
# CREATOR_OWNED (same structural shape as safiya-nygaard). The Vox EMPLOYS edge
# is ENDED history and does not affect the served label; Bright Trip is not an
# ownership edge on the channel and does not affect it either.

