    "channelId":"UCz6XquIbM5OcfK7r3hQQCXA" also appears in the page source (a
    related/other channel in the page layout) and was NOT used. Reviewer should
    confirm against the live channel.

    CORE MODELING DECISION — THE YOUTUBE DEAL IS A PLATFORM CONTRACT, NOT
    OWNERSHIP. Ahgren's 2021 Twitch -> YouTube move was an EXCLUSIVE LIVESTREAMING
    CONTRACT with the YouTube Gaming platform (announced 2021-11-29; move
    2021-11-30; brokered by his management company Loaded), and he announced on
    2024-11-30 that this YouTube livestreaming contract had ENDED. No source
    describes it as an acquisition of, equity stake in, transfer of, or ownership
    of the "Ludwig" channel — it is a platform exclusivity agreement for his
    streaming. It is therefore recorded ONLY as note-only context here, NOT as an
    ownership edge and NOT even as a REPRESENTS/DISTRIBUTED_BY edge: unlike an MCN
    (cf. pewdiepie.yaml, where Maker Studios REPRESENTS the channel), the
    counterparty here is the hosting platform itself, so a distribution/represents
    edge would be trivially true of every YouTuber and misleading. The management
    intermediary IS captured (rel 7: Loaded MANAGES Ludwig). A reviewer who wants
    the platform contract as an explicit edge could add a YouTube/Google entity
    with a status-ENDED, non-ownership edge (effective_to 2024-11-30), but I judged
    note-only to be the more precise and legally-safe choice (docs/legal-risk.md:
    describe structure, do not overclaim).

    OWNERSHIP — the core finding. "Ludwig" is Ahgren's eponymous PERSONAL channel;
    he is its sole on-camera creator and founder and no source documents any sale
    or transfer. He is therefore encoded as CREATOR OWNS channel / CONTROLLING
    (rel 1), the only ACTIVE channel-owning edge. confidence is moderate (0.70):
    ownership rests on the eponymous/sole-creator identity plus the documented
    absence of any transfer, not on a direct ownership disclosure — flagged as the
    reviewer's primary focus. No ownership percentage is asserted (none disclosed).

    CORPORATE ENTITIES (documented context, none of which own THIS channel):
    (1) MOGUL MOVES — Ahgren's entertainment company / brand (rel 3: Ludwig OWNS,
    CONTROLLING); Nick Allen is President & COO (rel 4: MANAGES / MANAGEMENT).
    Some secondary coverage (e.g. press.farm) describes Mogul Moves as the umbrella
    that "includes his streaming deal, The Yard podcast, clothing, and bidets,"
    which could mean Mogul Moves is the operating entity behind the channel;
    however NO fetched source states in a verbatim "Mogul Moves owns the Ludwig
    channel" form, so Mogul Moves is NOT modeled as the channel owner (precision
    over recall). If a reviewer confirms Mogul Moves is the channel's operating
    entity, the ownership chain would still be CREATOR-controlled (Ludwig owns
    Mogul Moves) and the CREATOR_OWNED outcome would not change. No legal_name /
    jurisdiction / registry record for Mogul Moves was documented, so none is
    asserted.
    (2) OFFBRAND — a creative studio Ludwig co-founded on 2022-09-27 (rel 5), one
    of four founders (Ludwig, Nick Allen [rel 6], Nathan Stanz, Brandon 'Atrioc'
    Ewing). Modeled as FOUNDED_BY (a founding fact) rather than PARTIALLY_OWNS: with
    four founders and no disclosed equity split, an ownership-stake edge would
    overclaim. Per Wikipedia the events business was wound down and the company was
