  notes: >
    DRAFT — UNVERIFIED, requires two-person human review (Spec §20.3: PE
    involvement + named individuals). Do not publish without verification.

    CHANNEL ID. UCbCmjCuTUZos6Inko4u57UQ, extracted from the "externalId" field
    in ytInitialData in the raw HTML of https://www.youtube.com/@CoComelon (curl
    fetch, no JS). The canonical /channel/UC... URL in the same page source
    resolves to the identical id, and it matches the long-publicly-known
    CoComelon channel id.

    CHAIN & CONFIDENCE.
    (0) Moonbug OWNS CoComelon: HIGH. Announced 2020-07-30 in Moonbug's own PR
    Newswire release (T1) which names CoComelon explicitly, corroborated by
    Kidscreen (T2, same date) and by Blackstone's 2021 acquisition PR (T1) which
    lists CoComelon among Moonbug's shows. effective_from recorded at day
    precision (2020-07-30, announcement date). ownership_percentage set to 100
    as an INFERENCE — sources describe an outright acquisition ("has acquired")
    of the brand/channel, not a partial/minority stake; reviewer to confirm
    whether the underlying deal was a full IP/brand acquisition (the PRs do not
    state a percentage). If in doubt, drop ownership_percentage and keep only
    control_level CONTROLLING.
    (1) Candle Media OWNS Moonbug: HIGH/CONFIRMED. 2021-11-04 official Blackstone
    announcement (T1) + THR (T2); deal reported ~$3B and has closed. This is the
    SAME hop recorded in little-baby-bum.yaml and uses the same sources.
    (2) Candle Media PORTFOLIO_COMPANY_OF Blackstone: MODERATE. Two Blackstone T1
    PRs describe Candle as "backed by investment capital from Blackstone"; THR
    calls it "Blackstone-backed." No source states a percentage or a controlling
    stake, so control_level and ownership_percentage are UNKNOWN. Same hop and
    same caveats as little-baby-bum.yaml.

    SHARED-ENTITY REUSE. The moonbug, candle and blackstone entities (slug,
    canonical_name, legal_name, jurisdiction, website, aliases) are copied
    verbatim from data/research/little-baby-bum.yaml so both records resolve to
    the same graph nodes. The blackstone_moonbug_pr, blackstone_westbrook_pr and
    thr_candle_moonbug sources are also reused verbatim (same URLs, tiers,
    archive URLs, excerpts).

    BLACKSTONE ENTITY-TYPE NUANCE (reviewer decision, carried from LBB record).
    Blackstone Inc. is a diversified alternative asset manager, NOT solely a PE
    firm. Classified PRIVATE_EQUITY_FIRM because (a) the founding Candle
    investment was led by Blackstone's Global Head of Private Equity (Joe
    Baratta, per the Westbrook PR) and (b) Blackstone is Candle's principal
    equity backer. The actual investing VEHICLE (a specific Blackstone-managed
    fund) is not named in the sources; if identified, model it as a FUND that
    Blackstone MANAGES holding the Candle stake. Keep consistent with the LBB
    record's reviewer decision.

    PE-LABEL RULE (§14.3). The PE-implying edge (rel 2, endpoint is a
    PRIVATE_EQUITY_FIRM) is backed by a Tier 1 source (blackstone_moonbug_pr),
    satisfying the "one Tier 1, or two independent Tier 2" requirement.

    DATE PRECISION. Moonbug->CoComelon: 2020-07-30 (announcement date, day
    precision). Candle->Moonbug: 2021-11-04 (announcement date). Candle
    backed by Blackstone: 2021, year only — effective_from omitted.

    ENTITY GAPS (carried from LBB). Candle Media legal name and jurisdiction of
