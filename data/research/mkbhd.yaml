    (2) OWNERSHIP EDGE (rel 1) is the reviewer's primary focus. It is recorded
    OWNS + CONTROLLING with NO percentage. This is partly an inference from
    DOCUMENTED ABSENCE — every source presents MKBHD as Brownlee's own channel
    and business, and none reports any external owner/investor/acquirer — rather
    than from an explicit ownership statement or corporate filing. Confidence set
    to 0.7 to reflect that. No percentage was guessed. If the reviewer requires a
    positive primary source of ownership (e.g. a US business filing / registered
    entity for his operation), that is a Tier 1 corroboration lead.
    (3) PRODUCTION COMPANY / LEGAL ENTITY: Brownlee runs a multi-staff studio in
    Kearny, NJ, but NO reliably-sourced legal entity name was found. Low-quality
    / SEO sources variously call it "MKBHD," "MKBHD Studios," "MKBHD Inc."
