    Tier 3/4 and mutually inconsistent, so NO company entity or company-ownership
    edge is modeled here. If a reviewer confirms a formal operating company (name,
    jurisdiction, founding date) via a primary source, the model should be
    updated to a creator-controlled-company shape (creator PARTIALLY_OWNS/OWNS
    the company; company OWNS the channel), which would still compute
    CREATOR_OWNED.
    (4) NO EXTERNAL INVESTMENT / ACQUISITION of the channel found. Brownlee's
    documented outside equity dealings are OUTBOUND: in Feb 2024 he took an
    undisclosed stake in and a board seat / "chief creative partner" role at
    accessories company Ridge (Fortune, rel-1/2 source); he has also been
    reported as an investor in Opal Camera. These are him investing in OTHER
    companies, NOT anyone acquiring or investing in his channel, so they create
    no inbound ownership edge. Neutral-language note: the record asserts only his
    own channel ownership/hosting; no conclusion about editorial control is drawn.
    (5) SOURCES: both are Tier 2 (ESTABLISHED_INDUSTRY_PUBLICATION: Wikipedia and
    Fortune via Yahoo Finance). No Tier 1 primary source (business registry
    filing, or a direct on-the-record ownership statement) was captured — a lead
