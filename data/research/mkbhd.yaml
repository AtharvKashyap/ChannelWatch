    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) FOUNDING DATE: rel 0 effective_from 2008-03-21 is the YouTube
    account-creation date per Wikipedia (which cites the channel's own "About"
    page). Regular uploads did not begin until January 2009; a reviewer may
