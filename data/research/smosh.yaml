review:
  researched_by: claude-research-agent-m1
  notes: >
    DRAFT for human review; reviewed_by intentionally unset (null / pending
    review). Judgment calls: (1) Corporate entity — reputable press refers only
    to the "Smosh" brand; wiki-tier sources cite "Smosh Productions Inc." /
    "Smosh, LLC". No T1/T2 source documents an exact post-buyback legal entity,
    so none is asserted; "Smosh Enterprises" from the brief could NOT be
    verified and was rejected. Owners modeled as the two founders directly.
    (2) The two founders hold a JOINT majority; the individual ownership split
    between Padilla and Hecox is undocumented — each OWNS edge is marked
    CONTROLLING to reflect joint control, ownership_percentage omitted.
    (3) Mythical minority stake exact percentage undisclosed. (4) Founding year
    disputed across sources: Forbes (Pequeno) says "2006"; most other accounts
    say 2005 — effective_from omitted on FOUNDED_BY edges rather than assert a
    contested date. (5) Defy era effective_from set to 2011 (2011 Alloy Digital
    sale, later renamed Defy Media) per Forbes; effective_to 2018-11 (Defy
    shutdown, Nov 2018). Mythical acquisition dated 2019-02-22 (announcement).
    All backing sources are Tier 1–2; no Tier 4 used. Deal terms (price) for the
    2023 buyback were not disclosed publicly.
  last_reviewed_at: 2026-07-22
