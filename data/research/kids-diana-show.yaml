  notes: >-
    DRAFT for human review — "creator/family-owned channel with an external
    MEDIA-COMPANY management/representation relationship (NOT ownership)" case;
    the direct parallel to ryans-world.yaml. Requires human verification before
    publication.

    CHANNEL ID. UCk8GzjMOrta8yxDcKfylJYw, taken from the "externalId" field in
    the raw HTML of https://www.youtube.com/@KidsDianaShow (curl, no JS
    execution). Reviewer should confirm against the live channel.

    OWNERSHIP vs REPRESENTATION — the core finding. Ownership/control of the
    channel sits with the Kidisyuk family: parents Olena and Volodymyr launched
    it in 2015 and run it (family-owned and operated), with Diana as the
    on-screen star. pocket.watch (PocketWatch, Inc.) is a MEDIA COMPANY that
    REPRESENTS the brand — it partnered with the family in May 2020 to build the
    "Love, Diana" franchise (animation, gaming/OTT, and a licensed consumer-
    products line), i.e. licensing/merchandising/franchise management. NO fetched
    source states pocket.watch owns the channel or the brand; the announcement
    frames the parents as JOINING pocket.watch as a partner. Recorded as REPRESENTS
    + control_level MANAGEMENT accordingly. Reviewer: do NOT let the depth of the
    pocket.watch franchise partnership be read as ownership.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) rel 0 (channel FOUNDED_BY diana). Evidence credits the PARENTS with
    launching the channel in 2015 (Diana was ~1). FOUNDED_BY diana is used to
    mirror the Ryan's World model (channel identity built around the child
    creator) with the parents' operating role captured in rels 1-2; a reviewer
    may prefer FOUNDED_BY olena (whom Wikipedia names as launching it) or a family
    edge. Day-precision date not established, so effective_from is omitted rather
    than guessed. Diana is a minor; only publicly self-disclosed brand facts are
    recorded (name Eva Diana Kidisyuk; born 2014, Kyiv). No residential/private
    data included (family is publicly reported to reside in Dubai — deliberately
    OMITTED as unrelated to ownership; Spec §22.4 / evidence-policy §5).
    (2) rels 1-2 (Olena / Volodymyr OPERATE channel, CONTROLLING, conf 0.7).
    Sources establish the family launched and runs the channel but do NOT state a
    verbatim legal ownership instrument. OPERATES + CONTROLLING is the honest
    structural reading (the family controls the channel directly); a reviewer may
    prefer OWNS/CONTROLS or a single combined family edge if a clearer ownership
    statement is located. Unlike Ryan's World (which routes control through the
    family production company Sunlight Entertainment), NO named production/holding
    company for the Kidisyuk family was located in the fetched sources — if one
    exists, add it and re-route the OPERATES edges through it.
    (3) rel 3 (pocket.watch REPRESENTS channel, MANAGEMENT). effective_from set to
    2020-05-19, the announcement date of the "Love, Diana" partnership (PR
    Newswire; corroborated by Wikipedia's "May 2020"). The exact contractual
    terms are not public and are NOT asserted here (creator-safety / Spec §22.4:
    no confidential contracts). Same pocket.watch legal entity as ryans-world.yaml
    (slug/canonical_name/website reused verbatim).
    (4) SOURCE NOTES. Wikipedia (T2, ESTABLISHED_INDUSTRY_PUBLICATION) is the
    primary support for rels 0-3. The 2020 pocket.watch announcement (PR Newswire)
    is the companies' own statement; there is no "press release" source_type in
    the enum, so it is mapped to ARCHIVED_CORPORATE_PAGE (Tier 3) and used only
    for the partnership's nature/date and the firms' self-descriptions. An
    archive_url should be captured at review. Variety's 2020 report
    (variety.com/2020/digital/news/kids-diana-show-pocketwatch-love-diana-show-1234608487)
    was paywalled to the fetcher (HTTP 402) and is NOT recorded — add as a T2
    corroborating source if independently verified.
    (5) NO PE INVOLVEMENT in this record. No PRIVATE_EQUITY_FIRM entity and no
    PORTFOLIO_COMPANY_OF edge — the §14.3 PE-label gate does not apply.
    pocket.watch's own external backing (e.g. Viacom's 2018 investment, recorded
    in ryans-world.yaml) attaches to pocket.watch, the representative, and is
    intentionally NOT included here: it is out of scope for Diana's ownership
    graph and does not establish any investor ownership of the channel.
    (6) EXPECTED COMPUTED CLASSIFICATION: CREATOR_OWNED / creator- (family-)
    controlled — the channel is owned and operated by the Kidisyuk family, with
    pocket.watch as a management/representation partner, not an owner. Classification
    is COMPUTED by the importer; confirm the computed label at import.
