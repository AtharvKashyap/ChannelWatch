# CHANNELWATCH research record — fern
#
# Pilot record for the "opaque / production-team-operated" case. Real record
# (not a fixture). DRAFT FOR HUMAN REVIEW — nothing here is published without
# human verification (Spec §12.7). Two-person review required (Spec §20.3):
# this record touches private-equity involvement and named individuals, and the
# fern <-> Electrify characterization is publicly contested.
#
# Summary of what IS documented (see review.notes for the many caveats):
#   - fern is the international/English "armchair documentary" channel MADE BY
#     the German channel Simplicissimus (founders "Jonas" & "David", identities
#     not public) together with Dutch video essayist Hoog; launched 2020.
#   - The channel is operated with the support of 1UP Management GmbH (Cologne,
#     Germany), Simplicissimus's artist management.
#   - In early 2025 Electrify Video Partners (London) took a stake in
#     Simplicissimus. Characterization is DISPUTED: Electrify/creators call it a
#     "strategic partnership" with continued editorial independence; the Media
#     Ownership Monitor calls it an acquired majority stake (50-80%). Electrify
#     is itself backed by private-equity fund Capital D.
# The specific registered legal entity that owns the fern CHANNEL is NOT named in
# any public source found — ownership of the channel itself remains UNCLEAR.
# Classification is COMPUTED by the importer, never asserted here.

