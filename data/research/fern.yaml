review:
  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-23
  # reviewed_by intentionally omitted — not yet human-reviewed (schema rejects an
  # explicit null; absence signals "unreviewed").
  last_reviewed_at: 2026-07-23
  notes: >
    DRAFT — requires TWO-PERSON human review (Spec §20.3: private-equity
    involvement + named individuals + a publicly contested characterization).

    CHANNEL ID. UCODHrzPMGbNv67e84WDZhQQ, extracted from the "externalId" field
    in the page source of https://www.youtube.com/@fern-tv (display_name "fern",
    the documentary/video-essay channel, ~3.9M subscribers). Distinct from
    @fern (UCHyzc2Pp_fC5hfTLebF1ZiQ) and @fernvideos (UCiIhvrUqRGkevFC5grBr54g),
    which are unrelated channels.

    OWNERSHIP OF THE CHANNEL ITSELF IS UNCLEAR. No public source found names the
    registered legal entity that owns the fern channel. What is documented is a
    production/management arrangement (Simplicissimus + Hoog make it; 1UP
    Management supports operations) and a corporate stake taken in the
    Simplicissimus operation. A reviewer should treat the channel's legal owner
    as UNKNOWN. OWNERSHIP_UNCLEAR is an honest expected outcome here.

    (0/1) FOUNDING. fern launched 2020 as Simplicissimus's international,
    English-language "armchair documentary" project in collaboration with Dutch
    essayist Hoog (MOM, Tier 2; corroborated by the channel's own About and the
    1UP press release). 1UP's press release publicly announcing fern is dated
    2023-07-09, but MOM and the channel history place the launch in 2020 — the
    channel externalId page and third-party wikis cite 2020-09-24, but that date
    was NOT confirmed by a Tier 1/2 source, so effective_from is omitted
    (year-precision only; DB rejects partial dates).

    (2/3) OPERATION. Simplicissimus is credited on fern's own channel
    description ("Made by @Simplicissimus. Occasional voice-overs by
    @hoog-youtube") — a Tier 1 first-party statement. 1UP Management GmbH
    (Cologne; HRB 121333, Amtsgericht Koeln; Geschaeftsfuehrer John-Dustin
    Martin) is Simplicissimus's artist management and the fern channel is
    operated "mit Unterstuetzung von 1UP Management." NOTE: 1UP is a talent/
    artist-management agency (it also manages other creators, e.g. Gronkh); it is
    NOT the same thing as "the operating company of Simplicissimus" referenced by
    MOM as the entity Electrify invested in. Do not conflate them — the specific
    Simplicissimus operating company is not named in accessible sources (MOM
    cites UK Companies House director records without naming a German GmbH). The
    1UP press release is a live first-party corporate page; mapped to the nearest
    schema source_type (ARCHIVED_CORPORATE_PAGE, Tier 3) and archived to Wayback
    on 2026-07-22 so the excerpt is citable. Reviewer may prefer to downgrade or
    reword the 1UP MANAGES edge.

    (4) ELECTRIFY STAKE — DISPUTED, recorded at low confidence (0.5) with status
    DISPUTED, NOT ACTIVE. This is the crux. Electrify's own announcement
    (2025-01-17, Tier 1) and Dexerto (Tier 2) call it a "strategic partnership,"
    and co-founder Jonas publicly asserts the channel remains "editorially
    independent" (fern responded to a viral GEN exposé alleging private-equity
    capture). The Media Ownership Monitor (Tier 2), by contrast, states Electrify
    "acquired a majority stake in Simplicissimus" of "50-80%." These accounts
    conflict on whether control changed hands, hence DISPUTED. The edge targets
    the Simplicissimus BRAND/operation; NO source establishes that it conveys
    legal ownership of the fern CHANNEL specifically. effective_from omitted
    ("beginning of 2025"; announcement 2025-01-17 is the announcement date, not a
    confirmed close date). A reviewer must decide subject/object modeling,
    OWNS vs. PARTIALLY_OWNS/INVESTED_IN, control level, and whether to publish at
    all given the dispute.

    (5) ELECTRIFY <- CAPITAL D. Electrify Video Partners (London, co-founded May
    2021 by Ian Shepherd, Owen Maher, Justin Reizes) raised $85M from Capital D
    in Sept 2023, described by both Tubefilter and Tech.eu (two independent Tier
    2 publishers) as a "private equity fund"/"private equity firm" — satisfying
    the §14.3 PE-label evidence rule for this PE-implying edge. Electrify also
    raised ~$50M led by MEP Capital (Feb 2023). MOM additionally names Jean Marc
    Jabre of Capital D and lists other backers (Equable Capital).

    ENTITY-TYPE TRADEOFF (reviewer decision). Electrify is modeled as
    INVESTMENT_FIRM, not PRIVATE_EQUITY_FIRM: it self-describes as a "media
    company"/"media startup" that invests in and acquires YouTube channels, and
    the actual PE capital sits one level up (Capital D). This keeps the
    Electrify->Simplicissimus edge from mechanically forcing a PE label while the
    genuine PE signal is carried by the well-evidenced Electrify->Capital D edge.
    A reviewer who judges Electrify itself to be a PE roll-up vehicle (MOM calls
    it a "private equity firm") may reclassify it PRIVATE_EQUITY_FIRM — which
    would strengthen a PE_BACKED computation. The BRAND type on "Simplicissimus"
    is a placeholder for an unnamed operating company; reconsider if the legal
    entity is later identified (then model it as COMPANY with a jurisdiction).

    IDENTITIES. The Simplicissimus founders are publicly known only as "Jonas"
    and "David" (based in Amsterdam); real names not public, so no PERSON
    entities were created (undocumented = omitted). Hoog is a Dutch creator whose
    real name is likewise not asserted here. MOM names content-leadership
    individuals (Creative Director Paul Luehnsdorf, Executive Producer Christian
    Kiesling) and Electrify/Capital D principals — not modeled as entities absent
    a documented ownership/control relationship.

    SOURCES NOT USED. The GEN ("GEN" investigative) YouTube video that triggered
    the controversy, and a Prezi/Fandom/SigmaStory secondary summaries, are Tier
    4 leads only and are not cited to support any relationship. simpli.de/ueber-uns
    (Simplicissimus's own imprint) was Cloudflare-blocked and could not be read;
    it is a follow-up lead for confirming the Simplicissimus operating entity.
