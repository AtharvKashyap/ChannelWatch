    shape. No PRIVATE_EQUITY_FIRM / PORTFOLIO_COMPANY_OF edge exists, so the
    §14.3 PE-label evidence rule is not engaged.

    CHANNEL ID: UCp68_FLety0O-n9QU6phsgw, extracted from the sole "externalId"
    field in the raw HTML of https://www.youtube.com/@colinfurze (curl fetch, no
    JS). canonicalBaseUrl "/@colinfurze" (180 occurrences) and vanityChannelUrl
    "http://www.youtube.com/@colinfurze" confirm the id belongs to this handle.
    A single unrelated "/channel/UCQ4z6vG6qy2Tr1W090bMuww" also appears once in
    the source (a featured/related channel) and is NOT this channel.

    OPERATING COMPANY (Tier 1, primary): FUZ PRODUCTIONS LTD, Companies House no.
    12529243, incorporated 20 March 2020, Active, SIC 90010 "Performing arts",
    formerly LONSDALE GENIUS LTD until 28 June 2021. This is Furze's eponymous
    ("FUZ") UK production company. Colin Peter Furze is a director and the
    majority PSC (>50% but <75% shares AND voting rights, plus right to appoint/
    remove directors), notified at incorporation. Strong, primary, Tier 1
    corporate-registry evidence of a creator-controlled company.

    EXTERNAL-INVESTMENT / ACQUISITION CHECK (per task): NO external corporate
    acquisition, private-equity backing, or outside equity investment in the
    channel was found. He does not appear on tracked PE-ownership lists (e.g.
    Electrify Video Partners, Spotter, Jellysmack roll-ups). Recorded as a
    documented ABSENCE, not as an affirmative "verified independent" claim.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) OWNER EDGE (rel 1, furze OWNS channel, CONTROLLING, no %): partly an
    inference — Furze is the sole documented public creator/principal, and he
    majority-controls his eponymous production company. No explicit "owns X% of
    the channel" statement or asset schedule was located, so no percentage is
    asserted and confidence is held at 0.7. Retained as the load-bearing
    creator-ownership edge alongside the company structure (mirrors mkbhd/nilered
    modelling).
    (2) COMPANY-TO-CHANNEL LINK (rel 3, fuz_productions OPERATES channel): the
    inference is that FUZ PRODUCTIONS LTD is the operating vehicle for the
    channel's business (eponymous production company, "Performing arts" SIC,
    registered at his correspondence address). No source EXPLICITLY states the
    company holds the YouTube channel as an asset, so OPERATES/MANAGEMENT at
    moderate confidence (0.6) rather than OWNS. Reviewer to confirm the company
    is the channel's operating entity (vs the store/merch line or other Lonsdale-
    branded companies) — e.g. via ToS/business filings or a creator statement.
    (3) NO EXACT PERCENTAGES. Both PSC edges (rel 4, rel 5) use the Companies
    House disclosure BANDS (>50%-<75% for Furze; >25%-<=50% for Stapling). The
    register does not publish precise figures, so ownership_percentage is omitted
    on both; control_level (CONTROLLING / MINORITY) carries the meaning.
    (4) SECOND PSC — CREATOR-SAFETY / PRIVACY FLAG. Charlotte Alice Stapling
    (rel 5) is recorded as a MINORITY PSC of the operating company strictly from
    the public Companies House PSC register (Tier 1, ownership-relevant). She is
    a private individual with NO other public connection to the channel found;
    NO relationship to the creator is asserted or implied here. Only her name and
    the register-disclosed control band are recorded — no date of birth beyond
    the register's month/year, no address. Her minority stake does NOT change the
    classification (Furze remains majority-controlling). Reviewer to decide
    whether surfacing a private minority co-owner meets the transparency-vs-
    privacy balance, or whether this edge should be held back.
    (5) RECENT SHAREHOLDING CHANGE. Stapling's PSC was notified 5 May 2026 (vs
    Furze's 20 March 2020), indicating a share/PSC change in the OPERATING
    COMPANY during 2026. This is a change in the company's shareholding, NOT a
    change in who controls the channel (Furze remains the majority PSC), so no
    superseded/ENDED ownership edge on the channel is recorded. A reviewer may
    note this as OWNERSHIP_CHANGED_RECENTLY context at the company level only.
    (6) ADDRESS EXCLUDED. The company's registered office / Furze's correspondence
    address (a Stamford street address on the public register) is deliberately NOT
    recorded per creator-safety exclusions (evidence-policy §5); only GB / Stamford
    jurisdiction is kept.
    (7) FOUNDING DATE. rel 0 effective_from 2006-11-15 is the channel's own
    "Joined Nov 15, 2006" About-page metadata (Tier 1, direct). Wikipedia dates
    the first upload to 2007; a reviewer may prefer to characterise 2007 as the
    effective start of channel activity.
    (8) SOURCES. Four Tier 1 primaries (YouTube channel/About page; three
    Companies House records: overview, PSC, appointments) plus one Tier 2
