  notes: >-
    DRAFT for human review — "creator/family-owned kids channel with external
    MEDIA/AGENCY management & licensing relationships (NOT ownership)" case; the
    direct parallel to ryans-world.yaml and kids-diana-show.yaml. Requires human
    verification before publication. reviewed_by intentionally OMITTED (schema
    field is optional, not nullable) — this is an unverified draft.

    CHANNEL ID. UCJplp5SjeGSdVdwsfb9Q7lQ, taken from the "externalId" field in
    the raw HTML of https://www.youtube.com/@LikeNastyaofficial (curl, no JS
    execution). It appears 187 times, matches the page's <link rel="canonical">
    /channel/ URL, and the og:title is "Like Nastya". The bare handle
    @LikeNastya returns 404 — the official handle is @LikeNastyaofficial.
    Reviewer should confirm against the live channel.

    OWNERSHIP vs REPRESENTATION — the core finding. Ownership/control of the
    channel sits with the Radzinskaya family: Anastasia's parents (Anna and
    Yuri) launched it in January 2016 and produce/run it (mother films
    off-camera; father co-stars), reporting ~20 dedicated employees. Two external
    partners are documented, and BOTH are representation, NOT ownership:
    (a) YOOLA — a multi-channel network (MCN) that "provides 360-degree talent
    management services" to the family (CEO Eyal Baumel); the family "signed in
    2017". Recorded REPRESENTS + control_level MANAGEMENT.
    (b) IMG — engaged 2020 as "Anastasia's first licensing representative" for
    consumer products. Recorded REPRESENTS + control_level LICENSE.
    NO fetched source states that Yoola or IMG owns the channel or the brand.
    Reviewer: do NOT let the depth of the Yoola management relationship or the
    IMG licensing deal be read as ownership.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) rel 0 (channel FOUNDED_BY anastasia). Evidence credits the PARENTS with
    creating the channel in January 2016 (Anastasia was ~2). FOUNDED_BY anastasia
    mirrors the Ryan's World / Kids Diana Show model (identity built around the
    child creator) with the parents' operating role in rels 1-2; a reviewer may
    prefer a parent or family founding edge. Day-precision date not established
    (month = January 2016), so effective_from is omitted rather than guessed.
    (2) FATHER'S NAME DISCREPANCY — unresolved, flagged. Tubefilter and Variety
    (Tier 2, quoting the family) name the father "Yuri"; the Wikipedia article
    names him "Sergey". Recorded canonical_name "Yuri Radzinskaya" with "Sergey"
    kept as an alias. Reviewer to resolve against a primary source. (Mother "Anna"
    is consistent across sources.)
    (3) rels 1-2 (Anna / Yuri OPERATE channel, CONTROLLING, conf 0.7). Sources
    establish the family launched and runs the channel but do NOT state a
    verbatim legal ownership instrument, and NO named family production/holding
    company was located in the fetched sources (unlike Ryan's World, which routes
    control through Sunlight Entertainment). If such a company exists, add it and
    re-route the OPERATES edges through it. OPERATES + CONTROLLING is the honest
    structural reading of direct family control.
    (4) rel 3 (Yoola REPRESENTS, MANAGEMENT). Signing dated "2017" (year only,
    Tubefilter/Variety) — effective_from omitted rather than guessing a month.
    Yoola is described as an L.A.-based MCN (also reported as Israeli-founded);
    jurisdiction NOT firmly established from fetched sources, so omitted. Exact
    contractual terms are not public and are NOT asserted (creator-safety /
    Spec §22.4: no confidential contracts). Yoola Ventures (product development)
    noted but not modeled as a separate edge.
    (5) rel 4 (IMG REPRESENTS, LICENSE). effective_from = 2020-05-06, the Variety
    announcement date (operative date not separately documented; see the
    Ryan's/Diana convention of recording the announcement on source.published_at).
    control_level LICENSE reflects "first licensing representative" for consumer
    products. IMG's own corporate parentage (WME/Endeavor) is OUT OF SCOPE and
    intentionally not modeled — it attaches to IMG, the representative, and does
    not establish any ownership of the channel.
    (6) CHILD-SAFETY / PRIVACY (Spec §22.4, evidence-policy §5). Anastasia is a
    minor. Only publicly self-disclosed, ownership-relevant brand facts are
    recorded (name/aliases; parents' operating roles; the family previously owned
    a bridal salon and a construction company, sold 2015 to start the channel).
    DELIBERATELY OMITTED as unrelated to ownership transparency: the family's
    reported relocation/residence (Miami), the widely-reported health/diagnosis
    detail, and any minor's private data.
    (7) NO PE INVOLVEMENT. No PRIVATE_EQUITY_FIRM entity and no
    PORTFOLIO_COMPANY_OF edge — the §14.3 PE-label gate does not apply.
    EXPECTED COMPUTED CLASSIFICATION: CREATOR_OWNED / creator- (family-)
    controlled — the channel is owned and operated by the Radzinskaya family,
    with Yoola (management) and IMG (licensing) as representation partners, not
    owners. Classification is COMPUTED by the importer; confirm the label at
    import.
