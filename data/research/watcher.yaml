# CHANNELWATCH research record — Watcher (Watcher Entertainment)
#
# DRAFT for human review. Nothing here is published without verification.
# reviewed_by is intentionally UNSET (not yet reviewed).
#
# Profile: a creator-CONTROLLED channel with a strong TEMPORAL/brand-transition
# story that PARALLELS The Try Guys (see try-guys.yaml) but differs in two
# material ways. Steven Lim, Ryan Bergara and Shane Madej met as BuzzFeed
# employees — Bergara & Madej co-hosted "BuzzFeed Unsolved", Lim created/co-hosted
# "Worth It". In 2019 they quit BuzzFeed as full-time staff and founded the
# independent LA studio Watcher Entertainment, launching the "Watcher" YouTube
# channel in January 2020 to gain ownership/creative control of their own IP.
#
# TWO DIFFERENCES FROM THE TRY GUYS MODEL (both evidence-driven):
#   (1) NO BRAND TRANSFER. The prior shows (Unsolved, Worth It) STAYED WITH
#       BuzzFeed — BuzzFeed retained that IP and the trio kept working on them
#       under contract into ~2021. Nothing transferred FROM BuzzFeed TO Watcher.
#       So BuzzFeed's ownership of those show-brands is modeled as STILL ACTIVE
#       (not an ENDED->ACTIVE handover), and the "Watcher" brand/channel is new.
#   (2) NOT SOLE-OWNED. Watcher Entertainment is documented as "majority-owned by
#       the trio", with outside INVESTORS (Neuro, Boba Guys, and YouTube co-founder
#       Steve Chen). So the joint-SOLE-owner convention (which requires documented
#       SOLE ownership, e.g. try-guys) does NOT strictly apply. The trio's joint
#       CONTROL is documented (majority), so each founder is encoded PARTIALLY_OWNS
#       + CONTROLLING (this is what makes the company creator-controlled), and the
#       outside backers are modeled as INVESTED_IN + MINORITY (investment, NOT
#       controlling ownership; none is a PE/VC firm) — enriching the graph without
#       changing the served label.
#
# TEMPORAL MODELING CAUTION (per task): this channel (UCircJf-FlToBNjuy9xG-i5A)
# was NEVER BuzzFeed-owned. It was created ~Apr 2019 and publicly launched Jan
# 2020 as an independent property. What transitioned from BuzzFeed was (a) the
# three creators' EMPLOYMENT (ENDED 2019) — NOT (b) any channel ownership and NOT
# (c) any show-brand ownership (BuzzFeed kept Unsolved/Worth It). The BuzzFeed era
# is therefore modeled on ENDED EMPLOYS edges plus BuzzFeed's still-ACTIVE
# ownership of the prior show-brands — never as a former owner of THIS channel.
# The channel's only ever owner is Watcher Entertainment (-> CREATOR_OWNED).

