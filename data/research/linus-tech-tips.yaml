review:
  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-23
  # reviewed_by omitted: not yet reviewed (schema field is optional, not nullable).
  notes: >-
    DRAFT for human review — "creator-owned via founder-controlled company" case.
    Computed classification is expected to be CREATOR_OWNED (creator-controlled
    company: the direct channel owner LMG is a COMPANY, but LMG is controllingly
    owned by CREATOR/PERSON founders Sebastian and Ho — rels 3/4 trigger the
    CREATOR_CONTROLLED_COMPANY path in @channelwatch/graph). No PE or corporate
    owner in the chain; no PE-label evidence rule engaged.

    CHANNEL ID: UCXuqSBlHAE6Xw-yeJA0Tunw, extracted from the sole "externalId"
    field in the raw HTML of https://www.youtube.com/@LinusTechTips (curl fetch,
    no JS). Matches the long-publicly-known LTT channel id.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) LMG->channel (rel 1) effective_from 2012-10-01 is APPROXIMATE — it is
    LMG's incorporation month. The channel was created by Sebastian personally
    on 2008-11-24 (rel 0), four years before the company existed; the exact date
    the channel became a company-held asset is not documented in the sources
    found. A reviewer may prefer to drop the effective_from or add a note.
    (2) linus/yvonne PARTIALLY_OWNS lmg (rels 3/4): both marked control_level
    CONTROLLING and ownership_percentage OMITTED. Sources state the two are the
    "sole shareholders and directors" (TechSpot) / "remain the owners"
    (Wikipedia) — i.e. jointly 100% and jointly controlling. The individual
    Sebastian/Ho equity split is NOT publicly disclosed; CONTROLLING here encodes
    their joint controlling status, not a documented individual majority. This is
    the load-bearing pair for the classification and should be the reviewer's
    primary focus. No percentage was guessed.
    (3) LEADERSHIP vs OWNERSHIP: Sebastian stepped down as CEO on 2023-07-01,
    replaced by Terren Tong (rels 7 ENDED / 8 ACTIVE, both MANAGEMENT). This is
    explicitly a management change only — Sebastian retained ownership per both
    sources. It is modeled as a superseded MANAGES edge (effective_to) plus a new
    MANAGES edge (effective_from), NOT as an ownership change, and does not affect
    the ownership classification.
    (4) NO EXTERNAL INVESTMENT / ACQUISITION found. Both sources report a ~$100M
    buyout offer (60% cash / 40% equity) in 2023 that was DECLINED; it is
    therefore recorded as no acquisition/PE edge (a declined offer transfers no
    ownership). Neutral-language note: the record asserts only the disclosed
    founder ownership; no conclusion about editorial control is drawn.
    (5) Both sources used are Tier 2 (ESTABLISHED_INDUSTRY_PUBLICATION:
    Wikipedia and TechSpot). No Tier 1 primary source (e.g. a BC corporate
    registry / Canada federal corporation record for "Linus Media Group Inc.",
    or a direct WAN Show creator statement) was captured here — leads for a
    reviewer wanting Tier 1 corroboration of the sole-shareholder structure and
    incorporation details. entity_type for Yvonne Ho and Terren Tong is PERSON
    (neither is an on-camera CREATOR); reviewer may reassess if the DB prefers
    otherwise.
  last_reviewed_at: 2026-07-23
