# CHANNELWATCH research record — Linus Tech Tips (Linus Media Group)
#
# DRAFT for human review. Nothing here is published without verification.
#
# Profile: creator-founded flagship channel operated by a founder-owned company.
# The Linus Tech Tips YouTube channel is operated by Linus Media Group Inc.
# (LMG), a privately held Canadian company founded by Linus Sebastian and his
# wife Yvonne Ho in 2012. Per LMG's own reporting and secondary coverage,
# Sebastian and Ho remain the sole shareholders and directors — i.e. the
# channel is CREATOR-OWNED through a founder-controlled company. No external
# investment or private-equity involvement was found; on the contrary, a ~$100M
# buyout offer was publicly disclosed as DECLINED in 2023. A leadership change
# (not an ownership change) is recorded: Sebastian stepped down as CEO effective
# 2023-07-01, replaced by Terren Tong, while retaining ownership and moving to a
# "Chief Vision Officer" role.

