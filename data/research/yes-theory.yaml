    EXPECTED CLASSIFICATION: CREATOR_OWNED. The channel's active owners are its
    three continuing co-founders (Matt Dajer/Dahlia, Thomas Brag, Ammar Kandil),
    each encoded PARTIALLY_OWNS channel + CONTROLLING (rels 0-2) under the
    joint-sole-owner convention. No company, PE, corporate, or external-funding
    owner is in the active ownership chain. Confidence ~0.65 (min over the
    load-bearing chain: Matt's inferred ownership edge is the weakest link).
    REVIEWER FLAG: unlike linus-tech-tips / good-mythical-morning / try-guys /
    critical-role (creators own a COMPANY that owns the channel), NO distinct
    operating company is documented here as the channel's owner, so creators are
    modeled as DIRECT joint owners of the channel. If the classifier's
    creator-owned rule requires a creator-controlled COMPANY intermediary rather
    than direct personal ownership, a reviewer should confirm the label still
    resolves to CREATOR_OWNED (it should — direct creator ownership is the base
    creator-owned case), and should seek a primary/registry source for the actual
    operating entity (an LLC likely exists but was not found in any Tier 1/2
    source; Seek Discomfort is the apparel brand, launched May 2018, not shown to
    be the channel's owner).

    CHANNEL ID: UCvK4bOhULCpmLabd2pDMtnA, taken from the raw @YesTheory page HTML
    "externalId" and cross-checked against YouTube's own RSS feed (yt:channelId +
    title + author all "Yes Theory").

    VERIFICATION POINT 1 — THE SNAP RELATIONSHIP WAS A PRODUCTION DEAL, NOT
    OWNERSHIP (the crux the task asked to verify). Near the end of 2015 the group
    was offered relocation to Venice, CA and PAID TO MAKE VIDEOS for Snapchat by
    Vertical Networks (a paid content-production/commissioning deal, reported as
    roughly year-long, after which the team refocused on YouTube). This never
    transferred ownership of the Yes Theory YouTube channel to Snap or Vertical
    Networks. IMPORTANT CORRECTION: Wikipedia calls Vertical Networks a "Snapchat
    subsidiary," but Digiday (citing Recode) shows Snap held only a ~40% MINORITY
    stake in Vertical Networks — an independent Venice studio founded by Elisabeth
    Murdoch. Snap therefore neither owned Vertical Networks outright nor owned Yes
    Theory. Modeled as: a NON-ownership DISTRIBUTED_BY edge on the Yes Theory BRAND
    (rel 11, LICENSE, ENDED), plus context that Snap PARTIALLY_OWNS Vertical
    Networks at ~40% MINORITY (rel 12). Both are OUTSIDE the channel's ownership
    chain and do not affect the served classification; they surface the Snap era
    without ever implying Snap controlled the channel.

    VERIFICATION POINT 2 — DEPARTURES ARE ROLE CHANGES, NOT DOCUMENTED EQUITY
    CHANGES (per task instruction to model departures with dates only as
    documented). (a) Derin Emre co-founded Yes Theory (rel 6) and left the group in
    2017 (reported passport issue); recorded ONLY at the role level (rel 10,
    HOSTED_BY ENDED). No buyout/equity change is documented, so no ownership edge
    is asserted or ended for Derin, and he is NOT modeled as a current owner.
    (b) Matt Dahlia announced on 2021-02-25 that he would stop appearing on camera
    but "continues to work on the brand" — a role change only (rel 8, HOSTED_BY
    ENDED 2021-02-25). He RETAINS ownership (rel 0, ACTIVE). No source documents any
    equity change for Matt.

    DATES / JUDGMENT CALLS: (1) FOUNDED_BY effective_from OMITTED (founding year
    2015 documented; no full ISO founding/channel-creation date found — a reviewer
    with the channel's "joined" date may fill this in). (2) Derin's HOSTED_BY
    effective_to OMITTED (year 2017 documented, no full ISO date). (3) The Snap-era
    DISTRIBUTED_BY edge (rel 11) has both dates OMITTED (relocation 2016; Snap
    Original "Yes Theory" series aired summer 2017; exact start/end not
