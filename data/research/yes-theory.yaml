# CHANNELWATCH research record — Yes Theory
#
# DRAFT for human review. Nothing here is published without verification.
# reviewed_by is intentionally UNSET (not yet reviewed).
#
# Profile: a creator-OWNED channel with a NON-ownership Snapchat-era production
# relationship. Yes Theory began in Montreal in summer 2015 as a challenge
# series ("Project 30" -> "Generation Y Not" -> "Yes Theory") made by four
# co-founders: Matt Dajer (now Matt Dahlia), Thomas Brag, Ammar Kandil and
# Derin Emre. Near the end of 2015 the group was offered relocation to Venice,
# California and PAID TO MAKE VIDEOS for Snapchat by Vertical Networks — a paid
# content-production/commissioning deal, NOT a sale or an ownership transfer of
# the YouTube channel. The channel has been creator-operated throughout.
#
# TWO VERIFICATION POINTS THAT SHAPE THIS RECORD (see notes for detail):
# (1) The Snap relationship was a PRODUCTION DEAL, not ownership. Wikipedia calls
#     Vertical Networks a "Snapchat subsidiary," but that is imprecise: Vertical
#     Networks was Elisabeth Murdoch's independent Venice studio in which Snap held
#     only a ~40% MINORITY stake (Recode, via Digiday). Snap therefore never owned
#     the Yes Theory channel, and Vertical Networks did not control it. The Snap
#     era is modeled as a NON-ownership, historical DISTRIBUTED_BY edge on the
#     Yes Theory BRAND (rel 11) that does NOT enter the ownership classification.
# (2) DEPARTURES are ROLE changes, not documented equity changes. Derin Emre left
#     the group in 2017 (passport issue); Matt Dahlia announced 2021-02-25 he would
#     stop appearing on camera but "continues to work on the brand." No source
#     documents any buyout or equity change, so departures are recorded only at the
#     HOSTED_BY (on-camera) role level; no ownership edge is asserted or ended.

