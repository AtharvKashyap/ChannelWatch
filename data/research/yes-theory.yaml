  # ===================== SNAPCHAT ERA (NON-ownership, historical) =====================
  # 11: Near the end of 2015 the group was offered relocation to Venice, CA and
  # PAID TO MAKE VIDEOS for Snapchat by Vertical Networks — a paid content
  # production/commissioning deal. Modeled as a NON-ownership, historical
  # DISTRIBUTED_BY edge on the Yes Theory BRAND (control_level LICENSE) to make
  # explicit that Vertical Networks held a commissioning/distribution arrangement,
  # NOT ownership of the brand or the YouTube channel. status ENDED (the reported
  # ~year-long deal concluded and the team refocused on YouTube). effective dates
  # OMITTED: only the year(s) are documented (relocation 2016; Snap Original series
  # aired summer 2017) — no full ISO date found. This edge does NOT enter the
