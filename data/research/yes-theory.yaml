  # Elisabeth Murdoch's independent Venice studio, NOT a Snap-controlled subsidiary.
  # MINORITY / ownership_percentage 40. This corrects Wikipedia's imprecise
  # "Snapchat subsidiary" phrasing and is why the Snap relationship confers no
  # control over Yes Theory. Whether Snap still holds this stake today is NOT
  # documented (flagged); the ~40% figure is a ~2017 snapshot. This edge is OUTSIDE
