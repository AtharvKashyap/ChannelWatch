  - subject: yt_brand
    type: DISTRIBUTED_BY
    object: vertical_networks
    control_level: LICENSE
    confidence: 0.7
    status: ENDED
  # 12: CONTEXT for what Vertical Networks was. Snap Inc. held a MINORITY (~40%)
