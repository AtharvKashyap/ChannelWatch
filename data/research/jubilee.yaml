# CHANNELWATCH research record — Jubilee (Jubilee Media)
#
# DRAFT FOR HUMAN REVIEW. Nothing here is published without human verification
# (Spec §12.7). Classification is COMPUTED by the importer, never asserted here.
#
# Profile: a founder-led, privately-held MEDIA COMPANY that owns/operates its
# eponymous YouTube channel and has taken documented, NON-controlling external
# venture/angel funding. The central factual distinction this record encodes:
#
#   channel (Jubilee)
#     └─ OWNS ──────────── Jubilee Media  (American media company; the channel's
#          │               core product / same business identity)
#          ├─ FOUNDED_BY ── Jason Y. Lee  (founded 2010 as a non-profit; the
#          │                company became for-profit in 2017)
#          └─ INVESTED_IN ← Strong Ventures  (lead of the Sept 2022 $1.1M
#                           seed-plus round) — a MINORITY venture investment,
#                           NOT ownership or control of the channel.
#
# Minority VC/angel investment is recorded as INVESTED_IN + control_level
# MINORITY into the COMPANY. Per direct-owner rules v2, a sub-majority
# INVESTED_IN edge is NOT ownership — it does not make any investor the channel's
# owner. See review.notes for the ownership-vs-investment reasoning and the
# expected computed classification.

