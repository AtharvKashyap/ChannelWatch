review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally OMITTED: this is an unverified DRAFT (the schema
  # field is optional, not nullable). Do NOT set it without human review.
  last_reviewed_at: 2026-07-23 # research/authoring date; NOT a human review date.
  notes: >-
    DRAFT for human review — "founder-led private media company with documented,
    NON-controlling external venture/angel funding" case. Requires human
    verification before publication.

    CHANNEL ID. UCJjSDX-jUChzOEyok9XYRJQ, taken from the "externalId" field in
    the raw HTML of https://www.youtube.com/@jubilee (curl, no JS execution),
    captured adjacent to "canonicalBaseUrl":"/@jubilee". Distinct from other
    externalId/channelId values in the page source, including the related
    @twobilee channel and featured/recommended modules. Reviewer should confirm
    against the live channel.

    OWNERSHIP vs INVESTMENT — the core finding. The channel is the flagship asset
    of Jubilee Media, an American media company founded by Jason Y. Lee (Founder
    and CEO). The company has raised only modest external capital — "over
    $650,000" before its 2017 non-profit-to-for-profit transition (Wikipedia) and
    a "$1.1 million seed-plus round" led by Strong Ventures in September 2022,
    with $3.25M raised in total to date (Tubefilter). Every documented outside
    check is a MINORITY venture/angel investment; NO source found states that any
    investor holds a controlling or majority stake, nor that Jubilee was acquired.
    Accordingly the investors are recorded as INVESTED_IN + MINORITY into the
    COMPANY, which under direct-owner rules v2 is NOT ownership of the channel.
    Reviewer: do NOT let the roster of high-profile angel investors be read as
    ownership or control of the channel. (Legal-risk policy: "investment is not
    proof of editorial control"; describe structure, never imply misconduct.)

    EXPECTED COMPUTED CLASSIFICATION. With the direct channel owner being a
    COMPANY (Jubilee Media), no PRIVATE_EQUITY_FIRM / PORTFOLIO_COMPANY_OF edge in
    the chain, and no DOCUMENTED controlling-equity edge from Jason Y. Lee into
    the company, the classifier should compute CORPORATE_OWNED (direct owner:
    Jubilee Media; explanation DIRECT_OWNER_CONFIRMED). The minority INVESTED_IN
    edge does NOT change this (the EXTERNALLY_FUNDED rule requires a CREATOR/PERSON
    direct owner, which is not the case here). Confirm the computed label at
    import.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) rel 0 (Jubilee Media OWNS channel, CONTROLLING, conf 0.8). No fetched
    source states channel ownership verbatim; it is the structural identity
    between the company and its eponymous channel (sources use "Jubilee" for both
    the company and the YouTube channel interchangeably; the 2022 coverage treats
    the channel as the company's core asset). A reviewer may prefer OPERATES if a
    stricter reading is wanted — note that OPERATES does NOT resolve as an
    ownership edge in the classifier and would yield OWNERSHIP_UNCLEAR
    (NO_OWNERSHIP_EVIDENCE) instead. Jubilee Media's exact legal name/jurisdiction
    were not verified (recorded jurisdiction US at country precision only).
    (2) CREATOR-CONTROL / potential CREATOR_OWNED flip. Jason Y. Lee is founder
    AND CEO of a lightly-funded private company, which in practice usually implies
    founder control — BUT no source found documents his equity percentage or a
    controlling stake, and a bare FOUNDED_BY does NOT satisfy the
    creator-controlled-company rule (precision over recall). If a reviewer LOCATES
    documentation of Lee's controlling equity (e.g. a cap table, a "majority
    owner" statement, or a CONTROLS relationship), adding a CONTROLS or a
    CONTROLLING PARTIALLY_OWNS edge from jason_lee -> jubilee_media would flip the
    computed label to CREATOR_OWNED (explanation CREATOR_CONTROLLED_COMPANY). This
    is deliberately NOT asserted here for lack of evidence — it is the single most
    important item for the reviewer to resolve, as it changes the badge.
    (3) rel 1 (FOUNDED_BY). Founded 2010 as a non-profit; company became for-profit
    in 2017 (Wikipedia). Day/month precision not established, so effective_from is
    omitted rather than guessed. The 2010 founding date and the 2017 for-profit
    transition are recorded in the source excerpt, not as relationship dates.
    (4) rel 2 (Strong Ventures INVESTED_IN, MINORITY, 2022-09-28). effective_from
    is the Tubefilter announcement date, which for this small round is also the
    only dated marker available; treat it as announcement-dated pending a primary
    source (no regulatory filing / investor portfolio listing for this round was
    located). control_level MINORITY reflects "lead investor in a $1.1M seed-plus
    round" with no controlling stake stated. Named angel co-investors (Steve Chen,
    Sam Yam, Stanley Tang, Patrick Lee, Mike Lu, Jeremy Lin) are captured in the
    source excerpt but NOT modeled as individual entities — all are equally
    minority and adding six PERSON nodes adds no classification signal; a reviewer
    may add them if per-investor granularity is later wanted.
    (5) EARLIER ROUND(S) NOT MODELED AS EDGES. An early raise of "over $650,000"
    (pre-2017, enabling the for-profit transition; Wikipedia) is documented as
    context but NOT recorded as an INVESTED_IN edge because no investor is named in
    a fetched source and the date is imprecise. Secondary databases (Tracxn /
    Crunchbase / PitchBook, seen only via search snippets, not fetched) reference
    additional institutional investors (e.g. UpHonest Capital, Civic Accelerator)
    and an ~Oct 2019 valuation of ~$9.5M, implying a 2019-era round; these were
    NOT fetchable/verifiable here and are left for a reviewer with database access
    to confirm and add with firm dates. A CNBC 2021 profile (search snippet only;
    the page returned HTTP 403 to the fetcher) references early backer Laura Huang
    — not recorded as an edge pending a verifiable, fetchable source and a clear
    investor-vs-advisor role.
    (6) NO PE INVOLVEMENT. No PRIVATE_EQUITY_FIRM entity and no
    PORTFOLIO_COMPANY_OF edge — the §14.3 PE-label gate does not apply. Strong
    Ventures is recorded as VENTURE_CAPITAL_FIRM.
    (7) SOURCES. Both supporting sources are Tier 2 (ESTABLISHED_INDUSTRY_
    PUBLICATION): Wikipedia and Tubefilter (the latter an exclusive with the
    company's founder/CEO). No Tier 1 primary source (regulatory filing, corporate
    registry record, or official acquisition announcement) was located; nothing
    here should be treated as CONFIRMED without further primary-source diligence.
    archive_urls should be captured at review.
