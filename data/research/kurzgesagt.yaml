review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally omitted: not yet reviewed (schema treats
  # reviewed_by as optional-string; null is not a valid value, so the field is
  # left unset for this unverified draft).
  notes: >-
    DRAFT for human review — "independent, creator-owned studio" case. No
    external acquisition or equity investment was found; the record asserts no
    PE/corporate ownership.

    CHANNEL ID: UCsXVk37bltHxD1rDPwtNM8Q, extracted from the externalId field
    in the raw HTML of https://www.youtube.com/@kurzgesagt (curl fetch, no JS).
    Every canonicalBaseUrl on the page is "/@kurzgesagt", confirming the id
    belongs to this handle. This matches the long-publicly-known Kurzgesagt
    channel id.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) GRANTS ARE NOT OWNERSHIP. The channel received large restricted grants
    (US$570k Gates Foundation 2015; €2.97M Open Philanthropy 2022) and Wikipedia
    reports Kurzgesagt's own statement that in 2020–2022 ~65% of income came
    from viewers (merch + AdSense) and only ~24% from sponsorships/grants. These
    are funding relationships, NOT equity/ownership, and are deliberately NOT
    recorded as ownership or INVESTED_IN edges. A reviewer may optionally add
    FUNDS edges (grantor -> channel/GmbH) if the DB wants funding modelled, but
    they must not be conflated with ownership.
    (2) LEGAL ENTITY NAME DISCREPANCY. Wikipedia's infobox calls the entity
    "Kurzgesagt Inc.", but the company's own imprint and the German commercial
    register (Handelsregister München HRB 220774) give the actual legal name as
    "in a nutshell - kurzgesagt GmbH" (a German GmbH, not a US Inc.). The
    registry/official name is used as canonical_name/legal_name; "Kurzgesagt
    Inc." is retained only as an alias. Reviewer should confirm the canonical
    form.
    (3) OWNER EDGE (rel 1, dettmer OWNS channel) is the weakest-supported edge:
    it rests on Wikipedia's infobox "Owner: Philipp Dettmer" (Tier 2), not a
    Tier 1 shareholding disclosure. A German GmbH's shareholder list
    (Gesellschafterliste) is filed with the Handelsregister but was not
    retrieved here; a reviewer with Handelsregister.de access should confirm the
    actual shareholder(s) of the GmbH and whether Dettmer holds the channel
    directly or via the GmbH. control_level left UNKNOWN and confidence set low
    (0.6) to reflect this. No ownership percentage is asserted.
    (4) MANAGING-DIRECTOR CONTRADICTION. The current imprint and the who-we-are
    page list Philipp Dettmer as a managing director / "Founder & Managing
    Director", while the North Data register mirror indicates a possible
    management change with Dettmer no longer listed as Geschäftsführer as of
    ~July 2023. Because of this unresolved contradiction, NO dettmer-MANAGES
    edge with a firm date is asserted; only Peter Berger (consistently listed in
    both official sources) is recorded as MANAGES (rel 4). Reviewer should
    reconcile against the primary Handelsregister filing.
    (5) SOURCE-TYPE MAPPING. The kurzgesagt.org imprint and who-we-are pages are
    the company's own official self-disclosures; the SourceType enum has no
    "official company page" member, so DIRECT_CREATOR_CONFIRMATION (the closest
    Tier 1 "official statement" type) was used. North Data is an aggregator that
    mirrors the German Handelsregister; classified as CORPORATE_REGISTRY_RECORD
    (Tier 1) on that basis — the primary Handelsregister.de entry (same HRB
    220774) would be the ideal direct citation for verification.
    (6) DATES. channel FOUNDED_BY (rel 0) effective_from 2013-07-10 is the
    channel creation date; the GmbH's OPERATES edge (rel 2) and its formal
    existence use the 2015-09-16 incorporation date from the register. The
    studio existed as a project before the GmbH was incorporated, hence the two
    distinct dates; the GmbH FOUNDED_BY edge (rel 3) carries no day-precise date
    because no exact ISO founding day for the pre-incorporation project was
    documented.

    PROPOSED CLASSIFICATION (computed by importer, not asserted here): expected
    CREATOR_OWNED (GREEN) — founder-owned, operated through a creator-founded
    GmbH, with no external equity owner found. Confidence moderate given the
    Tier-2-only owner edge.
  last_reviewed_at: 2026-07-23
