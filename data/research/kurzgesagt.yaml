# CHANNELWATCH research record — Kurzgesagt – In a Nutshell
#
# DRAFT for human review. Nothing here is published without verification.
#
# Profile: creator-founded, creator-owned independent animation studio. The
# channel is founded and owned by Philipp Dettmer and operated by the Munich
# legal entity "In a nutshell - kurzgesagt GmbH" (Handelsregister München HRB
# 220774). No external corporate acquisition or equity investment was found.
# The channel HAS received large restricted GRANTS (Bill & Melinda Gates
# Foundation 2015; Open Philanthropy 2022) — those are funding, NOT ownership
# or equity, and are deliberately NOT recorded as ownership/investment edges
# (see review notes). No ownership CHANGE / acquisition event was found, so no
# effective_to / FORMERLY_OWNED_BY edges are recorded.

channel:
  # Extracted from the canonical externalId embedded in the raw HTML of
  # https://www.youtube.com/@kurzgesagt (curl fetch, no JS execution): the
  # page's own ytInitialData lists externalId "UCsXVk37bltHxD1rDPwtNM8Q", and
  # every canonicalBaseUrl on the page is "/@kurzgesagt", confirming this UC id
  # belongs to this handle (distinct from the unrelated "channelId" values of
  # featured/recommended channels also present in the page source).
  youtube_channel_id: UCsXVk37bltHxD1rDPwtNM8Q
  display_name: Kurzgesagt – In a Nutshell
  handle: "@kurzgesagt"

entities:
  - slug: dettmer
    canonical_name: Philipp Dettmer
    entity_type: CREATOR
    aliases:
      - Kurzgesagt

  - slug: kurzgesagt_gmbh
    canonical_name: In a nutshell - kurzgesagt GmbH
    entity_type: COMPANY
    legal_name: In a nutshell - kurzgesagt GmbH
    jurisdiction: DE
    website: https://kurzgesagt.org
    aliases:
      - Kurzgesagt GmbH
      - Kurzgesagt Inc.

  - slug: berger
    canonical_name: Peter Berger
    entity_type: PERSON

relationships:
  # 0: Channel founded by Philipp Dettmer. The Kurzgesagt YouTube channel was
  # created 2013-07-10 (Wikipedia); Kurzgesagt's own site lists Philipp Dettmer
  # as "Founder & Managing Director". effective_from is the channel creation
  # date.
  - subject: channel
    type: FOUNDED_BY
    object: dettmer
    effective_from: 2013-07-10
    confidence: 0.9
    status: ACTIVE

  # 1: Philipp Dettmer is recorded as the owner of the channel. Wikipedia's
  # infobox lists "Owner: Philipp Dettmer" and "Type: Private". control_level
  # is UNKNOWN because no source discloses a shareholding percentage or control
  # structure (a German GmbH's shareholder list is not public in the sources
  # found). confidence is moderate: the "owner" characterization rests on a
  # Tier 2 source, not a Tier 1 ownership disclosure. Flagged for reviewer.
  - subject: dettmer
    type: OWNS
    object: channel
    control_level: UNKNOWN
    confidence: 0.6
    status: ACTIVE

  # 2: The channel's business is operated by the Munich legal entity "In a
  # nutshell - kurzgesagt GmbH" (Handelsregister München HRB 220774). The GmbH
  # was incorporated 2015-09-16 (Northdata/registry); effective_from is that
  # incorporation date. OPERATES (not OWNS): the sources establish the GmbH is
  # the operating studio/legal entity behind the channel, not a disclosed
  # equity holder of the channel itself.
  - subject: kurzgesagt_gmbh
    type: OPERATES
    object: channel
    effective_from: 2015-09-16
    confidence: 0.75
    status: ACTIVE

  # 3: Philipp Dettmer founded the operating studio (Kurzgesagt); Kurzgesagt's
  # own site lists him as "Founder & Managing Director" and its timeline places
  # the GmbH / first full-time hires in 2015. No exact ISO founding day for the
  # studio-as-passion-project is documented, so no effective_from is set here
  # (the GmbH's formal incorporation date is captured on rel 2 instead).
  - subject: kurzgesagt_gmbh
    type: FOUNDED_BY
    object: dettmer
    confidence: 0.85
    status: ACTIVE

  # 4: Peter Berger is a managing director (Geschäftsführer) of the GmbH, per
  # Kurzgesagt's own imprint and the Munich commercial-register entry.
  # Recorded as MANAGES / MANAGEMENT — an operational role, not an ownership
  # claim.
  - subject: berger
    type: MANAGES
    object: kurzgesagt_gmbh
    control_level: MANAGEMENT
    confidence: 0.8
    status: ACTIVE

