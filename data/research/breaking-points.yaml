review:
  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-23
  notes: >
    No publicly documented operating company/LLC name for Breaking Points was
    located in this research pass (searched for "Breaking Points Media LLC",
    Delaware filings, corporate registries — none found), so no COMPANY
    entity is declared and no relationship asserts a corporate owner distinct
    from the two hosts. The OWNS edges (relationships 4-5) rest on the hosts'
    own launch-day framing ("we don't have billionaires/corporations backing
    ... we do have YOU") plus press describing it as their "independent
    venture" / hosts holding "editorial control" — this is suggestive of
    creator ownership but no source gives a percentage split, a legal entity
    name, or an explicit "we own this show" statement, hence UNKNOWN
    control_level and moderate (0.55) confidence rather than high. A human
    reviewer with access to corporate-registry search tools (Delaware/other
    state filings) should check for a "Breaking Points Media" or similar LLC
    that could upgrade these to Tier-1-backed COMPANY-entity relationships.
    Also could not access an Axios (2021-07-06, "Corporate Media Backlash
    Fuels New Upstarts") or New Yorker (2022-06-15, "The Rise of the
    Internet's Creative Middle Class") piece that Wikipedia cites and that
    may contain additional detail on revenue structure — both are leads for
    follow-up, not used as sources here. Rotational/guest hosts (e.g. Ryan
    Grim, Emily Jashinsky) who joined later are out of scope for this record,
    which covers only the two founding hosts. YouTube channel id confirmed by
    fetching https://www.youtube.com/@breakingpoints and extracting the
    canonical "externalId" from the raw page HTML.
  last_reviewed_at: 2026-07-23
