# This is a fixture: every entity, channel id, source, and URL below is invented.
# It exists to exercise the importer end to end (it derives PE_BACKED). The
# `fixture: true` flag keeps it OUT of real imports — the importer only processes
# it when invoked with `--include-fixtures`.
fixture: true

channel:
  # §35 uses the placeholder "UC123456789", which is not a canonical 24-char id;
  # this fixture uses a valid (still fictional) canonical id so it passes the
  # strict schema regex.
  youtube_channel_id: UCExampleFixtureChannel1
  display_name: Example Channel
  handle: "@examplechannel"

entities:
  - slug: media
    canonical_name: Example Media LLC
    entity_type: COMPANY
    legal_name: Example Media LLC
  - slug: capital
    canonical_name: Example Capital Partners
    entity_type: PRIVATE_EQUITY_FIRM
    legal_name: Example Capital Partners, L.P.
  - slug: creator
    canonical_name: Original Creator
    entity_type: CREATOR

relationships:
  # 0: Example Media LLC OWNS the channel (direct owner).
  - subject: media
    type: OWNS
    object: channel
    control_level: CONTROLLING
    effective_from: 2025-03-12
    confidence: 0.93
    status: ACTIVE
  # 1: Example Media is a portfolio company of the PE firm (PE-implying edge).
  - subject: media
    type: PORTFOLIO_COMPANY_OF
    object: capital
    confidence: 0.93
    status: ACTIVE
  # 2: the original creator still hosts the channel.
  - subject: channel
    type: HOSTED_BY
    object: creator
    confidence: 0.8
    status: ACTIVE

