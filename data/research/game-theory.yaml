  notes: >
    DRAFT — requires human review. FLAGSHIP channel of Theorist Media; SIBLING of
    The Film Theorists (data/research/the-film-theorists.yaml). Theorist Media,
    Lunar X, MatPat and Stephanie Patrick entities are REUSED VERBATIM from that
    record (same slugs, canonical_names, aliases, legal_name/jurisdiction) so the
    shared-parent ownership graph links. Tom Robinson is the only NEW entity.

    OWNERSHIP / INVESTMENT VERIFICATION (per brief). The single ownership/outside-
    investment event is Lunar X acquiring the MAJORITY of Theorist Media, announced
    2022-12-20 (T1 MatPat video + T2 Tubefilter). MatPat sold the majority (not
    necessarily 100%); the stake percentage and deal price are UNDISCLOSED, so no
    ownership_percentage is asserted. No LATER equity/ownership change was found.
    The 2024 signing with talent-management firm Night (Variety, 2024) is a
    MANAGEMENT relationship, not an ownership transfer, and is deliberately NOT
    modeled as an ownership edge. As in the sibling record, the "Lunar X is a
    GoDigital Media Group company" premise is UNVERIFIED (Lunar X GmbH is described
    as an independent, Berlin-based, VC-backed company founded 2021 by Lucas
    Kollmann); GoDigital is OMITTED per precision-over-recall.

    ROLE CHANGE (2024, NOT an ownership change). MatPat stepped down as on-camera
    host (announced 2024-01-09; final host episode 2024-03-09 per Tubefilter). Tom
    Robinson — with Theorist since 2020 (writer -> creative director) — became the
    new Game Theory host (rel 6). This is a host/role change only; it does not
    touch the Theorist Media <- Lunar X ownership chain.

    DATE DISCREPANCY TO RESOLVE. rel 5/6 use 2024-03-09, the T2 Tubefilter
    "final episode March 9" date, chosen as the best-sourced operative handover
    date and for consistency with the sibling record. Fan wikis (unusable Tier 4)
    variously cite Tom's first host episode ~March 16 and "MatPat's FINAL Theory"
    ~March 21, 2024, reflecting an overlapping "final 10 theories" rollout. A
    reviewer should confirm the exact last-MatPat-hosted / first-Tom-hosted upload
    dates against primary uploads if a more precise operative date is needed.

    CONFIDENCE. (0) Theorist Media OWNS channel: HIGH-ish; Game Theory is the
    original Theorist Media channel (T1 + T2). Operating/holding legal entity for
    the channel not pinned; control modeled CONTROLLING. (1) Lunar X OWNS Theorist
    Media: HIGH (T1 + T2). (2-4) Founding edges: MatPat created Game Theory (2011);
    MatPat & Stephanie founded/ran Theorist Media (he=CEO, she=COO post-sale). No
    effective_from asserted on founding edges (exact channel-launch day not pinned;
    year 2011 documented). (5) MatPat HOSTED_BY ended 2024-03-09. (6) Tom Robinson
    new host from 2024-03-09 (T2, named specifically for Game Theory). (7) MatPat
    continued CREATIVE_CONTROL_BY (MANAGEMENT), LOW confidence — the "creative
    director" quote is framed across the Theory channels generally; reviewer may
    drop or refine.

