  notes: >
    DRAFT — requires human review. Pure corporate-owned case commissioned as
    such and confirmed by research.

    CHANNEL ID. UC295-Dw_tDNtZXFeAPAW6Aw extracted from the "externalId" field
    in the raw HTML of https://www.youtube.com/@5MinuteCraftsYouTube (curl
    fetch, no JS, 2026-07-23); the /channel/UC295-Dw_tDNtZXFeAPAW6Aw URL
    resolves to the same channel.

    OWNERSHIP (rel 0). TheSoul Group (formerly TheSoul Publishing) operates
    5-Minute Crafts as an in-house brand. Backed by the company's own about
    page (T3, lists it as "the No. 1 DIY digital brand in the world") and The
    Hollywood Reporter (T2, portfolio channel). No ownership percentage is
    published, so ownership_percentage is omitted and CONTROLLING is an
    INFERENCE from the house-brand relationship, not a stated figure —
    reviewer to confirm this inference is acceptable. Note the two supporting
    sources are T3 + T2 (no T1 acquisition/registry doc), because this is a
    company-created channel rather than an acquired one; reviewer may want to
    add a Cyprus corporate-registry record for ADME (CY) LTD as a T1 anchor.

    FOUNDERS (rels 1-2). Pavel Radaev and Marat Mukhametov are consistently
    named as founders/co-CEOs (THR T2; corporate page T3; PR Newswire 2022
    release). Modeled as FOUNDED_BY with NO ownership stake and NO
    control_level: individual ownership splits are undisclosed, and both
    founders stepped away from day-to-day operations to non-executive advisory
    roles in Oct 2022 (Arthur Mamedov became CEO). Consequently this record
    should NOT resolve as creator-owned — FOUNDED_BY alone, absent a
    documented controlling stake, is not creator control. EXPECTED
    CLASSIFICATION: CORPORATE_OWNED (direct owner is a for-profit COMPANY;
    explanation code DIRECT_OWNER_CONFIRMED).

    ENTITY / LEGAL NAME. Corporate about page (thesoul.group) shows the legal
    entity as ADME (CY) LTD and the current trading name as TheSoul Group
    (renamed from TheSoul Publishing); jurisdiction CY (Cyprus, HQ Limassol).
    AdMe is the founders' earlier Kazan-based venture from which the company
    grew; kept only as an alias. The exact Cyprus registration number was not
    verified in this pass — confirm at review.

    DATE PRECISION. effective_from omitted throughout: the 5-Minute Crafts
    channel is widely dated to 2016 but no fetchable T1/T2 source pinned an
    exact launch date, and sources disagree on the company's founding year
    (Wikipedia/most coverage: 2016 in Limassol; THR frames a 2003 B2B-blog
    origin as AdMe and a 2015 shift to video). Rather than assert a conflicting
    date, all founding/launch dates are left unstated and flagged here.

    SOURCE_TYPE FIT (reviewer note). The 2022 PR Newswire item is a company
    self-published statement, not an acquisition announcement; the enum has no
    generic "official corporate statement" type, so it is recorded
    conservatively as ARCHIVED_CORPORATE_PAGE (T3) rather than inflated to a
    T1 acquisition type. It backs only the founder edges (identity + advisory
    move), not the ownership edge. No Wayback snapshot was available for this
    URL at research time (archive.org "closest" returned none); reviewer should
    capture one. Snapshots WERE captured for the about page and THR (archive
    URLs recorded).

    DATA-QUALITY-RELEVANT FACTS (neutral). Reporting notes TheSoul's
    high-volume, format-driven output and that some content has drawn criticism
    for accuracy (e.g. a 2019 episode on a related TheSoul channel with
    historically inaccurate claims that the company removed and apologized for).
    Recorded here only as neutral context bearing on content data-quality; it
    is NOT an ownership fact and implies no misconduct in ownership. No claim of
    editorial interference is made.

    LEGAL/NEUTRALITY. Language describes ownership/operating structure only.
    Exact ownership percentages are undisclosed and left unstated; founders'
    individual stakes are unknown and not asserted.
