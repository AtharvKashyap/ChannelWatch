relationships:
  # 0: Channel founded by Sam Denby. Wikipedia states the channel was "created in
  # 2010"; the Wendover Productions brand/uploads are widely dated to 2015. Day/
  # month precision and the 2010-vs-2015 characterization are unresolved, so
  # effective_from is OMITTED rather than guessed (see notes 3). Pre-dates all of
  # Denby's Nebula/Standard business activity below.
  - subject: channel
    type: FOUNDED_BY
    object: denby
    confidence: 0.85
    status: ACTIVE

  # 1: Sam Denby owns/controls the channel. Recorded OWNS + CONTROLLING with
  # ownership_percentage OMITTED. This is the load-bearing edge for the
  # classification and is partly an INFERENCE FROM DOCUMENTED ABSENCE: every
  # source presents Wendover as Denby's own channel/studio and NONE reports any
  # external owner, investor, or acquirer of the CHANNEL itself. No explicit
  # "Denby owns 100% of the Wendover channel" statement or corporate filing was
  # located, so no percentage is asserted. Confidence 0.7. Flagged (notes 2).
  - subject: denby
    type: OWNS
    object: channel
    control_level: CONTROLLING
    confidence: 0.7
    status: ACTIVE

  # 2: Sam Denby is the channel's principal on-camera host/creator. Distinct from
  # the ownership edge. Well documented and ongoing.
  - subject: channel
    type: HOSTED_BY
    object: denby
    confidence: 0.9
    status: ACTIVE

  # 3: Ad sales / sponsorship for the channel are handled by Standard Broadcast
  # LLC — the agency Denby developed with Dave Wiskus (from ~2018) to secure
  # sponsorships for his YouTube content. Recorded AD_SALES_BY (subject: channel)
  # with control_level MANAGEMENT: this is a monetization/representation
  # relationship, NOT ownership or control of the channel. Does not put Standard
  # above the channel in the ownership chain.
  - subject: channel
    type: AD_SALES_BY
    object: standard_broadcast
    control_level: MANAGEMENT
    confidence: 0.6
    status: ACTIVE

  # 4: Sam Denby is a minority owner of the Nebula streaming platform (Wikipedia:
  # "became a minority owner in Nebula in 2020"). This is an OUTBOUND stake from
  # Denby INTO Nebula (Denby owns part of the platform) — it does NOT make Nebula
  # an owner of this channel. PARTIALLY_OWNS + MINORITY. Year-only ("in 2020"), so
  # effective_from omitted. OUTSIDE the channel ownership chain.
  - subject: denby
    type: PARTIALLY_OWNS
    object: nebula
    control_level: MINORITY
    confidence: 0.75
    status: ACTIVE

  # 5: Standard Broadcast operates the Nebula platform. Tubefilter (2021):
  # "Operational and creative control remains in the hands of Standard, and
  # Standard answers only to the creators." Recorded OPERATES + MANAGEMENT. This
  # edge terminates at Nebula and is unrelated to the channel's ownership.
  # (Secondary sources also describe Standard as holding the majority of Nebula's
  # equity; that equity split is not cleanly primary-sourced here — see notes 5.)
  - subject: standard_broadcast
    type: OPERATES
    object: nebula
    control_level: MANAGEMENT
    confidence: 0.7
    status: ACTIVE

  # 6: CuriosityStream took a documented MINORITY stake in Nebula, announced Sept
  # 2021, with a Nebula board seat and "options and milestones to invest more."
  # INVESTED_IN + MINORITY, terminating at NEBULA (the platform) — NOT at this
  # channel. effective_from omitted (only the Sept 2021 announcement window is
  # documented; operative close date not stated — recorded on the source's
  # published_at instead). OUTSIDE the channel ownership chain.
  - subject: curiosity
    type: INVESTED_IN
    object: nebula
    control_level: MINORITY
    confidence: 0.8
    status: ACTIVE

