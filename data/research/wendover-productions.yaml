# CHANNELWATCH research record — Wendover Productions (Sam Denby)
#
# DRAFT for human review. Nothing here is published without verification.
# Classification is COMPUTED by the importer, never asserted here.
#
# Profile: creator-founded, creator-owned edutainment channel. Wendover
# Productions is Sam Denby's flagship YouTube channel; he founded, owns, and
# hosts it, and also runs the sibling channels Half as Interesting, Extremities
# (podcast) and Jet Lag: The Game. No external acquisition of, or equity
# investment IN, the Wendover Productions CHANNEL was found.
#
# CRITICAL DISTINCTION this record encodes: Denby co-founded and is a minority
# owner of the creator-owned STREAMING PLATFORM Nebula (operated by Standard
# Broadcast LLC), and CuriosityStream took a documented minority stake in Nebula
# in Sept 2021. Those equity relationships attach to NEBULA (the platform),
# NOT to this YouTube channel. They are modelled here — precisely typed — as a
# sub-graph that terminates at Nebula and is OUTBOUND from Denby (Denby owns part
# of Nebula), so they place no owner above the channel. The channel's only owner
# is the creator himself. Expected computed classification: CREATOR_OWNED.

