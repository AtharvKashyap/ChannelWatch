    Requires human verification before publication.

    2026-07-30 VERIFICATION (triage: OWNS->MEDIA_NETWORK edge, Nebula). Confirmed
    the Nebula sub-graph is modelled correctly and needs NO structural change: the
    only Nebula edge originating from this record's principals is rel 4 (denby
    PARTIALLY_OWNS nebula, MINORITY) — an OUTBOUND stake from the creator INTO the
    Nebula platform. There is NO edge with Nebula as subject over the channel;
    Nebula never sits above the channel in the ownership chain. rels 5-6 (Standard
    Broadcast OPERATES Nebula; CuriosityStream INVESTED_IN Nebula) also terminate
    at Nebula and do not touch the channel. The channel's only owner/controller
    remains the creator (rel 1, denby OWNS channel, CONTROLLING), so the record
    still computes CREATOR_OWNED. Only last_reviewed_at and this note were changed.

    CHANNEL ID: UC9RM-iSvTu1uPJb8X5yp3EQ, extracted from the sole "externalId"
    field in the raw HTML of https://www.youtube.com/@Wendoverproductions (curl
    fetch, no JS execution). Dominant canonicalBaseUrl "/@Wendoverproductions"
    (82 occurrences); vanityChannelUrl "http://www.youtube.com/@Wendoverproductions".
    Sibling handles (@halfasinteresting, @Extremities, @jetlagthegame,
    @samfromwendover993) also appear in the source but are distinct channels.
    Matches the long-publicly-known Wendover Productions channel id.

    EXPECTED COMPUTED CLASSIFICATION: CREATOR_OWNED (GREEN). The channel's only
    owner/controller is the CREATOR himself (rel 1, denby OWNS channel,
    CONTROLLING). No company, network, or external investor sits ABOVE the channel
    in the ownership chain. The Nebula sub-graph (rels 4–6) is OUTBOUND from Denby
    / terminates at Nebula and never points at the channel, so it does not change
    the channel's direct owner. No PRIVATE_EQUITY_FIRM entity and no
    PORTFOLIO_COMPANY_OF edge, so the §14.3 PE-label evidence gate does not apply.

    NEBULA vs CHANNEL — the core finding a reviewer must not conflate. Sam Denby
    co-founded and is a minority owner of Nebula, the creator-owned streaming
    PLATFORM (operated by Standard Broadcast LLC / "Standard"; he was also named
    Nebula's chief content officer in Aug 2023). CuriosityStream took a documented
    MINORITY stake in Nebula in Sept 2021 (~$50M+ valuation, board seat, options
    to invest more). ALL of these equity/control facts attach to NEBULA, a
    separate company, NOT to the Wendover Productions YouTube channel. They are
    modelled precisely (rels 4–6) but deliberately kept off the channel's
    ownership chain. Per legal-risk policy: investment is not proof of editorial
    control; no conclusion is drawn about editorial influence over the channel.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) NEBULA MODELLING. Nebula is typed MEDIA_NETWORK; Standard Broadcast LLC as
    COMPANY; CuriosityStream as COMPANY. Standard OPERATES Nebula (rel 5,
    MANAGEMENT) per Tubefilter's "operational and creative control remains in the
    hands of Standard." Multiple SECONDARY sources (Medium, LegalClarity) also say
    Standard holds the MAJORITY of Nebula's equity while creators collectively
    hold 50% — an apparent tension a reviewer should reconcile with a primary
    source before recording any equity-percentage or CONTROLLING edge for Standard
    over Nebula. Not asserted here for lack of clean sourcing.
    (2) OWNER EDGE (rel 1) is the reviewer's primary focus. OWNS + CONTROLLING with
    NO percentage — partly an inference from DOCUMENTED ABSENCE (no source reports
    any external owner/investor/acquirer of the CHANNEL). Confidence 0.7. No
    percentage guessed. A US business filing / registered entity for Denby's
    Wendover studio operation would be a Tier 1 corroboration lead — none located.
    (3) FOUNDING DATE (rel 0). Wikipedia says the channel was "created in 2010";
    the Wendover brand and first uploads are widely dated to 2015 (channel
    registered years before it became active — the same account-creation vs
    activity-start gap seen on other records). The 2010/2015 discrepancy is
    unresolved and day/month precision is unknown, so effective_from is OMITTED
    rather than guessed. Reviewer to confirm against the channel's own About page
    join date and set a precise date if desired.
    (4) NO PRODUCTION-COMPANY OWNERSHIP EDGE FOR THE CHANNEL. No reliably-sourced
    legal entity that OWNS the Wendover channel was found. Standard Broadcast LLC
    is documented as Denby's SPONSORSHIP/AD-SALES agency (rel 3, AD_SALES_BY,
    MANAGEMENT) and as Nebula's operator — NOT as an owner of the channel. If a
    reviewer confirms a formal operating company that owns the channel (name,
    jurisdiction, and Denby's controlling stake), the model should move to a
    creator-controlled-company shape (creator OWNS/CONTROLLING-PARTIALLY_OWNS the
    company; company OWNS the channel), which would still compute CREATOR_OWNED.
    (5) DATES ON NEBULA EDGES. rel 4 (Denby minority owner of Nebula) is year-only
    ("in 2020", Wikipedia) → effective_from omitted. rel 6 (CuriosityStream
    INVESTED_IN Nebula) is dated to the Sept 2021 announcement window only; the
    operative close date is not stated, so effective_from is omitted and the
    announcement date is carried on the source's published_at (2021-09-21).
    (6) SOURCES. Both supporting sources are Tier 2 (ESTABLISHED_INDUSTRY_
    PUBLICATION): Wikipedia (Sam Denby) and Tubefilter. No Tier 1 primary source
    (corporate registry record for the Wendover operation or Standard Broadcast
