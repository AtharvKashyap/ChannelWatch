  notes: >-
    DRAFT for human review — "independent, creator-controlled company" case, UK
    creator, with a documented two-tier holding structure. Expected computed
    classification: CREATOR_OWNED (GREEN). The channel's ultimate controller is
    the CREATOR himself: Tom Scott → 75%+ of EXTERNAL TANK LIMITED → 75%+ of PAD
    26 LIMITED → the channel (Pad 26 is named on-channel as the production
    company). No PRIVATE_EQUITY_FIRM / PORTFOLIO_COMPANY_OF edge exists, so the
    §14.3 PE-label evidence rule is not engaged.

    CHANNEL ID: UCBa659QWEk1AI4Tg--mrJ2A, extracted from the sole "externalId"
    field in the raw HTML of https://www.youtube.com/@TomScottGo (curl fetch, no
    JS). canonicalBaseUrl "/@TomScottGo" (150 occurrences) and vanityChannelUrl
    "http://www.youtube.com/@TomScottGo" confirm the id belongs to this handle.
    Lower-frequency handles in the source (@lateralcast, @tomscottplus, @techdif)
    are related/featured channels, NOT this channel.

    COMPANY-TO-CHANNEL LINK (unusually strong): unlike most single-creator
    records, the company link is NOT an inference — the channel's own description
    states verbatim "This channel is a production of Pad 26 Limited, registered
    in England and Wales, № 11662641." Modeled as pad26 OPERATES channel
    (MANAGEMENT, conf 0.9). A reviewer may prefer pad26 OWNS channel; either
    modelling still computes CREATOR_OWNED via the creator-controlled-company
    rule, since Scott controls Pad 26 through External Tank Ltd.

    OWNERSHIP CHAIN (Tier 1, Companies House primaries):
    - PAD 26 LIMITED (11662641), incorporated 6 Nov 2018, Active, SIC 59112
      "Video production activities". Current 75%+ PSC: EXTERNAL TANK LIMITED
      (notified 27 Dec 2019). Sole director: Thomas David Scott (since 6 Nov
      2018).
    - EXTERNAL TANK LIMITED (12321615), incorporated 19 Nov 2019, Active, SIC
      64209 (holding company). 75%+ PSC: Thomas David Scott (notified 19 Nov
      2019). This is Scott's personal holding vehicle.

    JUDGMENT CALLS / ITEMS NEEDING HUMAN ATTENTION:
    (1) OWNERSHIP REORGANISATION (rel 4 → rel 5). Companies House shows Tom Scott
    was the DIRECT 75%+ PSC of Pad 26 from incorporation (6 Nov 2018) and CEASED
    on 27 Dec 2019, when EXTERNAL TANK LIMITED became the 75%+ PSC (same date).
    This is a company-level restructuring (interposing a holding company), NOT a
    change in who ultimately controls the channel — Scott remains the controller
    throughout. Recorded rel 4 as status ENDED (effective_to 2019-12-27) and rel
    5 as ACTIVE (effective_from 2019-12-27) to preserve the history at company
    level; no superseded/ENDED edge on the CHANNEL is recorded.
    (2) NO EXACT PERCENTAGES. All PSC edges use the Companies House disclosure
    band "75% or more"; ownership_percentage is omitted on rels 4/5/6.
    control_level (CONTROLLING) carries the meaning. A reviewer with the
    confirmation statement / share register could tighten these.
    (3) CREATOR-DIRECT OWNERSHIP EDGE (rel 1, tom OWNS channel, CONTROLLING, no
    %): partly an inference from documented absence — Scott is the sole
    documented public creator/host/principal and controls the full company chain,
    but no source states an explicit "owns X% of the channel". Confidence held at
    0.75. Retained as the load-bearing creator-ownership edge alongside the
    company structure (mirrors colinfurze/mrwhosetheboss modelling).
    (4) UPLOAD HIATUS (context, not an ownership signal). The main channel ended
    weekly uploads on 1 January 2024 but remains active with projects (e.g. the
    2026 "Tom Scott: England" series). Per evidence policy §4 / SPEC §13.4,
    upload-pattern changes are Tier-4 behavioural signals and are NOT treated as
    ownership evidence — noted for context only, no edge.
    (5) SEPARATE OPERATIONS / COLLABORATORS (documented, NOT modeled as channel
    ownership). "Lateral with Tom Scott" is a separate podcast operation
    co-created with David Bodycombe (question producer/exec producer), edited at
    The Podcast Studios, Dublin — it has its own handle (@lateralcast) and is not
    part of this channel's ownership. "The Technical Difficulties" is a comedy
    troupe with Matt Gray, Gary Brannan and Chris Joel (separate channel/brand).
    Matt Gray has been Scott's long-time producer/collaborator. None of these
    individuals has any documented ownership of the Tom Scott channel, Pad 26
    Limited, or External Tank Limited, so no ownership/collaborator edge is
    asserted (legal-safe: no implication of ownership or control from
    collaboration). A reviewer could add REPRESENTS/collaboration edges if the
    data model supports them, but they would not affect classification.
    (6) EXTERNAL-INVESTMENT / ACQUISITION CHECK (per task): NO external corporate
    acquisition, private-equity backing, or outside equity investment in the
    channel or either company was found. External Tank Limited is Scott's own
    holding company, not a third-party investor. Recorded as a documented
    ABSENCE, not an affirmative "verified independent" claim.
    (7) ADDRESS HANDLING. The Worthing registered-office address appears in the
    channel description and on the public register; it is a COMPANY registered
    office (legal-documents address, explicitly not a residence), so it is quoted
    within the corporate-registry excerpts as ownership-relevant provenance, but
    is NOT recorded as a creator home address (evidence-policy §5). Only
    GB/Worthing jurisdiction is kept on entities.
    (8) SOURCES. Six Tier 1 primaries (YouTube channel page + About page as
    DIRECT_CREATOR_CONFIRMATION; four Companies House CORPORATE_REGISTRY_RECORDs
    across both companies: two overviews, two PSC registers, one officers list)
    plus one Tier 2 (Wikipedia). No PE-label evidence rule engaged.
