review:
  researched_by: claude-research-agent-m1
  # reviewed_by intentionally omitted — not yet human-reviewed.
  last_reviewed_at: "2026-07-22"
  notes: >
    DRAFT — requires human review. This channel was commissioned as the
    expected "corporate-native" pilot case, but research surfaced a major,
    very recent (closed 2026-07-08, two weeks before this research pass)
    corporate restructuring that supersedes the originally expected static
    picture. Flagging for priority human attention.

    THE 2026 BREAKUP (why this record has two "Vox Media" entities). The
    company founded in 2011 as Vox Media, Inc. split in 2026: (a) Lupa
    Systems (James Murdoch's holding company) agreed 2026-05-20 and closed
    2026-07-08 to acquire New York Magazine, the Vox Media Podcast Network,
    and Vox (this YouTube channel included, per the closing PR's own
    description of Vox's "thriving YouTube channel"), operating them as a
    new subsidiary that carries the "Vox Media" name forward; (b) separately,
    Penske Media Corporation (PMC) — already Vox Media's largest shareholder
    from its 2023 investment — acquired the REMAINING brands (The Verge, SB
    Nation, Eater, Popsugar, The Dodo, Thrillist, Punch) into a new PMX
    division. Because both the original and the new entity use the name
    "Vox Media," I gave them distinct canonical_names
    (vox_media_original / vox_media_current) to avoid a natural-key
    collision in the DB; a reviewer may prefer a different disambiguation
    scheme.

    CURRENT OWNERSHIP (HIGH CONFIDENCE). As of 2026-07-08 the Vox YouTube
    channel is owned by the new Vox Media entity, a subsidiary of Lupa
    Systems, LLC (James Murdoch). Two Lupa/PR Newswire T1 releases (agreement
    2026-05-20, closing 2026-07-08) directly and explicitly name Vox/its
    YouTube channel among the acquired assets. No ownership percentage is
    stated for the subsidiary relationship; CONTROLLING is inferred from
    "subsidiary" language, not a stated percentage — reviewer should confirm
    this inference is acceptable.

    HISTORICAL CHAIN (2015-2026, now ENDED). NBCUniversal invested $200M in
    Vox Media, Inc. in 2015 (T1 Comcast PR + T2 TechCrunch); reporting
    disagrees on/omits the resulting percentage (one contemporaneous account
    attributed to Vox's CEO described Comcast's resulting stake loosely as
    "about a third," which I could not independently verify against a
    fetchable T1/T2 source in this pass, so control_level is UNKNOWN rather
    than asserting the 33% figure). Penske Media invested $100M for a stated
    ~20% stake in 2023 (T2 Inside Radio, CelebrityAccess), becoming "largest
    shareholder" — per the ground rules, this is recorded as a MINORITY
    (20%) stake, NOT majority/controlling, since no source claims majority
    control. Both investor relationships are marked ENDED as of 2026-07-08
    because the entity they applied to (vox_media_original) no longer owns
    the Vox brand/channel; I did not find a source confirming what happened
    to these specific equity stakes in the breakup (plausibly they now
    relate to PMC's separate acquisition of the non-Vox remainder, which is
    NOT modeled here since it does not touch this channel's ownership
    chain) — reviewer should treat this as an open item if a fuller
    corporate-history record is wanted.

    DATE PRECISION. Vox.com/the YouTube channel's exact launch date (widely
    reported as April 2014) was not pinned to a fetchable T1/T2 source in
    this pass, so relationship 0's effective_from is omitted rather than
    asserted from memory/secondary aggregators (e.g. Wikipedia). NBCUniversal
    (2015-08-12), Penske (deal announced 2023-02-06, reported 2023-02-07/08
    by the two T2 sources used), and the Lupa agreement/closing
    (2026-05-20 / 2026-07-08) dates are all full-precision from primary or
    T2 sources.

    NOT MODELED (out of scope for this channel). The Group Nine Media merger
    (announced 2021-12-13, closed 2022-02-22, giving Group Nine investors
    including Warner Bros. Discovery ~25% of Vox Media, Inc.) was mentioned
    in secondary sources but not independently verified to a T1/T2 primary
    source in this pass; omitted rather than included on weak sourcing.
    Reviewer may wish to add it to the historical chain if verified.
    Similarly, PMC's separate, concurrent acquisition of the non-Vox Vox
    Media brands (forming "PMX") is noted here for context only and not
    modeled as a relationship, since it does not involve the Vox channel.

    ARCHIVING. archive.org's availability API returned rate-limit errors
    (HTTP 429) for all five sources during this pass; no archive_url could
    be captured. Reviewer should archive the two prnewswire.com URLs and the
    corporate.comcast.com URL as a priority (highest-stakes T1 sources).

    CHANNEL ID. UCLXo7UDZvByw2ixzpQCufnA extracted from the "externalId"
    field in the raw HTML of https://www.youtube.com/@Vox (curl fetch,
    2026-07-22), and independently corroborated by a search result resolving
    https://www.youtube.com/channel/UCLXo7UDZvByw2ixzpQCufnA as "Vox."
