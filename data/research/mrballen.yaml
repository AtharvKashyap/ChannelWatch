    CORE MODELING DECISION — THE PODCAST DEALS ARE CONTRACTS, NOT CHANNEL OWNERSHIP.
    (1) The 2022 AMAZON MUSIC deal (announced 2022-09-28; podcast exclusive to
    Amazon Music from 2022-11-01; the show sat under Amazon's Wondery unit) was an
    EXCLUSIVE DISTRIBUTION + FIRST-LOOK + co-production arrangement for the PODCAST.
    No fetched source describes it as an acquisition of, equity stake in, or
    transfer of the "MrBallen" YouTube channel. It is modeled as a DISTRIBUTED_BY /
    LICENSE edge ON THE PODCAST entity (rel 10), status ENDED — per Wikipedia the
    podcast became "freely available across multiple platforms" as of February
    2024. effective_to is OMITTED (only a month, "February 2024," is documented;
    this is a non-ownership edge so no precise handover day is asserted).
    (2) The 2025 SIRIUSXM deal (announced 2025-10-27) is EXCLUSIVE ADVERTISING-SALES
    rights over the flagship podcast AND the YouTube channel — modeled as
    AD_SALES_BY / LICENSE (rel 11). It is the one active deal that touches the
    channel, but ad-sales representation is NOT ownership or control; AD_SALES_BY is
    not an ownership/control edge type, so it does not enter the channel's ownership
    chain and does not change the classification. Wondery is captured as an alias of
    the amazon_music entity; the 2025 SiriusXM move followed Amazon's August 2025
    wind-down of Wondery (context only).

    OWNERSHIP — the core finding. "MrBallen" is Allen's eponymous PERSONAL channel
    (launched 2020, before Ballen Studios existed in 2022); he is its sole on-camera
    creator and no source documents any sale or transfer. He is encoded as CREATOR
    OWNS channel / CONTROLLING (rel 1), the only ACTIVE channel-owning edge.
    confidence moderate (0.75): ownership rests on the eponymous/sole-creator
    identity plus the documented absence of any transfer, not on a direct ownership
    disclosure — reviewer's primary focus. No ownership percentage is asserted
    (none disclosed).

    BALLEN STUDIOS' RELATIONSHIP TO THE CHANNEL. Documented as OPERATOR, not owner:
    it is "the global content company behind" MrBallen (podnews) and manages the
    brand/produces its shows (Tubefilter). Modeled as OPERATES / MANAGEMENT (rel 3),
    a non-ownership edge — the classifier does not treat OPERATES as ownership, so
    Ballen Studios is NOT placed in the channel's ownership chain. NO fetched source
    states in a verbatim "Ballen Studios owns the MrBallen channel" form, so it is
    NOT modeled as the channel owner (precision over recall). Allen co-founded the
    studio (rel 4) with Nick Witters (rel 5, its CEO — rel 7), and CONTROLS it as
    founder/principal (rel 6, CONTROLS not OWNS: the equity split with Witters is
    undisclosed, so no cap-table claim / percentage is asserted). Even if a reviewer
    confirms Ballen Studios is the channel's operating entity, the chain stays
    CREATOR-controlled (Allen controls the studio) and the CREATOR_OWNED outcome
    would not change. No legal_name / jurisdiction / registry record for Ballen
    Studios was documented, so none is asserted.

    OUTSIDE INVESTMENT IN BALLEN STUDIOS. NONE was documented in any fetched source
    — no venture round, PE/VC investor, or acquisition of the studio was found; it
    reads as founder-owned (Allen/Witters). This is an INFERENCE FROM DOCUMENTED
    ABSENCE, not a positive "no investors" statement; a reviewer wanting certainty
    should check a corporate registry. No PRIVATE_EQUITY_FIRM / VENTURE_CAPITAL_FIRM
    entity and no PORTFOLIO_COMPANY_OF or INVESTED_IN edge exist, so the §14.3
    PE-label evidence gate does not apply. (Note: the widely reported "$1M pledge"
    is Ballen Studios / the MrBallen Foundation funding a charitable initiative —
    the studio as a GRANT-GIVER, NOT investment INTO the studio; deliberately not
