    DRAFT for human review — "independent creator-owned eponymous channel whose
    creator built a production company (Ballen Studios) around it and signed
    PODCAST distribution/ad-sales deals that are NOT channel ownership" case.
    Requires human verification before publication.

    CHANNEL ID. UCtPrkXdtCM5DACLufB9jbsA, taken from the "externalId" field in the
