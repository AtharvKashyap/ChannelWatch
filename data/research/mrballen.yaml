    EXPECTED COMPUTED CLASSIFICATION (computed by importer, not asserted here):
    CREATOR_OWNED (GREEN), explanation DIRECT_OWNER_CONFIRMED — the only ACTIVE
    channel-owning edge is Allen (a CREATOR) OWNS channel / CONTROLLING (rel 1). All
