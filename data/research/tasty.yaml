    Variety article corroborates but is behind a paywall/redirect (not used as a
    source). Bloomberg/Deadline/Variety further corroborate the deal.
    (3) All backing sources are Tier 1-2; no Tier 3/4 source supports any edge.

    LEGAL-SAFE / NEUTRALITY. Language describes ownership/operating structure only;
    no claim of editorial interference or misconduct is made. No PE-implying label
    is asserted anywhere, so the §14.3 PE-label evidence rule is not triggered.
    Exact ownership percentages are undisclosed or inconsistent and are left
