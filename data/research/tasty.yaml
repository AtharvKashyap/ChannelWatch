#
# DRAFT FOR HUMAN REVIEW — nothing here is published without human verification
# (Spec §12.7). reviewed_by is intentionally UNSET (not yet reviewed).
#
# CORPORATE-OWNED BRAND CASE. Tasty is BuzzFeed's food media brand; the channel
# is Tasty's YouTube presence, owned and operated by its corporate parent
# BuzzFeed, Inc. This parallels the 5-Minute Crafts model (a channel that is a
# house brand of a single for-profit corporate owner) rather than the Try Guys /
# Watcher creator-owned models. BuzzFeed is a REAL corporate owner of THIS
# channel (unlike the Try Guys channel, which BuzzFeed never owned). Expected
# computed classification: CORPORATE_OWNED.
#
#   channel (Tasty)
#     └─ OWNS ───────────── BuzzFeed (BuzzFeed, Inc.)
#          ├─ FOUNDED_BY ─── Jonah Peretti (founder; no individual stake asserted)
#          ├─ MANAGES ────── Jonah Peretti (CEO 2006–2026; now Pres., BuzzFeed AI) [ENDED]
#          ├─ MANAGES ────── Byron Allen (Chairman & CEO from 2026-05-27)
#          └─ PARTIALLY_OWNS  Allen Family Digital, LLC (majority stake, 2026-05-27)
#                              └─ OWNS ── Byron Allen (family office)
#
# The BuzzFeed slug/fields are reused VERBATIM from try-guys.yaml / watcher.yaml
# so the three records share the BuzzFeed entity in the whole-graph recompute
# (genuine shared-entity link: Tasty IS a BuzzFeed brand).
#
# Classification is COMPUTED by the importer, never asserted here.

