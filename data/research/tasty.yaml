  researched_by: claude-research-agent-m1
  reviewed_by: akashyap@cybastiontech.com # human-verified 2026-07-30
  last_reviewed_at: 2026-07-29
  notes: >
    DRAFT — requires human review. Corporate-owned brand case: Tasty is
    BuzzFeed's food brand and this channel is its YouTube presence.
    reviewed_by intentionally UNSET (not yet human-reviewed); last_reviewed_at
    holds the draft authoring date (schema-required), NOT a completed review.

    EXPECTED CLASSIFICATION: CORPORATE_OWNED. The channel's sole active direct
    owner is BuzzFeed (COMPANY, rel 0), a for-profit corporation, so the
    classifier's direct-corporate-owner rule fires (explanation code
    DIRECT_OWNER_CONFIRMED). This is NOT creator-owned: Jonah Peretti is modeled
    only via FOUNDED_BY (rel 1) with NO individual ownership stake asserted, which
    per the 5-Minute Crafts precedent does not confer creator control. Confidence
    ~0.9 on the load-bearing ownership edge (rel 0), backed by a Tier 1 SEC 10-K
    plus the Tier 1 YouTube feed.

    CHANNEL ID: UCJFp8uSYCjXOMnkUyb3CQ3Q, taken from the raw @buzzfeedtasty page
    HTML "externalId" and cross-checked against YouTube's own RSS feed
    (yt:channelId + title + name all "Tasty"; channel-level <published>
    2016-01-22, the account-creation date).

    OWNERSHIP (rel 0). BuzzFeed operates Tasty as an in-house brand. Backed by
    BuzzFeed's FY2024 Form 10-K (SEC, T1: "BuzzFeed's iconic, globally-loved
    brands include BuzzFeed, HuffPost, and Tasty"; "Tasty, first launched in 2015,
    pioneered the overhead video format") and the YouTube feed (T1, canonical id +
    @buzzfeedtasty handle). No ownership percentage is published, so
    ownership_percentage is omitted and CONTROLLING is an INFERENCE from the
    house-brand relationship, not a stated figure — reviewer to confirm this
    inference is acceptable. effective_from 2016-01-22 is the channel
    account-creation date; the Tasty BRAND launched in 2015 (10-K), a ~year
    earlier — the brand-launch vs channel-creation gap is flagged; a reviewer may
    prefer 2015 for a brand-level edge.

    BUZZFEED CORPORATE STATUS (context, documented). BuzzFeed, Inc. became a
    public company via a SPAC merger with 890 5th Avenue Partners, Inc. that
    completed 2021-12-03; the combined company began trading on Nasdaq under BZFD
    on 2021-12-06 and simultaneously acquired Complex Networks for $300M. Its status
    as an SEC-reporting public company is directly evidenced by the FY2024 10-K
    cited here. 2024 RESTRUCTURING (per the same 10-K): BuzzFeed sold Complex
    Networks (Feb 2024) and sold First We Feast — producer of Hot Ones — for a
    reported $82.5M (Dec 2024), alongside layoffs. None of these divestitures
    involved Tasty, which BuzzFeed retained. Recorded as neutral corporate context
    only; the SPAC completion is noted in prose and anchored to the 10-K (public
    filer) rather than given a separate source — a reviewer may add the Dec-2021
    SPAC completion 8-K / press release (businesswire 20211203005602) as a T1
    anchor if a standalone edge is desired.

    2026 CONTROL CHANGE AT THE PARENT (rels 2-5). On 2026-05-27 Byron Allen's
    family office, Allen Family Digital, LLC, completed acquisition of a MAJORITY
    stake in BuzzFeed, Inc.; Allen became Chairman & CEO and Jonah Peretti moved to
    a new role as President of BuzzFeed AI. This is a control change at the PARENT
    company, one level ABOVE the channel — the channel's DIRECT owner remains
    BuzzFeed (rel 0), so the served CORPORATE_OWNED classification is UNAFFECTED
    (evidence-first: recorded because it is the current, well-documented ownership
    fact for the parent, and enriches the ownership-history surface). PERCENTAGE
    DISCREPANCY: BuzzFeed's own announcement states "approximately 51%"; The
    Hollywood Reporter and Bloomberg report "52 percent" — because the figure
    conflicts across sources, NO numeric ownership_percentage is asserted (modeled
    as CONTROLLING majority only). rel 3 (Byron Allen controls his own family
    office) is an INFERENCE from the "Byron Allen's family office" framing —
    flagged, confidence 0.7. NOT A PE/VC CASE: Byron Allen is a media entrepreneur
    (Allen Media Group) and Allen Family Digital, LLC is a family-office vehicle,
    NOT a private-equity or venture-capital firm, so the §14.3 PE-label evidence
    rule is NOT triggered and no PE-implying label is asserted. REVIEWER JUDGMENT:
    if the classifier walks the ownership chain upward, the ultimate controller of
    BuzzFeed is an individual (Byron Allen) via a family-office COMPANY — this is
    still corporate ownership of the channel, neither creator-owned nor PE-backed.

    FOUNDERS (rel 1). Jonah Peretti is universally documented as BuzzFeed's
    founder (co-founded 2006; effective_from 2006-11-01 = the widely cited company
    founding date). Modeled as FOUNDED_BY with NO ownership stake and NO
    control_level — his individual equity is not separately disclosed here, and
    FOUNDED_BY alone is not creator control (5-Minute Crafts precedent). Co-founder
    John S. Johnson (and early chairman Kenneth Lerer) are named in some histories;
    not modeled here to avoid asserting under-documented founder edges — a reviewer
    may add them.

    POST-ACQUISITION EVENTS (neutral context, not modeled). Reporting (Deadline,
    Jul 2026) indicates BuzzFeed announced staff cuts of ~35% under Byron Allen.
    This is an OPERATIONAL/personnel event, NOT an ownership change, so it is
    noted in prose only and no edge is asserted for it (legal-safe: describes
    structure, implies no misconduct).

    SOURCE / VERIFICATION FLAGS.
    (1) rel 0 primary anchor is the FY2024 10-K (T1) cross-checked with the live
    YouTube feed (T1); the exact 10-K quote was captured via search summary of the
    SEC EDGAR filing — a reviewer should re-verify the verbatim brand-list and
