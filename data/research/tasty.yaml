relationships:
  # 0: BuzzFeed owns/operates the Tasty channel. BuzzFeed's FY2024 Form 10-K (SEC,
  # T1) lists Tasty among "BuzzFeed's iconic, globally-loved brands" and states
  # "Tasty, first launched in 2015, pioneered the overhead video format." No
  # ownership percentage is published; CONTROLLING is inferred from Tasty being a
  # wholly-operated house brand of the company (not a stated percentage).
  # effective_from 2016-01-22 = the channel account-creation date (YouTube feed);
  # the Tasty brand itself launched in 2015 (see notes).
  - subject: buzzfeed
    type: OWNS
    object: channel
    control_level: CONTROLLING
    effective_from: 2016-01-22
    confidence: 0.9
    status: ACTIVE
  # 1: Jonah Peretti co-founded BuzzFeed, Inc. (2006). FOUNDED_BY only — NO
  # individual ownership stake is asserted (his equity is not separately
  # disclosed here), so this does NOT confer creator control over the channel.
  # control_level intentionally omitted. Co-founder John S. Johnson is noted in
  # prose but not modeled (see notes).
  - subject: buzzfeed
    type: FOUNDED_BY
    object: jonah_peretti
    effective_from: 2006-11-01
    confidence: 0.85
    status: ACTIVE
  # 2: Allen Family Digital, LLC (Byron Allen's family office) acquired a majority
  # stake in BuzzFeed, Inc., closing 2026-05-27. control_level CONTROLLING. The
  # exact percentage is disclosed inconsistently across sources (BuzzFeed's own
  # announcement: "approximately 51%"; The Hollywood Reporter: "52 percent"), so
  # NO numeric ownership_percentage is asserted (documented as a majority only).
  # This is a control change at the PARENT level; the channel's DIRECT owner
  # remains BuzzFeed (rel 0), so the served classification is unaffected.
  - subject: allen_family_digital
    type: PARTIALLY_OWNS
    object: buzzfeed
    control_level: CONTROLLING
    effective_from: 2026-05-27
    confidence: 0.85
    status: ACTIVE
  # 3: Byron Allen controls Allen Family Digital, LLC (his family office / named
  # acquisition vehicle). INFERRED from the "Byron Allen's family office"
  # framing — that he controls his own family office is not stated in as many
  # words (flagged); lower confidence.
  - subject: byron_allen
    type: OWNS
    object: allen_family_digital
    control_level: CONTROLLING
    confidence: 0.7
    status: ACTIVE
  # 4: Byron Allen assumed the Chairman & CEO role at BuzzFeed on 2026-05-27. A
  # MANAGEMENT/role edge, NOT a separate ownership assertion (his control comes via
  # rels 2-3).
  - subject: byron_allen
    type: MANAGES
    object: buzzfeed
    control_level: MANAGEMENT
    effective_from: 2026-05-27
    confidence: 0.85
    status: ACTIVE
  # 5: Jonah Peretti was BuzzFeed's CEO from its 2006 founding until stepping down
  # from the CEO role on 2026-05-27, when he transitioned to the newly created
  # role of President of BuzzFeed AI. Modeled as a MANAGES (CEO) edge ENDED
  # 2026-05-27. This is a ROLE change; his co-founder status (rel 1) is unaffected.
  # His continuing President-of-BuzzFeed-AI role is noted in prose, not separately
  # modeled, to avoid over-reach.
  - subject: jonah_peretti
    type: MANAGES
    object: buzzfeed
    control_level: MANAGEMENT
    effective_from: 2006-11-01
    effective_to: 2026-05-27
    confidence: 0.8
    status: ENDED

